[package]
name = "lakko-svc-storage"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false
description = "Ciphertext blob proxy — content-addressable, ciphertext-only"

[lints]
workspace = true

[[bin]]
name = "lakko-svc-storage"
path = "src/main.rs"

[dependencies]
tokio.workspace = true
tracing.workspace = true
# ADR-0078 section 11: the request span that records the route template.
lakko-log-hygiene.workspace = true
tracing-subscriber.workspace = true
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true

axum = { version = "0.8", features = ["macros", "http2"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["trace", "limit"] }

# Session-token verification on the per-account backup endpoint —
# shares the `LAKKO_SESSION_TOKEN_SECRET` with `services/auth` (the
# issuer) and `services/discovery` / `services/ds` (the other
# verifiers). HMAC-SHA-256 over a fixed-format token; no DB
# round-trip per request.
lakko-auth-token.workspace = true

# .env loading — debug builds only; production uses systemd
# `EnvironmentFile=/etc/lakko/lakko.env`.
dotenvy = "0.15"

# Streaming SHA-256 for content-addressable PUT.
sha2 = "0.10"
hex = "0.4"

# Atomic file persist (write to tempfile, rename into place).
tempfile = "3"

# Body streaming via futures Stream.
futures = "0.3"
bytes = "1"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
tempfile = "3"
