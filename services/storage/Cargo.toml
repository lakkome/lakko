[package]
name = "lakko-svc-storage"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false
description = "Ciphertext blob proxy — content-addressable, ciphertext-only"

[lints]
workspace = true

[[bin]]
name = "lakko-svc-storage"
path = "src/main.rs"

[dependencies]
tokio.workspace = true
tracing.workspace = true
# ADR-0078 section 11: the request span that records the route template.
lakko-log-hygiene.workspace = true
lakko-metrics.workspace = true
tracing-subscriber.workspace = true
anyhow.workspace = true
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true

axum = { version = "0.8", features = ["macros", "http2"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["trace", "limit"] }

# Session-token verification on the per-account backup endpoint —
# shares the `LAKKO_SESSION_TOKEN_SECRET` with `services/auth` (the
# issuer) and `services/discovery` / `services/ds` (the other
# verifiers). HMAC-SHA-256 over a fixed-format token; no DB
# round-trip per request.
lakko-auth-token.workspace = true

# .env loading — debug builds only; production uses systemd
# `EnvironmentFile=/etc/lakko/lakko.env`.
dotenvy = "0.15"

# Streaming SHA-256 for content-addressable PUT.
sha2 = "0.10"
hex = "0.4"

# Atomic file persist (write to tempfile, rename into place).
tempfile = "3"

# Free space on the blob filesystem (src/disk.rs); already in the tree
# through tempfile.
rustix = { version = "1", features = ["fs"] }

# Body streaming via futures Stream.
futures = "0.3"
bytes = "1"

# ADR-0065 section 1: the blob index. MariaDB in deployment
# (`LAKKO_STORAGE_DATABASE_URL`), the same sqlx pin and feature set as
# `services/channels`; without a database URL the file-backed index is used.
sqlx = { version = "0.9", default-features = false, features = [
    "runtime-tokio",
    "tls-rustls-ring",
    "mysql",
    "migrate",
    "macros",
] }
# Object-safe async dispatch for the `BlobIndex` trait, as `ChannelStore`
# in `services/channels`.
async-trait = "0.1"

# ADR-0065 section 5: one anonymous token of `blob-upload` / `blob-read`
# buys an hour's pass, through the shared spend gate.
lakko-anon-token.workspace = true
lakko-anon-token-server.workspace = true

# The pass MAC (HMAC-SHA-256) and the random pass id. No new cryptography.
lakko-crypto.workspace = true
# Constant-time comparison of the pass tag (already in the tree).
subtle = "2"
# Base64url-no-pad for the pass and the delete-key header.
base64 = "0.22"

# ADR-0065 section 6: the `x-lakko-storage-proof` verifier for
# `DELETE /blob/{hex}` (pure; depends on lakko-crypto, thiserror, base64).
lakko-vault.workspace = true

# ADR-0065 amendment (2026-11-19): blob bytes in an S3-compatible bucket.
# `rusty-s3` only signs requests (sans-IO); `rustcrypto` is its HMAC/SHA-2
# backend, so no `aws-lc` enters the build (the ADR-0026 lesson).
rusty-s3 = { version = "0.12", default-features = false, features = ["rustcrypto"] }
# The HTTP client for the bucket, as the other services use it (rustls on
# ring); `stream` for the streamed PUT body and the streamed GET.
reqwest = { version = "0.12", default-features = false, features = [
    "rustls-tls",
    "stream",
] }

[dev-dependencies]
lakko-anon-token-server = { workspace = true, features = ["testing"] }
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
tempfile = "3"
