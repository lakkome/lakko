[package]
name = "lakko-svc-channels"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false
description = "Channel-broadcast backend (ADR-0010) and the channel directory (ADR-0059). Stores opaque ChannelPost bytes and fans them out by cursor; the server never decrypts."

[lints]
workspace = true

[[bin]]
name = "lakko-svc-channels"
path = "src/main.rs"

[dependencies]
tokio.workspace = true
lakko-metrics.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
anyhow.workspace = true
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true

# Same axum / tower / tower-http versions as the other
# Lakko services so the workspace resolves to one set.
axum = { version = "0.8", features = ["macros", "http2"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["trace", "request-id", "timeout", "limit"] }

# .env loading — debug builds only; production reads
# systemd EnvironmentFile=/etc/lakko/lakko.env.
dotenvy = "0.15"

# Hex-decode for channel_id in the URL — channel ids are
# 16-byte pseudonyms rendered as 32 hex chars per ADR-0010.
hex = "0.4"

# Base64url for the wire form of post payloads in the
# fetch response. The server never decodes the inner
# bytes; the base64 layer is purely transport-level JSON
# safety so the opaque ChannelPost bytes can ride a
# JSON body without binary-encoding escapes.
base64 = "0.22"

# SQL persistence (G4-1-sql). Same workspace pin every
# other lakko service uses; production binds to MariaDB
# via LAKKO_CHANNELS_DATABASE_URL while tests fall back
# to the in-memory store.
sqlx = { version = "0.9", default-features = false, features = [
    "runtime-tokio",
    "tls-rustls-ring",
    "mysql",
    "migrate",
    "macros",
] }

# Object-safe async trait dispatch for the `ChannelStore`
# trait. Stable Rust can do dyn-async today via the
# experimental dyn-compat path, but every other lakko
# service that needs an async trait (push-gw, transport)
# uses the `async-trait` crate, so we stay consistent.
async-trait = "0.1"

# ADR-0059 S2: the directory and the owner-signed routes. The server
# still never decodes a ChannelPost, opens a seed envelope or derives a key
# (the opacity contract of `storage.rs` is unchanged for posts and
# envelopes). What it now parses is the owner's own public artefacts: the
# owner request proof (`lakko_channels::owner::verify_owner_proof`, against
# the `owner_pubkey` registered at creation) and the plaintext listing the
# owner chose to publish (`lakko_channels::listing`, the bounded codec the
# clients compose with), so a malformed listing never reaches the table.
lakko-channels.workspace = true
lakko-crypto.workspace = true

# Anonymous tokens (ADR-0054): subscribe spends `channel-subscribe`, search
# spends `directory-search`, through the shared spend gate.
lakko-anon-token.workspace = true
lakko-anon-token-server.workspace = true
# ADR-0092 section 4.4 — verify the anonymous-credential presentation a
# channel poll vote carries, under a key derived from the master shared with
# auth.
lakko-anon-cred.workspace = true

# Constant-time comparison of the internal moderation listener's shared
# secret (the push-gw pattern). Already in the workspace graph.
subtle = "2"

# ADR-0060 member cards. The server still treats every
# ChannelPost, seed envelope and card as opaque bytes
# (ADR-0010 — no payload inspection). From lakko-channels
# it calls `member_card_epoch` (the clear frame reader:
# length bounds + version + the clear epoch),
# `subscriber_public_key` (the Ed25519 point check at
# registration) and `verify_member_card_request` (the
# subscriber's signature over a card upload, whose signed
# bytes are defined there for clients and server alike) -
# never a key derivation or an open. lakko-channels' own
# dependencies are lakko-crypto, thiserror, tracing.
# (lakko-channels is declared once, above.)

[dev-dependencies]
# Test fixtures sign member-card uploads and draw random ids.
lakko-crypto.workspace = true
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
base64 = "0.22"
lakko-anon-token-server = { workspace = true, features = ["testing"] }
