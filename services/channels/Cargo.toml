[package]
name = "lakko-svc-channels"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false
description = "Channel-broadcast backend for Phase 4a (publisher path). Stores opaque ChannelPost bytes and fans them out by cursor; the server never decrypts. See ADR-0010."

[lints]
workspace = true

[[bin]]
name = "lakko-svc-channels"
path = "src/main.rs"

[dependencies]
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
anyhow.workspace = true
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true

# Same axum / tower / tower-http versions as the other
# Lakko services so the workspace resolves to one set.
axum = { version = "0.8", features = ["macros", "http2"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["trace", "request-id", "timeout", "limit"] }

# .env loading — debug builds only; production reads
# systemd EnvironmentFile=/etc/lakko/lakko.env.
dotenvy = "0.15"

# Hex-decode for channel_id in the URL — channel ids are
# 16-byte pseudonyms rendered as 32 hex chars per ADR-0010.
hex = "0.4"

# Base64url for the wire form of post payloads in the
# fetch response. The server never decodes the inner
# bytes; the base64 layer is purely transport-level JSON
# safety so the opaque ChannelPost bytes can ride a
# JSON body without binary-encoding escapes.
base64 = "0.22"

# SQL persistence (G4-1-sql). Same workspace pin every
# other lakko service uses; production binds to MariaDB
# via LAKKO_CHANNELS_DATABASE_URL while tests fall back
# to the in-memory store.
sqlx = { version = "0.9", default-features = false, features = [
    "runtime-tokio",
    "tls-rustls-ring",
    "mysql",
    "migrate",
    "macros",
] }

# Object-safe async trait dispatch for the `ChannelStore`
# trait. Stable Rust can do dyn-async today via the
# experimental dyn-compat path, but every other lakko
# service that needs an async trait (push-gw, transport)
# uses the `async-trait` crate, so we stay consistent.
async-trait = "0.1"

# ADR-0060 member cards. The server still treats every
# ChannelPost, seed envelope and card as opaque bytes
# (ADR-0010 — no payload inspection). From lakko-channels
# it calls `member_card_epoch` (the clear frame reader:
# length bounds + version + the clear epoch),
# `subscriber_public_key` (the Ed25519 point check at
# registration) and `verify_member_card_request` (the
# subscriber's signature over a card upload, whose signed
# bytes are defined there for clients and server alike) -
# never a key derivation or an open. lakko-channels' own
# dependencies are lakko-crypto, thiserror, tracing.
lakko-channels.workspace = true

[dev-dependencies]
# Test fixtures sign member-card uploads and draw random ids.
lakko-crypto.workspace = true
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
base64 = "0.22"
