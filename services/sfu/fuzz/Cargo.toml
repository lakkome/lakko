[package]
name = "lakko-svc-sfu-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

# Opt out of the parent workspace.
[workspace]

[dependencies]
libfuzzer-sys = "0.4"
lakko-svc-sfu = { path = ".." }
serde_json = "1"

# The SFU's signaling parser sits on the WS receive path
# inside an admitted (post-JWT) call. An admitted attacker
# can ship arbitrary text frames; a panic / overflow in
# the parser crashes the per-call task and would amplify
# into a reconnect storm. C-39 invariant body.

[[bin]]
name = "client_frame_decode"
path = "fuzz_targets/client_frame_decode.rs"
test = false
doc = false
bench = false

# Video RED handling, the ULPFEC receiver and the ULPFEC sender. The bytes
# are a publisher's RTP packets: an admitted peer chooses every one of them,
# and the media loop reads the RED header byte of each, gives media and FEC
# packets to the stream's FEC receiver, forwards what it rebuilds, and builds
# FEC packets of its own for subscribers over what it forwarded, protecting
# what a publisher's FEC mask names. A panic here stops the media task for
# every call.

[[bin]]
name = "video_fec"
path = "fuzz_targets/video_fec.rs"
test = false
doc = false
bench = false

# The root workspace patches `str0m` with the vendored fork (one additive
# packetizer change, see crates/vendor/str0m). A `[patch]` section is not
# inherited by a crate that opted out of the workspace, so without this
# mirror the fuzz build resolves the unpatched crates.io release and the
# SFU no longer compiles against it.
[patch.crates-io]
str0m = { path = "../../../crates/vendor/str0m" }
