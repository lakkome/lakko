[package]
name = "lakko-svc-auth"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false
description = "Auth service — OPAQUE-PAKE + WebAuthn passkey, no PII storage"

[lints]
workspace = true

[[bin]]
name = "lakko-svc-auth"
path = "src/main.rs"

[dependencies]
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
anyhow.workspace = true
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true

axum = { version = "0.8", features = ["macros", "http2"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["trace", "request-id", "timeout", "limit"] }
sqlx = { version = "0.9", default-features = false, features = [
    "runtime-tokio",
    "tls-rustls-ring",
    "mysql",
    "migrate",
    "macros",
    "chrono",
] }

# .env loading — debug builds only; production uses systemd
# `EnvironmentFile=/etc/lakko/lakko.env` (see infra/systemd/*.service).
dotenvy = "0.15"

# OPAQUE-PAKE (RFC draft `opaque`) — password auth without the server
# seeing the plaintext. Ristretto255 + TripleDH + Argon2id ciphersuite.
# `opaque-ke` (by Meta/Novi) is the only mature Rust implementation.
opaque-ke = { version = "3", features = ["argon2"] }
argon2 = "0.5"
rand = "0.8"
base64 = "0.22"
uuid = { version = "1", features = ["v7", "serde"] }

# Equix proof-of-work (LGPL-3.0-only — AGPL-compatible). Memory-hard PoW
# from the Tor Project, used in onion services. Server only verifies;
# clients (lakko-ffi-uniffi / lakko-ffi-wasm) will need solve later.
# `compiler` feature speeds up solve via runtime JIT (used in tests).
equix = { version = "0.6", features = ["compiler"] }
sha2 = "0.10"

# WebAuthn action binding (G-13, ADR-0014) — domain-separated keyed
# BLAKE3 derivation of the per-action assertion challenge.
lakko-crypto.workspace = true

# Device-removal attestation (G-13, ADR-0015) — the auth service signs an
# `ActionAttestation` on `/auth/action/finish`; the peer devices that
# verify a removal share the same crate (sign here, verify in lakko-mls).
lakko-attest.workspace = true

# Session-token issuance — Phase 1.5b. Stateless HMAC-SHA256 tokens
# shared with `services/discovery`'s verifier middleware via the
# `LAKKO_SESSION_TOKEN_SECRET` env var.
lakko-auth-token.workspace = true

# Call-JWT issuance — Phase 3b4 forward. JWS Compact + EdDSA
# Ed25519 + JWKS shapes shared with the FFI crates so client +
# server speak the same wire format. The SFU (services/sfu,
# 3b1c, Go) reimplements the verifier against the same spec.
lakko-call-jwt.workspace = true

# WebAuthn / passkey support — Phase 2a2. `webauthn-rs` is the
# de-facto Rust implementation: battle-tested, maintained, and
# absorbs the long tail of CBOR-attestation + COSE-key parsing we
# have no business writing ourselves. The `danger-allow-state-
# serialisation` feature is required so we can park
# `PasskeyRegistration` / `PasskeyAuthentication` in the
# `webauthn_states` table between the two-step request pair —
# webauthn-rs's defaults assume in-memory state which doesn't
# survive across axum requests.
webauthn-rs = { version = "0.5", features = [
    # Park PasskeyRegistration / PasskeyAuthentication state in the
    # `webauthn_states` row between /start and /finish. Required
    # because webauthn-rs's default surface assumes in-memory state.
    "danger-allow-state-serialisation",
    # Enable `start_discoverable_authentication` + the
    # `DiscoverableKey` type. This is the "Sign in with passkey"
    # path where the authenticator picks the credential without
    # the user typing a username — the consumer-facing flow.
    "conditional-ui",
    # WebAuthn action binding (G-13, ADR-0014). Exposes
    # `From<Passkey> for Credential` + `prelude::Credential` so the
    # action-bound flow can feed stored passkeys into the
    # webauthn-rs-core challenge builder. The "danger" name is about
    # not mutating Credential internals — we only read/convert.
    "danger-credential-internals",
] }
# WebAuthn action binding (G-13, ADR-0014). The low-level core — used
# ONLY by the action-bound flow to set a per-action challenge
# (`generate_challenge_authenticate_with_challenge`, our one fork-delta
# method) and to run `authenticate_credential` (upstream-verbatim
# verification). Resolves to the vendored fork via `[patch.crates-io]`
# in the root Cargo.toml. The username/discoverable LOGIN flows stay on
# the safe high-level `webauthn-rs` above.
webauthn-rs-core = "0.5"
url = "2"

# G3-{1,2}-turn — HMAC-SHA1 for the coturn `static-auth-secret`
# credential scheme (TURN REST API: username=`<expiry>:<account>`,
# password=base64(HMAC-SHA1(secret, username))). SHA-1 is fine
# here — the keyed-MAC use case is unaffected by the SHA-1
# collision attacks (those land on plaintext digests, not on
# HMAC). The coturn server itself only accepts this exact
# scheme. `hmac` + `sha1` are already in the dep tree via
# transitive pulls (jsonwebtoken, ring, etc.) so we list them
# directly to keep the import path obvious.
hmac = "0.12"
sha1 = "0.10"

# ----------------------------------------------------------------------------
# ADR-0018 factor (d) — phone / email one-time-code recovery.
# ----------------------------------------------------------------------------

# `#[async_trait]` for the OtpSender abstraction — the SAME dispatch
# mechanism `services/push-gw`'s `Provider` trait uses (async-trait 0.1).
# Mirrored deliberately so the per-kind LogOnly / real-adapter resolver
# matches the established posture.
async-trait = "0.1"

# Real SMTP email adapter. `lettre` is the de-facto Rust SMTP client —
# battle-tested, maintained, and absorbs the MIME/header/transport surface
# we have no business writing ourselves. We pin the async-tokio + rustls
# transport (`tokio1` + `tokio1-rustls-tls`) and EXPLICITLY drop native-tls
# (`default-features = false`) to match the workspace TLS stack
# (sqlx `tls-rustls-ring`, reqwest `rustls-tls`). `rustls-native-certs`
# trusts the OS root store for the relay's certificate. MIT/Apache-2.0
# licensed (cargo-deny allow-list).
lettre = { version = "0.11", default-features = false, features = [
    "smtp-transport",
    "tokio1",
    "tokio1-rustls-tls",
    "rustls-tls",
    "rustls-native-certs",
    "builder",
    "hostname",
] }

# Twilio-shaped SMS HTTP adapter. Same rustls-ring choice the rest of the
# workspace makes (reqwest is already used by 4 other services); no
# native-tls. `json` is unused by the form-encoded Twilio call but kept
# off — only `rustls-tls` is needed.
reqwest = { version = "0.12", default-features = false, features = [
    "rustls-tls",
] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"

# Software WebAuthn authenticator (kanidm), test-only. Drives the full
# action-binding round-trip in `webauthn_action` property tests: register a
# passkey, then sign an assertion over the action-bound challenge so we can
# assert (a) a correctly-bound assertion verifies and (b) an assertion
# produced for action A is REJECTED on action B's session. `softpasskey`
# (no default features) avoids the USB / NFC / BLE / HID transport stack —
# it only pulls crypto (openssl, already in-tree via webauthn-rs-core) +
# tokio. `webauthn-rs-proto` unifies to 0.5.5, so its `PublicKeyCredential`
# / `RequestChallengeResponse` are the SAME types our forked core consumes.
webauthn-authenticator-rs = { version = "0.5", default-features = false, features = [
    "softpasskey",
] }
