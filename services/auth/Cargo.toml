[package]
name = "lakko-svc-auth"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false
description = "Auth service — OPAQUE-PAKE + WebAuthn passkey, no PII storage"

[lints]
workspace = true

[[bin]]
name = "lakko-svc-auth"
path = "src/main.rs"

[dependencies]
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
anyhow.workspace = true
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true

axum = { version = "0.8", features = ["macros", "http2"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["trace", "request-id", "timeout", "limit"] }
sqlx = { version = "0.8", default-features = false, features = [
    "runtime-tokio",
    "tls-rustls-ring",
    "mysql",
    "migrate",
    "macros",
    "chrono",
] }

# .env loading — debug builds only; production использует systemd
# EnvironmentFile= /etc/lakko/lakko.env, см. infra/systemd/*.service.
dotenvy = "0.15"

# OPAQUE-PAKE (RFC draft `opaque`) — password auth without server seeing
# plaintext. Ristretto255 + TripleDH + Argon2id ciphersuite. opaque-ke
# имплементация от Facebook/Meta — единственная зрелая Rust-крата.
opaque-ke = { version = "3", features = ["argon2"] }
argon2 = "0.5"
rand = "0.8"
base64 = "0.22"
uuid = { version = "1", features = ["v7", "serde"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
