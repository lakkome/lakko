[package]
name = "lakko-svc-auth"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false
description = "Auth service — OPAQUE-PAKE + WebAuthn passkey, no PII storage"

[lints]
workspace = true

[[bin]]
name = "lakko-svc-auth"
path = "src/main.rs"

[dependencies]
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
anyhow.workspace = true
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true

axum = { version = "0.8", features = ["macros", "http2"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["trace", "request-id", "timeout", "limit"] }
sqlx = { version = "0.8", default-features = false, features = [
    "runtime-tokio",
    "tls-rustls-ring",
    "mysql",
    "migrate",
    "macros",
    "chrono",
] }

# .env loading — debug builds only; production uses systemd
# `EnvironmentFile=/etc/lakko/lakko.env` (see infra/systemd/*.service).
dotenvy = "0.15"

# OPAQUE-PAKE (RFC draft `opaque`) — password auth without the server
# seeing the plaintext. Ristretto255 + TripleDH + Argon2id ciphersuite.
# `opaque-ke` (by Meta/Novi) is the only mature Rust implementation.
opaque-ke = { version = "3", features = ["argon2"] }
argon2 = "0.5"
rand = "0.8"
base64 = "0.22"
uuid = { version = "1", features = ["v7", "serde"] }

# Equix proof-of-work (LGPL-3.0-only — AGPL-compatible). Memory-hard PoW
# from the Tor Project, used in onion services. Server only verifies;
# clients (lakko-ffi-uniffi / lakko-ffi-wasm) will need solve later.
# `compiler` feature speeds up solve via runtime JIT (used in tests).
equix = { version = "0.6", features = ["compiler"] }
sha2 = "0.10"

# Session-token issuance — Phase 1.5b. Stateless HMAC-SHA256 tokens
# shared with `services/discovery`'s verifier middleware via the
# `LAKKO_SESSION_TOKEN_SECRET` env var.
lakko-auth-token.workspace = true

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
