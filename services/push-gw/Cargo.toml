[package]
name = "lakko-svc-push-gw"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false
description = "Push gateway — fanout to APNs / FCM / Web Push, encrypted-pointer payloads only"

[lints]
workspace = true

[[bin]]
name = "lakko-svc-push-gw"
path = "src/main.rs"

[dependencies]
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
anyhow.workspace = true
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true

axum = { version = "0.8", features = ["macros", "http2"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["trace", "limit"] }
sqlx = { version = "0.8", default-features = false, features = [
    "runtime-tokio",
    "tls-rustls-ring",
    "mysql",
    "migrate",
    "macros",
    "chrono",
] }

# .env loading — debug builds only.
dotenvy = "0.15"

# PoW infrastructure mirrored from services/auth and services/discovery.
# Phase 2 should DRY this into a shared `lakko-pow` workspace crate.
equix = { version = "0.6", features = ["compiler"] }
sha2 = "0.10"

base64 = "0.22"
hex = "0.4"
rand = "0.8"

# `#[async_trait]` for the Provider abstraction.
async-trait = "0.1"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
