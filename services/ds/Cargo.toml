[package]
name = "lakko-svc-ds"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false
description = "MLS Delivery Service — append-only per-group log + per-device mailbox, ciphertext-only"

[lints]
workspace = true

[[bin]]
name = "lakko-svc-ds"
path = "src/main.rs"

[dependencies]
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true

axum = { version = "0.8", features = ["macros", "http2"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["trace", "limit"] }
sqlx = { version = "0.9", default-features = false, features = [
    "runtime-tokio",
    "tls-rustls-ring",
    "mysql",
    "migrate",
    "macros",
    "chrono",
] }

# .env loading — debug builds only; production uses systemd
# `EnvironmentFile=/etc/lakko/lakko.env`.
dotenvy = "0.15"

# Path params are 32-byte pseudonyms encoded as 64 hex chars; payloads
# travel through JSON as base64.
base64 = "0.22"
hex = "0.4"

# Timestamp serialization for JSON responses (the `chrono` feature on
# sqlx gives us the type but not the Serialize impl).
chrono = { version = "0.4", default-features = false, features = ["serde"] }

# Body collection helper (BodyExt::collect on axum's Body).
http-body-util = "0.1"

# ADR-0053 - the request proof a claimed journal requires: canonical bytes,
# header codec and verifier, shared with both FFI surfaces. Re-exports the
# Ed25519 key types, so no direct lakko-crypto dependency is needed here.
lakko-ds-proof.workspace = true

# ADR-0053 section 4 - the knock (a non-member's request to join) is the one
# unauthenticated write to a claimed group and is PoW-gated with the shared
# server-side Equix verifier the other services already use.
lakko-pow-server.workspace = true

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
# The client-side Equix solver, so the knock tests can pay a real (effort-0)
# proof of work against the same table the handler verifies.
lakko-pow.workspace = true
