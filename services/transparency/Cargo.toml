[package]
name = "lakko-svc-transparency"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false
description = "Transparency — persistent CONIKS-style key-transparency log with signed roots"

[lints]
workspace = true

[[bin]]
name = "lakko-svc-transparency"
path = "src/main.rs"

[dependencies]
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
anyhow.workspace = true
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true

axum = { version = "0.8", features = ["macros", "http2"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["trace", "limit"] }
sqlx = { version = "0.9", default-features = false, features = [
    "runtime-tokio",
    "tls-rustls-ring",
    "mysql",
    "migrate",
    "macros",
    "chrono",
] }

# .env loading — debug builds only; production uses systemd
# `EnvironmentFile=/etc/lakko/lakko.env`.
dotenvy = "0.15"

base64 = "0.22"
rand = "0.8"

# Constant-time comparison of the service-append shared secret (KT-log S2).
# `subtle` is the canonical Rust crate for branch-free equality and is
# already a workspace-wide dependency (lakko-crypto, lakko-auth-token, ...).
subtle = "2"

# The append-only Merkle log + signed roots + inclusion proofs. This
# service wraps the crate's `InMemoryLog` with MariaDB persistence and
# an HTTP surface; the crate carries all the crypto + tree logic.
lakko-transparency.workspace = true
# Ed25519 operator signing key — generated on first boot, persisted as a
# 32-byte seed, rebuilt at every process start. The derived verifying
# key is the trust anchor clients pin out-of-band.
lakko-crypto.workspace = true

# ADR-0020 Sprint 4 — the witness-cosign client (transparency -> witness
# /witness/cosign). Same rustls posture as the discovery service's reqwest.
reqwest = { version = "0.12", default-features = false, features = [
    "json",
    "rustls-tls",
] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
