[package]
name = "lakko-svc-discovery"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false
description = "Discovery — username lookup via OPRF blinded queries"

[lints]
workspace = true

[[bin]]
name = "lakko-svc-discovery"
path = "src/main.rs"

[dependencies]
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true

axum = { version = "0.8", features = ["macros", "http2"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["trace", "limit"] }
sqlx = { version = "0.9", default-features = false, features = [
    "runtime-tokio",
    "tls-rustls-ring",
    "mysql",
    "migrate",
    "macros",
    "chrono",
] }

# .env loading — debug builds only; production uses systemd
# `EnvironmentFile=/etc/lakko/lakko.env`.
dotenvy = "0.15"

# VOPRF (RFC 9497) — server stores the username table keyed by
# `OPRF(K, normalize(username))` so plaintext usernames are never
# present in the database or on the wire. Ristretto255-SHA512
# ciphersuite — matches the OPAQUE-PAKE choice in services/auth.
voprf = { version = "0.5", default-features = false, features = [
    "ristretto255-ciphersuite",
] }
generic-array = "0.14"

# Server-side PoW verify/issue/consume/prune (G-29 dedup; `src/pow.rs` is now a
# thin shim over this shared crate). `equix` is no longer a direct dep here —
# it comes in transitively through `lakko-pow-server`.
lakko-pow-server.workspace = true

# SHA-256 (used by call-invite / invite hashing). The server-side PoW verify
# (Equix puzzle + SHA-256 effort filter) moved to `lakko-pow-server` above.
sha2 = "0.10"

base64 = "0.22"
hex = "0.4"
rand = "0.8"

# Phase 1.18d1 — server-side `decode_and_verify` over the
# uploaded `InviteCapability` so junk wire is rejected at the
# /discovery/invite ingress and the verified `owner_account_id`
# + `expiry_ms` can be denormalised into the row index columns.
# The capability bytes themselves are public by design (anyone
# holding a link sees them) so coupling the server to
# lakko-contacts on this surface adds no privacy risk.
lakko-contacts.workspace = true
# Phase 1.18d2b — owner-signed `DELETE /discovery/invite/...`
# verifies the request body's Ed25519 signature against the
# capability's embedded `owner_signature_pubkey`. Direct dep on
# the signing primitives (instead of going through the
# `lakko_contacts::*` re-exports) keeps the verify call site
# self-contained and avoids a `pub use` shuffle on the contacts
# crate.
lakko-crypto.workspace = true

# Phase 1.5b — session-token verification middleware. Shares the
# HMAC secret with `services/auth` via `LAKKO_SESSION_TOKEN_SECRET`
# (loaded once at startup); per-request middleware extracts the
# `Authorization: Bearer …` header and rejects non-verifying
# tokens with a 401.
lakko-auth-token.workspace = true

# KT-log S2 — best-effort POST to the transparency append endpoint on
# every identity-key CHANGE. `default-features = false` + rustls keeps the
# TLS provider aligned with sqlx (`tls-rustls-ring`); same feature shape as
# the four other services that already depend on reqwest (auth, sfu,
# channels, push-gw).
reqwest = { version = "0.12", default-features = false, features = [
    "json",
    "rustls-tls",
] }

# KT-log account-key derivation (ADR-0036) — the ONE shared definition of
# `username_hash = BLAKE3("lakko/transparency/account/v1" || account_id)`,
# promoted out of this crate's local copy so auth (genesis-attestation mint)
# and discovery (log append) cannot drift. Lightweight (thiserror +
# lakko-crypto only, both already in-tree). Was a dev-dep (recovery e2e); now
# a regular dep for the derivation.
lakko-transparency.workspace = true

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
# Note: `lakko-crypto` is now a regular dep (1.18d2b) — no
# dev-dep override needed. The round-trip test in
# `invite::tests::server_side_decode_and_verify_round_trip`
# uses the same dep.
# Recovery + KT-log live e2e (`tests/recovery_kt_e2e.rs`, `#[ignore]`-gated):
# the driver mints a session token, solves the PoW, derives an AccountIdentity,
# mints genesis self-sigs + supersession proofs, and verifies inclusion /
# genesis / chain against the live transparency log — all client-side crypto.
lakko-pow.workspace = true
lakko-mls.workspace = true
