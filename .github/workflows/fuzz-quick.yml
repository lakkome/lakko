# Quick-fuzz CI — actually RUN the 30 fuzz targets that
# `just fuzz-check` only smoke-builds. Each target gets a
# bounded budget (60 s by default) which is enough to find
# the kind of immediate-input panic / overflow regression
# that a parser refactor accidentally introduces; deeper
# coverage rides on the OSS-Fuzz integration tracked
# separately.
#
# Triggers:
#   - schedule: nightly 03:00 UTC.
#   - workflow_dispatch: on-demand from the Actions tab,
#     with a custom per-target duration.
#
# Permission posture: read-only — no PR comments, no
# pushes, no cache write across forks. Crash artifacts
# upload to the workflow run page.

name: fuzz-quick

on:
  # Quota-conservation mode (May 2026). Auto-triggers
  # (schedule / push / PR-label) are disabled — the
  # Free-tier 2,000-minute budget gets eaten by the
  # fuzz matrix in under a week of nightly cron. Run
  # manually from the Actions tab when investigating
  # a real lead; flip the `schedule` block back on when
  # the workspace moves to a paid tier or a self-hosted
  # runner.
  workflow_dispatch:
    inputs:
      duration_secs:
        description: 'Per-target fuzz duration (seconds).'
        required: false
        default: '60'

# Avoid piling up overlapping nightly runs — if yesterday's
# run is still going, skip today's. Crash signal is the same
# either way.
concurrency:
  group: fuzz-quick
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  fuzz:
    name: ${{ matrix.crate }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      # Don't bail on first failure — every crate's signal is
      # independent, and a crash in one parser shouldn't hide
      # a separate crash in another.
      fail-fast: false
      matrix:
        include:
          - crate: lakko-mls
            manifest: crates/lakko-mls/fuzz/Cargo.toml
          - crate: lakko-proto
            manifest: crates/lakko-proto/fuzz/Cargo.toml
          - crate: lakko-contacts
            manifest: crates/lakko-contacts/fuzz/Cargo.toml
          - crate: lakko-channels
            manifest: crates/lakko-channels/fuzz/Cargo.toml
          - crate: lakko-calls
            manifest: crates/lakko-calls/fuzz/Cargo.toml
          - crate: lakko-transport
            manifest: crates/lakko-transport/fuzz/Cargo.toml
          - crate: lakko-tuf
            manifest: crates/lakko-tuf/fuzz/Cargo.toml
          - crate: lakko-call-jwt
            manifest: crates/lakko-call-jwt/fuzz/Cargo.toml
          - crate: lakko-backup
            manifest: crates/lakko-backup/fuzz/Cargo.toml
          - crate: lakko-transparency
            manifest: crates/lakko-transparency/fuzz/Cargo.toml
          - crate: lakko-attest
            manifest: crates/lakko-attest/fuzz/Cargo.toml
          - crate: lakko-sync
            manifest: crates/lakko-sync/fuzz/Cargo.toml
          - crate: lakko-push
            manifest: crates/lakko-push/fuzz/Cargo.toml
          - crate: lakko-attachments
            manifest: crates/lakko-attachments/fuzz/Cargo.toml
          - crate: lakko-auth-token
            manifest: crates/lakko-auth-token/fuzz/Cargo.toml
          - crate: lakko-mnemonic
            manifest: crates/lakko-mnemonic/fuzz/Cargo.toml
          - crate: lakko-ds-proof
            manifest: crates/lakko-ds-proof/fuzz/Cargo.toml
          - crate: lakko-anon-token
            manifest: crates/lakko-anon-token/fuzz/Cargo.toml
          - crate: lakko-device-link
            manifest: crates/lakko-device-link/fuzz/Cargo.toml
          - crate: lakko-feed
            manifest: crates/lakko-feed/fuzz/Cargo.toml
          - crate: lakko-l10n
            manifest: crates/lakko-l10n/fuzz/Cargo.toml
          - crate: lakko-svc-sfu
            manifest: services/sfu/fuzz/Cargo.toml

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install nightly Rust + cargo-fuzz
        uses: dtolnay/rust-toolchain@nightly

      - name: Cache cargo registry + target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: fuzz-${{ matrix.crate }}-${{ hashFiles(matrix.manifest) }}
          restore-keys: |
            fuzz-${{ matrix.crate }}-

      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --locked --version '^0.13' || true

      - name: Run fuzz targets
        env:
          DURATION_SECS: ${{ inputs.duration_secs || '60' }}
        run: |
          set -eu
          manifest="${{ matrix.manifest }}"
          fuzz_dir="$(dirname "$manifest")"
          targets_dir="$fuzz_dir/fuzz_targets"
          echo "== Fuzz crate: ${{ matrix.crate }} (manifest=$manifest, budget=${DURATION_SECS}s/target) =="
          fail=0
          for target_file in "$targets_dir"/*.rs; do
            target="$(basename "$target_file" .rs)"
            echo "--- target: $target ---"
            # cargo-fuzz drops crash inputs into
            # $fuzz_dir/artifacts/$target/. The exit code is
            # non-zero on crash; we capture per-target failure
            # so every target still gets a chance to run.
            if ! cargo +nightly fuzz run \
                --fuzz-dir "$fuzz_dir" \
                "$target" \
                -- -max_total_time="$DURATION_SECS"; then
              echo "FAIL: $target produced a crash"
              fail=1
            fi
          done
          exit "$fail"

      - name: Upload crash artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-crashes-${{ matrix.crate }}
          path: |
            ${{ matrix.manifest }}/../artifacts/
            ${{ matrix.manifest }}/../corpus/
          if-no-files-found: ignore
          retention-days: 14
