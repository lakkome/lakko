# Reproducible-build verifier — runs **two** full release builds
# from clean and diffs the artifact hashes. Worth ~20-25 quota
# minutes per invocation, so it lives on a weekly cron + manual
# dispatch instead of per-push (Phase-1, where it's
# `continue-on-error: true` anyway). The one documented blocker (the
# uniffi rlib flake) is resolved under uniffi 0.31 (known-gaps G-25 /
# GA-4); promote the Rust `repro` job to gating + re-enable the cron
# after one green dispatch confirms the full artifact set on the ubuntu
# runners (tracked in `~/.claude/plans/1-nested-wreath.md` §8).

name: Reproducible build

on:
  # **Quota-conservation mode (May 2026)**: weekly cron disabled
  # alongside the per-push CI gates until June quota reset. Each
  # invocation burns ~50 quota-min (Rust repro 2 builds + web
  # repro 2 builds); 4 weekends × 50 = 200/month, not worth
  # burning until the rest of CI is back on. Re-enable by
  # uncommenting the `schedule:` block — single line revert.
  # schedule:
  #   # Sundays 06:00 UTC — quiet window across the maintainer's
  #   # active time zones.
  #   - cron: '0 6 * * 0'
  workflow_dispatch: {}

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  CARGO_INCREMENTAL: 0

jobs:
  repro:
    name: reproducible build verifier
    runs-on: ubuntu-latest
    # Best-effort job — verifies the workspace builds reproducibly
    # (byte-identical between two independent clean builds). The one
    # historically-flaky artifact (`liblakko_ffi_uniffi.rlib` under
    # uniffi 0.28's bincode-serialised proc-macro output) became
    # reproducible under the uniffi 0.28 -> 0.31 bump (known-gaps G-25) —
    # verified firsthand same-runner (2026-06-30, see
    # ci/repro/compare-build-hashes.sh) — so the known-flaky filter is
    # now empty and every artifact is compared. This job STAYS advisory
    # only pending ONE green dispatch confirming the full workspace
    # artifact set (all `lakko-svc-*` binaries + rlibs) is byte-identical
    # on the ubuntu runners; drop `continue-on-error` after that run is
    # green (the documented blocker is resolved — the svc binaries were
    # never individually flagged flaky, so this is the last confirming
    # step, not a rebuild of the analysis).
    continue-on-error: true
    env:
      # Pin the path prefix so absolute paths in debuginfo do not
      # differ between independent checkouts. `/github/workspace`
      # is the standard working directory on ubuntu runners.
      RUSTFLAGS: --remap-path-prefix=/github/workspace=. -C symbol-mangling-version=v0
      SOURCE_DATE_EPOCH: "1735689600"  # 2025-01-01 UTC, fixed
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.95.0
      - name: First build
        run: |
          cargo build --workspace --release --locked
          mkdir -p /tmp/build-a
          find target/release -maxdepth 1 -type f \( -name 'lakko-svc-*' -o -name '*.rlib' \) \
            | sort | xargs -I{} cp {} /tmp/build-a/
          (cd /tmp/build-a && sha256sum * | sort) > /tmp/build-a-hashes.txt
          echo "===== Build A hashes =====" && cat /tmp/build-a-hashes.txt
      - name: Clean target
        run: cargo clean
      - name: Second build
        run: |
          cargo build --workspace --release --locked
          mkdir -p /tmp/build-b
          find target/release -maxdepth 1 -type f \( -name 'lakko-svc-*' -o -name '*.rlib' \) \
            | sort | xargs -I{} cp {} /tmp/build-b/
          (cd /tmp/build-b && sha256sum * | sort) > /tmp/build-b-hashes.txt
          echo "===== Build B hashes =====" && cat /tmp/build-b-hashes.txt
      - name: Compare hashes
        run: |
          # Single source of truth for the diff. The known-flaky filter
          # is now EMPTY (the historical liblakko_ffi_uniffi.rlib flake
          # was fixed by the uniffi 0.28 -> 0.31 bump; see
          # ci/repro/compare-build-hashes.sh), so every artifact is
          # compared.
          bash "$GITHUB_WORKSPACE/ci/repro/compare-build-hashes.sh" \
            /tmp/build-a-hashes.txt /tmp/build-b-hashes.txt "release artifacts (same runner)"

  web-repro:
    # Phase 1.17b — apps/web reproducibility verifier. Mirror of
    # the Rust `repro` job above, scoped to the Vite + wasm-pack
    # pipeline. Catches non-determinism creeping in via:
    #   * `npm install` not respecting package-lock.json (we run
    #     `npm ci` to enforce);
    #   * wasm-pack toolchain drift (pinned to `^0.13` — same pin
    #     as the per-push web-build job);
    #   * a Vite plugin baking wall-clock time into `dist/`;
    #   * `post-build.mjs` / `build-sw.mjs` reading anything other
    #     than the bytes they hash (they don't today, but a
    #     regression here is exactly what this job catches).
    #
    # Empirically reproducible at 1.17b: two clean local builds
    # produce a byte-identical `apps/web/dist/`. The Vite + wasm-pack
    # pipeline has no known non-determinism today (and the Rust job
    # above no longer has one either — the uniffi rlib flake was fixed
    # by the 0.28 -> 0.31 bump). Ship it as a real gate; if a future
    # dep bump or Vite reshape drifts the output, the weekly cron
    # surfaces it within a week and we either fix the regression
    # or add a `KNOWN_FLAKY` filter (mirroring the Rust pattern).
    name: web reproducible build verifier
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install wasm-pack
        # Same pin as the per-push web-build / wasm-test jobs.
        run: cargo install wasm-pack --version ^0.13 --locked
        working-directory: ${{ github.workspace }}
      - name: First build
        run: |
          npm ci
          npm run build
          (cd dist && find . -type f | sort | xargs sha256sum) > /tmp/web-build-a.txt
          echo "===== Web build A hashes =====" && cat /tmp/web-build-a.txt
      - name: Wipe build outputs
        # Drop the npm + Vite caches too — `node_modules/.vite`
        # and `wasm/` would otherwise short-circuit the second
        # build into a partial recompile.
        run: |
          rm -rf dist wasm node_modules
      - name: Second build
        run: |
          npm ci
          npm run build
          (cd dist && find . -type f | sort | xargs sha256sum) > /tmp/web-build-b.txt
          echo "===== Web build B hashes =====" && cat /tmp/web-build-b.txt
      - name: Compare hashes
        # The web pipeline has no known-flaky artifact (source maps
        # embed host paths but both builds share the cwd) — pass an
        # empty filter so EVERY dist file must match.
        run: |
          LAKKO_REPRO_KNOWN_FLAKY="" \
            bash "$GITHUB_WORKSPACE/ci/repro/compare-build-hashes.sh" \
            /tmp/web-build-a.txt /tmp/web-build-b.txt "apps/web/dist"

  # ----------------------------------------------------------------
  # Cross-runner reproducibility (GA-4 partial)
  # ----------------------------------------------------------------
  #
  # The `repro` job above proves "byte-identical between two
  # builds on **the same** runner". That catches in-process
  # non-determinism (timestamp embedding, randomness in
  # codegen) but does NOT catch host-state leaks — kernel
  # version, libc patch level, environment-derived
  # constants — which are exactly what SLSA L3 cares
  # about.
  #
  # This pair of jobs separates the build phase per runner
  # via a matrix (each matrix entry lands on a fresh
  # ephemeral GitHub Actions VM); the verifier job
  # downloads both runners' hash manifests and diffs.
  #
  # Same `continue-on-error: true` posture as the
  # single-runner job — advisory until byte-identicality is
  # stable across the workspace; flip to gating + add to
  # CI's required-status set once the underlying flakiness
  # is resolved.

  cross-runner-build:
    name: cross-runner build (${{ matrix.runner-id }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        runner-id: [a, b]
    env:
      RUSTFLAGS: --remap-path-prefix=/github/workspace=. -C symbol-mangling-version=v0
      SOURCE_DATE_EPOCH: "1735689600"
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.95.0
      - name: Release build
        run: cargo build --workspace --release --locked
      - name: Hash release artifacts
        run: |
          mkdir -p /tmp/build
          find target/release -maxdepth 1 -type f \( -name 'lakko-svc-*' -o -name '*.rlib' \) \
            | sort | xargs -I{} cp {} /tmp/build/
          (cd /tmp/build && sha256sum * | sort) > /tmp/hashes.txt
          echo "===== Runner ${{ matrix.runner-id }} hashes ====="
          cat /tmp/hashes.txt
      - name: Upload hashes
        uses: actions/upload-artifact@v4
        with:
          name: cross-runner-hashes-${{ matrix.runner-id }}
          path: /tmp/hashes.txt
          if-no-files-found: error

  cross-runner-verify:
    name: cross-runner reproducibility verifier
    runs-on: ubuntu-latest
    needs: cross-runner-build
    # Advisory until the workspace is fully reproducible
    # across independent runners. Mirror of the `repro`
    # job's posture above.
    continue-on-error: true
    steps:
      # Checkout only the comparison script (the verifier builds
      # nothing — it just diffs the two runners' manifests).
      - uses: actions/checkout@v5
      - name: Download runner-a hashes
        uses: actions/download-artifact@v4
        with:
          name: cross-runner-hashes-a
          path: a/
      - name: Download runner-b hashes
        uses: actions/download-artifact@v4
        with:
          name: cross-runner-hashes-b
          path: b/
      - name: Diff across runners
        # Same single-source-of-truth diff + known-flaky filter as
        # the same-runner job; SLSA L3 prerequisite per plan §8.
        run: |
          bash "$GITHUB_WORKSPACE/ci/repro/compare-build-hashes.sh" \
            a/hashes.txt b/hashes.txt "release artifacts (cross-runner)"
