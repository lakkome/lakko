# G3-4-mobile — iOS / Android mobile half of the dockerised
# SFU end-to-end gate (Variant A: manual-trigger only).
#
# Brings up the same compose stack as `sfu-e2e.yml`
# (`ci/sfu-e2e/docker-compose.yml`), then exercises:
#   - **iOS** — `xcodebuild test -scheme Lakko
#     -only-testing:LakkoTests` on a booted iPhone 15
#     simulator. The XCTest target reads
#     `LAKKO_SFU_E2E_URL` from its process environment and
#     hits `/health` over the simulator → host loopback.
#   - **Android** — `./gradlew :app:connectedDebugAndroidTest`
#     on a Pixel-class API-34 emulator brought up by
#     `reactivecircus/android-emulator-runner`. The
#     instrumented test reads the same URL from the
#     `instrumentation-arguments` channel and hits `/health`
#     over the Android-emulator → host loopback `10.0.2.2`.
#
# Why a single `macos-14` runner for both halves:
#   - iOS Simulator requires macOS (Apple constraint).
#   - Android Emulator on macOS uses HVF (Hypervisor.framework)
#     for hardware acceleration. KVM-on-Linux is not available
#     on GitHub-hosted runners — actions/runner-images#183
#     has been open since 2019.
#   - Running both on the same host means one compose-bring-
#     up amortises across both test runs.
#
# Trigger:
#   - manual via `workflow_dispatch` only.
#
# Quota-conservation mode (May 2026): no schedule, no
# PR-label, no push. A full run burns ~25-35 minutes of
# `macos-14` runtime which counts as 250-350 Linux minutes
# against the Free-tier 2,000-minute budget. Re-enable a
# `schedule:` cron + PR-label trigger when a paid tier or a
# self-hosted Mac mini lands.
#
# What this workflow covers as of G3-4-mobile-call iter1
# (May 2026):
#   - Health probe: simulator + emulator both reach the
#     SFU's `/health` over loopback (first-wave G3-4-mobile).
#   - **Signaling round-trip**: simulator + emulator both
#     mint a JWT (via `cargo run --example mint_test_jwt`
#     pre-step) and open a real WebSocket to
#     `/v1/connect` offering the `lakko-sfu-v1` and
#     `lakko-sfu-token.<jwt>` subprotocols (the token never
#     rides the URL), asserting the first server frame is a
#     typed `Welcome` echoing the JWT's `call_id`. Tests
#     the full JWT verify path the SFU runs against the
#     fixture JWKS.
#
# Deferred follow-up `G3-4-mobile-call-iter2`:
#   - Dual-simulator / dual-emulator live RTP between two
#     synthetic peers (the actual end-to-end SFrame round-
#     trip over real ICE / DTLS). Requires real
#     `RTCPeerConnection` integration on both halves +
#     synthesised audio source + frame-counter assertions.
#     Sketch: two `XCTestExpectation`s in one process /
#     two coroutines in one instrumented test, each driving
#     `WebRTCPeerConnection` / `WebRtcPeerConnection`
#     through the SDP exchange, sending and receiving
#     opus-encoded audio for ~2 s, asserting peer-B sees
#     ≥ K frames within T seconds. ~600 LOC per platform.

name: g3-4-mobile

on:
  workflow_dispatch: {}

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  g3-4-mobile:
    if: github.event_name == 'workflow_dispatch'

    name: iOS + Android against dockerised SFU
    runs-on: macos-14
    # A green run completes in 25-30 minutes on a cold cache
    # (Rust SFU build ~5 min, Xcode test ~3 min, Android
    # emulator boot + test ~10-15 min). 60 min upper-bounds
    # the pathological cold-cache case + any one-off
    # Homebrew install drift.
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v5

      # --- Toolchains ------------------------------------------
      - uses: dtolnay/rust-toolchain@1.95.0

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # Android SDK manager — the emulator-runner step below
      # uses the SDK we provision here. `level=34` matches the
      # `libs.versions.toml :: android.target.sdk` pin.
      - name: setup Android SDK
        uses: android-actions/setup-android@v3

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: "g3-4-mobile"

      # Cache Gradle so the second invocation in the same
      # session reuses the dependency graph.
      - uses: gradle/actions/setup-gradle@v4

      # Docker.app on `macos-14` runners is bundled but not
      # started by default. We use colima (lightweight alt) so
      # the workflow is independent of whether the runner
      # ships Docker Desktop.
      - name: setup colima
        run: |
          brew install colima docker docker-compose
          colima start --cpu 4 --memory 8 --disk 30

      # --- SFU compose stack -----------------------------------
      - name: docker compose up
        run: |
          docker compose -f ci/sfu-e2e/docker-compose.yml up \
            --build \
            --detach \
            --wait \
            --wait-timeout 240

      - name: docker compose ps
        run: docker compose -f ci/sfu-e2e/docker-compose.yml ps

      # The published port from the compose mapping
      # (`127.0.0.1:7880:7880` under `services.sfu.ports`).
      # Both the iOS simulator and the Android emulator
      # reach the host's `7880` through their respective
      # loopback bridges (simulator: `127.0.0.1` directly,
      # emulator: `10.0.2.2`).
      - name: verify SFU is reachable from host
        run: |
          curl -fsS http://127.0.0.1:7880/health

      # --- G3-4-mobile-call iter1: mint JWT ---------------------
      # The `mint_test_jwt` example signs with the fixture
      # seed `[0x42; 32]` the dockerised SFU's JWKS file
      # pins (`ci/sfu-e2e/test-jwks/jwks.json`). The token's
      # `call_id` matches what the iOS + Android signaling
      # tests assert against in the Welcome frame.
      - name: mint SFU test JWT
        id: mint_jwt
        run: |
          jwt=$(cargo run --quiet --release -p lakko-call-jwt \
            --example mint_test_jwt -- \
            --call-id deadbeef0000000000000000000000aa \
            --account cafef00d0000000000000000000000bb \
            --role participant \
            --ttl-secs 600)
          # Stash on the step output AND in GITHUB_ENV so both
          # the iOS step (env mapping) and the Android step
          # (instrumentation argument) can read it.
          echo "jwt=$jwt" >> "$GITHUB_OUTPUT"
          echo "LAKKO_SFU_E2E_JWT=$jwt" >> "$GITHUB_ENV"

      # --- iOS half --------------------------------------------
      - name: install xcodegen
        run: brew install xcodegen

      - name: xcodegen generate
        working-directory: apps/ios
        run: xcodegen generate

      - name: boot iPhone simulator
        run: |
          # `xcrun simctl` ships in every macos-14 image's
          # Xcode. Pick the first iPhone 15-class device the
          # runner image supplies — the Lakko project's
          # iOS-17 deployment target floor accepts any of them.
          udid=$(xcrun simctl list devices available -j | \
                 python3 -c '
          import json, sys
          data = json.load(sys.stdin)
          for runtime, devices in data["devices"].items():
              for d in devices:
                  if d.get("isAvailable") and "iPhone 15" in d["name"]:
                      print(d["udid"])
                      sys.exit(0)
          sys.exit(1)
          ')
          echo "Booting simulator $udid"
          xcrun simctl boot "$udid" || true
          xcrun simctl bootstatus "$udid" -b

      - name: xcodebuild test -only-testing:LakkoTests
        working-directory: apps/ios
        env:
          # xcodebuild reads env vars from the parent process
          # but the simulator-hosted XCTest target does NOT
          # see them — see `apps/ios/project.yml` scheme
          # block `environmentVariables` which threads the
          # build-setting values through to the test runner
          # via `$(...)` interpolation.
          LAKKO_SFU_E2E_URL: http://127.0.0.1:7880
          LAKKO_SFU_E2E_JWT: ${{ steps.mint_jwt.outputs.jwt }}
        run: |
          # Pass URL + JWT as build-setting overrides on the
          # xcodebuild command line. The scheme's
          # `environmentVariables` block evaluates
          # `$(LAKKO_SFU_E2E_URL)` / `$(LAKKO_SFU_E2E_JWT)`
          # against these and injects the result into the
          # test process environment.
          xcodebuild test \
            -scheme Lakko \
            -destination 'platform=iOS Simulator,name=iPhone 15' \
            -only-testing:LakkoTests \
            LAKKO_SFU_E2E_URL="${LAKKO_SFU_E2E_URL}" \
            LAKKO_SFU_E2E_JWT="${LAKKO_SFU_E2E_JWT}"

      # --- Android half ----------------------------------------
      # `reactivecircus/android-emulator-runner` knows how to
      # provision an Android emulator on a macos-14 runner via
      # HVF — under the hood it accepts the emulator image,
      # boots it, waits for `boot_completed`, runs the
      # provided script, and tears down. Single-action, one
      # cold-boot of ~3-5 minutes.
      - name: instrumented test via Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          # Skip GPU acceleration in headless CI — slower but
          # avoids fighting the runner's display layer.
          emulator-options: -no-snapshot -no-window -gpu swiftshader_indirect
          # `connectedDebugAndroidTest` invokes the
          # `AndroidJUnitRunner` against the installed
          # `app-debug-androidTest.apk`. We pass the SFU URL
          # via the runner's documented argument channel.
          script: |
            ./gradlew :app:connectedDebugAndroidTest \
              -Pandroid.testInstrumentationRunnerArguments.LAKKO_SFU_E2E_URL=http://10.0.2.2:7880 \
              -Pandroid.testInstrumentationRunnerArguments.LAKKO_SFU_E2E_JWT="${{ steps.mint_jwt.outputs.jwt }}"
          working-directory: apps/android

      # --- Teardown + failure capture --------------------------
      - name: docker compose logs (on failure)
        if: failure()
        run: |
          mkdir -p artifacts
          docker compose -f ci/sfu-e2e/docker-compose.yml logs --no-color sfu       > artifacts/sfu.log       || true
          docker compose -f ci/sfu-e2e/docker-compose.yml logs --no-color test-jwks > artifacts/test-jwks.log || true

      - name: upload Android test reports (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: g3-4-mobile-android-reports
          path: |
            apps/android/app/build/reports/androidTests/
            apps/android/app/build/outputs/androidTest-results/
          retention-days: 14

      - name: upload iOS test reports (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: g3-4-mobile-ios-reports
          path: |
            ~/Library/Developer/Xcode/DerivedData/Lakko-*/Logs/Test/
          retention-days: 14

      - name: upload compose logs (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: g3-4-mobile-compose-logs
          path: artifacts/
          retention-days: 14

      - name: docker compose down
        if: always()
        run: |
          docker compose -f ci/sfu-e2e/docker-compose.yml down --volumes
