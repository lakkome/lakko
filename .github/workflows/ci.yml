# Per-push / per-PR CI. **Linux-only** through Phase 1.13.
#
# We deliberately do not run macOS or Windows in CI right now:
#
#   * The codebase has zero `#[cfg(target_os = "macos")]` /
#     `#[cfg(windows)]` branches. The only platform gate is
#     `#[cfg(unix)]` on SIGTERM handling, and macOS *is* unix —
#     the Linux job already exercises that path.
#   * Every dep we ship (RustCrypto, OpenMLS, opaque-ke, voprf,
#     quinn, …) is pure-Rust with no platform sysdeps.
#   * macOS runners cost a 10× minute multiplier on private repos.
#     A single `cargo test --workspace` on macos-latest burns
#     ~100 quota-minutes; running the matrix on every push ate
#     the entire 2,000-minute Free quota in <10 pushes.
#
# Bring macOS back when **Phase 1.14** (`apps/ios` skeleton)
# lands — UniFFI's XCFramework build needs Xcode. Bring Windows
# back with **Phase 1.16f+** desktop / `apps/tauri-windows`.
# Until then there is nothing for either runner to catch that
# the Linux job doesn't already.

name: CI

# **Quota-conservation mode (May 2026 — re-enable in June after
# free-tier reset)**: per-push / per-PR auto-triggers are
# disabled until the 2,000-minute Free quota resets at the
# start of the next billing month. The `push:` / `pull_request:`
# blocks are kept as commented stanzas below so re-enabling is a
# single uncomment.
#
# Until then run validation locally before commit:
#
#   just lint && just fmt-check && just test
#
# Trigger a full CI sweep manually via:
#
#   Actions tab → CI → "Run workflow"
#
# Reverting: uncomment the `push:` / `pull_request:` blocks and
# remove this header note. ROADMAP entry tracks the flip.
on:
  # push:
  #   branches: [main]
  # pull_request:
  #   branches: [main]
  workflow_dispatch: {}

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  CARGO_INCREMENTAL: 0

# Avoid wasted cycles when a PR is force-pushed: cancel the previous run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  test:
    name: cargo test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.95.0
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --all-features --no-fail-fast

  log-hygiene:
    # ADR-0078 section 11 (decision 5): the source lint over every service's
    # tracing macros, and the capture tests that drive discovery's and the
    # DS's routes against a real database and fail on any identifier-shaped
    # value in the log output.
    name: log hygiene (ADR-0078 section 11)
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_USER: lakko
          MARIADB_PASSWORD: devpass
          MARIADB_DATABASE: lakko_discovery_ci
        ports: ["3306:3306"]
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s --health-timeout=5s --health-retries=30
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.95.0
      - uses: Swatinem/rust-cache@v2
      - name: Source lint
        run: cargo test -p lakko-log-hygiene --all-features
      - name: Create the DS test database
        run: >-
          mysql -h127.0.0.1 -uroot -proot -e
          "CREATE DATABASE lakko_ds_ci; GRANT ALL ON lakko_ds_ci.* TO 'lakko'@'%';"
      - name: Capture tests
        env:
          LAKKO_DISCOVERY_TEST_DATABASE_URL: mysql://lakko:devpass@127.0.0.1:3306/lakko_discovery_ci
          LAKKO_DS_TEST_DATABASE_URL: mysql://lakko:devpass@127.0.0.1:3306/lakko_ds_ci
        run: |
          cargo test -p lakko-svc-discovery log_capture
          cargo test -p lakko-svc-ds log_capture

  doc:
    name: cargo doc
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.95.0
      - uses: Swatinem/rust-cache@v2
      - env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --workspace --no-deps --all-features

  deny:
    name: cargo deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
          arguments: --all-features

  reuse:
    name: REUSE compliance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: fsfe/reuse-action@v5

  fuzz-check:
    name: fuzz harnesses (smoke-build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.95.0
      - uses: Swatinem/rust-cache@v2
      - name: Smoke-build lakko-mls fuzz crate
        run: cargo check --manifest-path crates/lakko-mls/fuzz/Cargo.toml
      - name: Smoke-build lakko-proto fuzz crate
        run: cargo check --manifest-path crates/lakko-proto/fuzz/Cargo.toml

  wasm-build:
    # Phase 1.13 — confirm `lakko-ffi-wasm` (and its full dep graph
    # including OpenMLS, RustCrypto, lakko-mls) actually builds for
    # `wasm32-unknown-unknown`. Catches regressions where someone
    # adds a dep that's host-only.
    name: wasm32 build (lakko-ffi-wasm)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: cargo build --target wasm32-unknown-unknown
        run: cargo build -p lakko-ffi-wasm --target wasm32-unknown-unknown

  wasm-test:
    # Phase 1.16f3 — wasm-bindgen-test smoke suite. Runs the
    # WASM-shape regression tests in `crates/lakko-ffi-wasm/src/wasm_tests.rs`
    # under Node V8. No browser driver required — `wasm-pack test
    # --node` uses the Node runtime that ubuntu-latest already
    # ships with. Catches missing `js` features on `getrandom` /
    # `openmls`, JsError surface regressions, and the snapshot/
    # restore round-trip through the actual WASM bridge — none of
    # which the host-side `cargo test` job can see.
    name: wasm-bindgen-test (Node)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: Install wasm-pack
        # Same pin as web-build below. Swatinem caches the
        # ~/.cargo/bin entry across runs.
        run: cargo install wasm-pack --version ^0.13 --locked
      - name: wasm-pack test --node
        run: wasm-pack test --node crates/lakko-ffi-wasm

  web-build:
    # Phase 1.16a — confirm `apps/web` (Solid.js + Vite + WASM core)
    # builds end-to-end: wasm-pack against `lakko-ffi-wasm`, TS
    # type-check, and a Vite production bundle. Catches breakage in
    # the FFI surface, the wasm-bindgen exports, or the Vite/Solid
    # configuration.
    name: web build (apps/web)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install wasm-pack
        # Pin to a known-good release; bump together with the
        # toolchain in apps/web/README.md. `Swatinem/rust-cache`
        # caches `~/.cargo/bin/wasm-pack` so this is fast on
        # warm runners.
        run: cargo install wasm-pack --version ^0.13 --locked
      - name: npm install
        run: npm ci
      - name: npm run build
        # Drives wasm-pack (release) + tsc --noEmit + vite build.
        run: npm run build
      - name: Type-check the browser tests
        # `playwright/` is outside the app's tsconfig: its harness fell
        # behind the components it renders and nothing reported it.
        run: npm run typecheck:e2e
      - name: Unit tests
        run: npm test
      - name: Install the Playwright browsers
        run: npx playwright install --with-deps chromium webkit firefox
      - name: Browser tests
        # Chromium and WebKit, and Firefox for the one-to-one call spec.
        env:
          CI: "1"
        run: npm run test:e2e
      - name: Report bundle size
        # Phase 1.16c bundle target is < 2 MB gzipped — the report
        # is informational here so we can watch the trend, not a
        # hard gate yet.
        run: |
          du -sh dist
          find dist -type f -name '*.js' -o -name '*.wasm' | xargs -I{} sh -c 'gzip -c "{}" | wc -c | awk -v f="{}" "{printf \"%s\\t%d bytes gz\\n\", f, \$1}"'
