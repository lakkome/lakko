name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  CARGO_INCREMENTAL: 0

# Avoid wasted cycles when a PR is force-pushed: cancel the previous run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  clippy:
    name: clippy (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  test:
    name: cargo test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --all-features --no-fail-fast

  doc:
    name: cargo doc
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --workspace --no-deps --all-features

  deny:
    name: cargo deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
          arguments: --all-features

  reuse:
    name: REUSE compliance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: fsfe/reuse-action@v5

  fuzz-check:
    name: fuzz harnesses (smoke-build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Smoke-build lakko-mls fuzz crate
        run: cargo check --manifest-path crates/lakko-mls/fuzz/Cargo.toml
      - name: Smoke-build lakko-proto fuzz crate
        run: cargo check --manifest-path crates/lakko-proto/fuzz/Cargo.toml

  wasm-build:
    # Phase 1.13 — confirm `lakko-ffi-wasm` (and its full dep graph
    # including OpenMLS, RustCrypto, lakko-mls) actually builds for
    # `wasm32-unknown-unknown`. Catches regressions where someone
    # adds a dep that's host-only.
    name: wasm32 build (lakko-ffi-wasm)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: cargo build --target wasm32-unknown-unknown
        run: cargo build -p lakko-ffi-wasm --target wasm32-unknown-unknown

  repro-build:
    name: reproducible build verifier
    runs-on: ubuntu-latest
    # Best-effort job — verifies the workspace builds reproducibly
    # (byte-identical between two independent clean builds). Full Rust
    # reproducibility needs careful flag tuning; for now the job is
    # advisory — failures do not block merge. Drop continue-on-error
    # once byte-identicality is stable.
    continue-on-error: true
    env:
      # Pin the path prefix so absolute paths in debuginfo do not differ
      # between independent checkouts. `/github/workspace` is the
      # standard working directory on ubuntu runners.
      RUSTFLAGS: --remap-path-prefix=/github/workspace=. -C symbol-mangling-version=v0
      SOURCE_DATE_EPOCH: "1735689600"  # 2025-01-01 UTC, fixed
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - name: First build
        run: |
          cargo build --workspace --release --locked
          mkdir -p /tmp/build-a
          find target/release -maxdepth 1 -type f \( -name 'lakko-svc-*' -o -name '*.rlib' \) \
            | sort | xargs -I{} cp {} /tmp/build-a/
          (cd /tmp/build-a && sha256sum * | sort) > /tmp/build-a-hashes.txt
          echo "===== Build A hashes =====" && cat /tmp/build-a-hashes.txt
      - name: Clean target
        run: cargo clean
      - name: Second build
        run: |
          cargo build --workspace --release --locked
          mkdir -p /tmp/build-b
          find target/release -maxdepth 1 -type f \( -name 'lakko-svc-*' -o -name '*.rlib' \) \
            | sort | xargs -I{} cp {} /tmp/build-b/
          (cd /tmp/build-b && sha256sum * | sort) > /tmp/build-b-hashes.txt
          echo "===== Build B hashes =====" && cat /tmp/build-b-hashes.txt
      - name: Compare hashes
        run: |
          # Filter known non-reproducible artifacts before diffing so
          # real regressions do not get drowned in noise.
          # liblakko_ffi_uniffi.rlib: uniffi 0.28 proc-macros embed
          # non-deterministic state (track upstream). Every other .rlib
          # and binary must match byte-for-byte.
          KNOWN_FLAKY='liblakko_ffi_uniffi\.rlib'

          grep -v -E "$KNOWN_FLAKY" /tmp/build-a-hashes.txt > /tmp/a-filtered.txt
          grep -v -E "$KNOWN_FLAKY" /tmp/build-b-hashes.txt > /tmp/b-filtered.txt

          if diff -u /tmp/a-filtered.txt /tmp/b-filtered.txt; then
            echo "✅ Reproducible: byte-identical artifacts (excluding known flaky: $KNOWN_FLAKY)"
          else
            echo "⚠️ Non-reproducible: artifacts differ between builds"
            echo "(this job is non-blocking until we tune flags for stable byte-identicality)"
            exit 1
          fi
