<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#3730a3" />
    <meta
      name="description"
      content="Lakko. Private messaging, end-to-end encrypted by default."
    />

    <!-- Phase 1.17 will add SRI hashes + a strict CSP header. The
         skeleton meta below is the floor we never want to drop below. -->
    <meta http-equiv="X-Content-Type-Options" content="nosniff" />
    <meta http-equiv="Referrer-Policy" content="no-referrer" />

    <!-- Phase 1.16f2 — PWA manifest + Apple-side equivalents. The
         service worker registered from main.tsx precaches the app
         shell; the manifest declares install metadata. -->
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Lakko" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />

    <title>Lakko</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
