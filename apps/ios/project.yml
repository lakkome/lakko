# `apps/ios/project.yml` — xcodegen spec (Phase 1.14c).
#
# `xcodegen generate` (from the `apps/ios/` directory) reads
# this YAML and produces `Lakko.xcodeproj/` next to it. The
# generated `.xcodeproj` is **gitignored as a build artefact**
# — the YAML is the reviewable source of truth, the
# `.xcodeproj` binary blob never lands in `git diff`.
#
# Mirror of the contract the Android side ships via the Gradle
# `apps/android/app/build.gradle.kts` text file + Android
# Studio's first-launch wrapper bootstrap. xcodegen plays the
# role of the Gradle build script: text-in, project-blob-out.
#
# Why xcodegen and not a hand-rolled `project.pbxproj`: Xcode
# project files are a plist-like binary format with per-developer
# absolute-path drift; reviewing diffs on them is a permanent
# papercut. xcodegen is the canonical 2024+ pattern for
# medium-to-large iOS shops + has been the default for any
# polyglot monorepo for years now. The dep is one Homebrew
# install (`brew install xcodegen`) and the spec is plain YAML.

name: Lakko

# Pinned versions match the SPM Package.swift platform floor
# from 1.14b (iOS 17). Bumping either side requires bumping
# the other in lock-step.
options:
  bundleIdPrefix: me.lakko
  deploymentTarget:
    iOS: "17.0"
  # Reproducible-build posture: pin every dimension xcodegen
  # exposes so a regenerate produces byte-identical
  # `.xcodeproj` content given identical inputs. The
  # `groupSortPosition: top` keeps groups deterministic vs.
  # whatever order the filesystem reports.
  groupSortPosition: top
  generateEmptyDirectories: true

# Single iOS app target — `Lakko`. The SwiftUI source lives at
# `apps/ios/Lakko/` (committed); the `Info.plist` is
# auto-synthesized by xcodegen from the `info` block below
# (xcodegen handles the merge with Xcode's defaults — every
# key we'd hand-roll is reachable from `info.properties`).
targets:
  Lakko:
    type: application
    platform: iOS
    sources:
      - path: Lakko
    # Asset catalog: omitted for the smoke build (1.14c). The
    # default Xcode-emitted launcher icon shows for `me.lakko.dev`
    # debug installs. The real branding lands when 1.14d's
    # signup screen has a place to surface it.
    info:
      path: Lakko/Info.plist
      properties:
        # Mirror of the Android `applicationId = "me.lakko.dev"`
        # — keeps debug installs separate from a future
        # production `me.lakko` bundle on the same device.
        CFBundleDisplayName: Lakko
        UILaunchScreen: {}  # blank launch screen
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        # `UIRequiredDeviceCapabilities` left at default — every
        # device the deployment target accepts has the same
        # baseline (arm64, OpenGL ES 2.0).
    # Universal Links entitlement (Phase 1.14e9). Mirror of the
    # Android `<intent-filter autoVerify="true">` for
    # `https://lakko.me/i/*`. The actual handler lives in
    # `LakkoApp.body`'s `.onOpenURL { ... }` modifier; this
    # entitlement is the on-device half of the Universal Links
    # contract. The other half — the `apple-app-site-association`
    # JSON at `https://lakko.me/.well-known/apple-app-site-association`
    # — lives server-side (lakko-svc-discovery serves it; the JSON
    # claims this bundle id under `applinks/details/appIDs`).
    entitlements:
      path: Lakko/Lakko.entitlements
      properties:
        com.apple.developer.associated-domains:
          - applinks:lakko.me
        # 1.20c — Push Notifications entitlement. `development`
        # routes APNs requests through the sandbox endpoint
        # (`api.sandbox.push.apple.com`); production builds
        # need this flipped to `production` via a release-only
        # entitlement override. Without this entry,
        # `UIApplication.registerForRemoteNotifications()`
        # fails immediately with "no valid 'aps-environment'
        # entitlement string found".
        aps-environment: development
        # 1.20c2 — App Group shared with
        # `LakkoNotificationService`. Sets the ground for the
        # 1.20c2b decrypt path (the NSE will read the main
        # app's MLS provider state through this group's shared
        # container). The 1.20c2 NSE itself doesn't read any
        # shared state yet; the entitlement is provisioned
        # now so the App Store / signing infrastructure is
        # set up once.
        com.apple.security.application-groups:
          - group.me.lakko.dev.shared
    dependencies:
      # Local Swift Package reference. The `package: LakkoCore`
      # name matches the SPM Package.swift's `name:` field; the
      # `product: LakkoCore` matches the package's single
      # exported library product (1.14b).
      - package: LakkoCore
        product: LakkoCore
      # 1.20c2 — embed the `UNNotificationServiceExtension`
      # bundle inside the host app at `PlugIns/`. xcodegen's
      # `target:` dep with `embed: true` (the default for
      # `app-extension`-type deps) produces the right "Copy
      # Files (PlugIns)" build phase.
      - target: LakkoNotificationService
    settings:
      base:
        # `SWIFT_VERSION = 5.10` matches the Package.swift's
        # `swift-tools-version` from 1.14b. Bumping requires a
        # coordinated change on both sides.
        SWIFT_VERSION: "5.10"
        # `me.lakko.dev` — same as the Android applicationId.
        PRODUCT_BUNDLE_IDENTIFIER: me.lakko.dev
        # Modern build-settings (Xcode 15+) defaults we want
        # locked in: enable-bitcode is dead, deprecated-build-
        # system is gone, ENABLE_USER_SCRIPT_SANDBOXING is on
        # by default. Nothing to override for now.

  # Phase 1.20c2 — UNNotificationServiceExtension.
  #
  # iOS invokes this extension before displaying any APNs alert
  # push that carries `aps.mutable-content = 1` (see
  # `services/push-gw/src/providers/apns.rs`). The extension
  # has ~30s + 30 MB to mutate the notification before display;
  # 1.20c2 uses the budget to set `threadIdentifier` to the
  # group hex so iOS groups per-conversation notifications on
  # the lock screen. The MLS-decrypt-before-display path lands
  # in 1.20c2b — see `NotificationService.swift` header for
  # the deferred-scope rationale.
  #
  # The bundle id must be a child of the main app's
  # (Apple requirement for extensions); we suffix with
  # `.LakkoNotificationService`.
  LakkoNotificationService:
    type: app-extension
    platform: iOS
    sources:
      - path: LakkoNotificationService
    info:
      path: LakkoNotificationService/Info.plist
      properties:
        CFBundleDisplayName: Lakko Notifications
        # `NSExtension` block lives in the Info.plist itself
        # (not synthesized from `properties` here) because the
        # principal-class declaration uses
        # `$(PRODUCT_MODULE_NAME).NotificationService` which
        # the build system substitutes at compile time —
        # xcodegen's property merge would interpolate it
        # too early.
    entitlements:
      path: LakkoNotificationService/LakkoNotificationService.entitlements
      properties:
        # Same App Group as the main app — both targets must
        # carry it for the shared-container plumbing to work.
        com.apple.security.application-groups:
          - group.me.lakko.dev.shared
    settings:
      base:
        SWIFT_VERSION: "5.10"
        # Apple requires the extension bundle id to be a strict
        # child of the host app's.
        PRODUCT_BUNDLE_IDENTIFIER: me.lakko.dev.LakkoNotificationService
        # Match the deployment target floor of the host app
        # (Phase 1.14b pinned iOS 17). Lower would prevent
        # bundling.
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
        # The extension target does NOT depend on LakkoCore
        # (or any UniFFI surface). 1.20c2 only reads the APNs
        # `userInfo` dictionary; 1.20c2b's decrypt path will
        # introduce a separate slim `LakkoCoreExtension`
        # framework with just `parseEnvelope` +
        # `Group.processIncoming` carved out for the
        # 30 MB-memory extension process.

# Local Swift Package: the LakkoCore wrapper from 1.14b.
# Relative path resolves from `apps/ios/` to the same
# directory. xcodegen forwards this to Xcode as a "local SPM
# dependency" which Xcode resolves at build time (it's the
# same shape Xcode's "File → Add Packages → Add Local…" wizard
# produces, just in YAML form).
packages:
  LakkoCore:
    path: "."

# Schemes — xcodegen auto-generates one per target, but we
# pin the explicit form so the build / archive / test actions
# are reproducible. Single scheme `Lakko` covers Debug + Release.
schemes:
  Lakko:
    build:
      targets:
        Lakko: all
    run:
      config: Debug
    archive:
      config: Release
