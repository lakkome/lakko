# `apps/ios/project.yml` — xcodegen spec (Phase 1.14c).
#
# `xcodegen generate` (from the `apps/ios/` directory) reads
# this YAML and produces `Lakko.xcodeproj/` next to it. The
# generated `.xcodeproj` is **gitignored as a build artefact**
# — the YAML is the reviewable source of truth, the
# `.xcodeproj` binary blob never lands in `git diff`.
#
# Mirror of the contract the Android side ships via the Gradle
# `apps/android/app/build.gradle.kts` text file + Android
# Studio's first-launch wrapper bootstrap. xcodegen plays the
# role of the Gradle build script: text-in, project-blob-out.
#
# Why xcodegen and not a hand-rolled `project.pbxproj`: Xcode
# project files are a plist-like binary format with per-developer
# absolute-path drift; reviewing diffs on them is a permanent
# papercut. xcodegen is the canonical 2024+ pattern for
# medium-to-large iOS shops + has been the default for any
# polyglot monorepo for years now. The dep is one Homebrew
# install (`brew install xcodegen`) and the spec is plain YAML.

name: Lakko

# Pinned versions match the SPM Package.swift platform floor
# from 1.14b (iOS 17). Bumping either side requires bumping
# the other in lock-step.
options:
  bundleIdPrefix: me.lakko
  deploymentTarget:
    iOS: "17.0"
  # Reproducible-build posture: pin every dimension xcodegen
  # exposes so a regenerate produces byte-identical
  # `.xcodeproj` content given identical inputs. The
  # `groupSortPosition: top` keeps groups deterministic vs.
  # whatever order the filesystem reports.
  groupSortPosition: top
  generateEmptyDirectories: true

# Single iOS app target — `Lakko`. The SwiftUI source lives at
# `apps/ios/Lakko/` (committed); the `Info.plist` is
# auto-synthesized by xcodegen from the `info` block below
# (xcodegen handles the merge with Xcode's defaults — every
# key we'd hand-roll is reachable from `info.properties`).
targets:
  Lakko:
    type: application
    platform: iOS
    sources:
      - path: Lakko
      # G3-sframe-native N-4 — pull the C++ bridge sub-sprint
      # source into the iOS target as a sibling compile unit.
      # Only the production .cc / .h ship; test_bridge.cc +
      # test_checks_stub.cc are excluded — the iOS WebRTC
      # framework supplies the real FatalLog at link time, and
      # the standalone test main() would collide with iOS app
      # main.
      - path: ../shared/sframe-bridge/sframe-bridge.cc
        type: file
        buildPhase: sources
      - path: ../shared/sframe-bridge/sframe-bridge.h
        type: file
        buildPhase: headers
    # Asset catalog: omitted for the smoke build (1.14c). The
    # default Xcode-emitted launcher icon shows for `me.lakko.dev`
    # debug installs. The real branding lands when 1.14d's
    # signup screen has a place to surface it.
    info:
      path: Lakko/Info.plist
      properties:
        # Mirror of the Android `applicationId = "me.lakko.dev"`
        # — keeps debug installs separate from a future
        # production `me.lakko` bundle on the same device.
        CFBundleDisplayName: Lakko
        UILaunchScreen: {}  # blank launch screen
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        # KT-log S3d — transparency-log integration config (mirror of
        # the web `VITE_LAKKO_TRANSPARENCY_URL` /
        # `VITE_LAKKO_TRANSPARENCY_OPERATOR_KEY`). Both default to EMPTY
        # so the additive log check is OFF until a deployment provisions
        # them per build configuration — the supersession/pin gate
        # (ADR-0016) remains the primary, fail-closed trust either way.
        #   * LakkoTransparencyUrl — service base URL, no trailing path.
        #   * LakkoTransparencyOperatorKey — base64 (standard alphabet)
        #     of the operator's 32-byte Ed25519 verifying key, pinned
        #     OUT-OF-BAND at build time. The client never trusts the
        #     `/transparency/operator-key` endpoint for verification.
        #   * LakkoTransparencyWitnessKey — base64 of the witness's
        #     32-byte Ed25519 verifying key (ADR-0020 split-view defence),
        #     pinned out-of-band like the operator key. When set, a root
        #     without a valid witness co-sig is refused (fail-closed);
        #     blank → the witness gate is OFF (operator-only transition).
        LakkoTransparencyUrl: ""
        LakkoTransparencyOperatorKey: ""
        LakkoTransparencyWitnessKey: ""
        # ADR-0026 Phase 4 — anti-censorship bootstrap pin. All default
        # to EMPTY so the build cannot arm (BootstrapPin returns nil →
        # AntiCensorshipManager stays disarmed) until a deployment
        # provisions them per build configuration. There is no insecure
        # default; arming requires the pinned trust anchor.
        #   * LakkoBootstrapTrustAnchor — base64 of the 32-byte Ed25519
        #     verifying key the signed bootstrap config is checked
        #     against, pinned OUT-OF-BAND at build time.
        #   * LakkoBootstrapDohDomain — the rendezvous domain resolved
        #     over JSON-DoH (e.g. rendezvous.lakko.me).
        #   * LakkoBootstrapConfigPath — the signed-config path on that
        #     domain (e.g. /bootstrap.json).
        LakkoBootstrapTrustAnchor: ""
        LakkoBootstrapDohDomain: ""
        LakkoBootstrapConfigPath: ""
        # ADR-0037 (G-11) — backup-head freshness window in SECONDS. A
        # fresh-install restore refuses an authentic head older than this
        # (stale-override). Empty / absent → the 30-day (2_592_000 s) default
        # in `backupHeadStalenessSecs()`. Tune to the observed auto-backup
        # cadence; too tight → false stale refusals, too loose → a wider
        # within-window fresh-install replay residual.
        LakkoBackupHeadStalenessSecs: ""
        # G-29 — background contact-inbox refresh. `BGAppRefreshTask`
        # (registered on the scene via `.backgroundTask(.appRefresh(_:))`
        # in LakkoApp, scheduled by `ContactBackgroundRefresh`) needs the
        # `fetch` background mode AND its identifier in the permitted-task
        # allow-list, or the OS refuses to launch it. Opportunistic only —
        # iOS decides if/when to run it; an APNs `content-available` wake for
        # immediate surfacing is a separate follow-up.
        UIBackgroundModes:
          - fetch
        BGTaskSchedulerPermittedIdentifiers:
          - me.lakko.dev.contact-refresh
        # Phase 2a3b3-ui — camera access for the add-device QR
        # scanner + G3-1 video calls. Apple's permission dialog
        # surfaces this string verbatim; keep the wording
        # aligned with what the user sees in the Devices → "Add
        # a device" screen.
        NSCameraUsageDescription: >-
          Lakko uses the camera to scan a QR codes from devices
          you want to link to your account and to capture
          video for in-call streams. The camera is never
          recorded server-side — every call frame is end-to-end
          encrypted under SFrame keys derived from the call's
          MLS group.
        # G3-1 — microphone access for in-call audio capture
        # via `RTCAudioTrack`. iOS refuses to instantiate the
        # `AVAudioSession` shared instance for capture without
        # this string; without it `RTCPeerConnection.addTrack`
        # silently produces a track that delivers zero samples.
        NSMicrophoneUsageDescription: >-
          Lakko uses the microphone to capture your voice for
          end-to-end-encrypted calls. The mic is only on while
          you are in a call and the captured audio is never
          recorded server-side — every call frame is encrypted
          under SFrame keys derived from the call's MLS group
          before it leaves your device.
        # `UIRequiredDeviceCapabilities` left at default — every
        # device the deployment target accepts has the same
        # baseline (arm64, OpenGL ES 2.0).
    # Universal Links entitlement (Phase 1.14e9). Mirror of the
    # Android `<intent-filter autoVerify="true">` for
    # `https://lakko.me/i/*`. The actual handler lives in
    # `LakkoApp.body`'s `.onOpenURL { ... }` modifier; this
    # entitlement is the on-device half of the Universal Links
    # contract. The other half — the `apple-app-site-association`
    # JSON at `https://lakko.me/.well-known/apple-app-site-association`
    # — lives server-side (lakko-svc-discovery serves it; the JSON
    # claims this bundle id under `applinks/details/appIDs`).
    entitlements:
      path: Lakko/Lakko.entitlements
      properties:
        com.apple.developer.associated-domains:
          - applinks:lakko.me
        # 1.20c — Push Notifications entitlement. `development`
        # routes APNs requests through the sandbox endpoint
        # (`api.sandbox.push.apple.com`); production builds
        # need this flipped to `production` via a release-only
        # entitlement override. Without this entry,
        # `UIApplication.registerForRemoteNotifications()`
        # fails immediately with "no valid 'aps-environment'
        # entitlement string found".
        aps-environment: development
        # 1.20c2 — App Group shared with
        # `LakkoNotificationService`. Sets the ground for the
        # 1.20c2b decrypt path (the NSE will read the main
        # app's MLS provider state through this group's shared
        # container). The 1.20c2 NSE itself doesn't read any
        # shared state yet; the entitlement is provisioned
        # now so the App Store / signing infrastructure is
        # set up once.
        com.apple.security.application-groups:
          - group.me.lakko.dev.shared
    dependencies:
      # Local Swift Package reference. The `package: LakkoCore`
      # name matches the SPM Package.swift's `name:` field; the
      # `product: LakkoCore` matches the package's single
      # exported library product (1.14b).
      - package: LakkoCore
        product: LakkoCore
      # G3-1 — WebRTC pod via stasel/WebRTC SPM. The package
      # ships Google's WebRTC C++ engine as an XCFramework
      # (stasel maintains the binary build because Google
      # stopped publishing one in 2022). The single library
      # product is named `WebRTC`. The on-device API
      # (`RTCPeerConnectionFactory`, `RTCPeerConnection`,
      # `RTCAudioTrack`, `RTCVideoTrack`) is consumed by
      # `apps/ios/Lakko/Calls/WebRTCPeerConnection.swift`.
      - package: WebRTC
        product: WebRTC
      # 1.20c2 — embed the `UNNotificationServiceExtension`
      # bundle inside the host app at `PlugIns/`. xcodegen's
      # `target:` dep with `embed: true` (the default for
      # `app-extension`-type deps) produces the right "Copy
      # Files (PlugIns)" build phase.
      - target: LakkoNotificationService
    settings:
      base:
        # `SWIFT_VERSION = 5.10` matches the Package.swift's
        # `swift-tools-version` from 1.14b. Bumping requires a
        # coordinated change on both sides.
        SWIFT_VERSION: "5.10"
        # `me.lakko.dev` — same as the Android applicationId.
        PRODUCT_BUNDLE_IDENTIFIER: me.lakko.dev
        # G3-sframe-native N-4 — bridging header so the Obj-C++
        # SFrameAttach shim (apps/ios/Lakko/Calls/SFrameAttach.mm)
        # is importable from Swift call code without a separate
        # Obj-C-only static library. The header itself lives at
        # apps/ios/Lakko/Lakko-Bridging-Header.h and currently
        # imports only Calls/SFrameAttach.h.
        SWIFT_OBJC_BRIDGING_HEADER: Lakko/Lakko-Bridging-Header.h
        # G3-sframe-native N-4 — the SFrame bridge depends on the
        # `apps/shared/sframe-bridge/sframe-bridge.{h,cc}` C++17
        # source plus the cbindgen-generated header from
        # `crates/lakko-sframe-native`. The Xcode build copies
        # sframe-bridge.cc into the target's compile sources via
        # an additional source path below; we also need to widen
        # the header-search path for "sframe-bridge.h" + the
        # cbindgen-emitted "lakko_sframe_native.h".
        #
        # The C++17 standard is required by the bridge's
        # `std::lock_guard` + `[[nodiscard]]` usage.
        CLANG_CXX_LANGUAGE_STANDARD: c++17
        CLANG_CXX_LIBRARY: libc++
        # Header search paths. Three entries:
        #   - the bridge's own dir (sframe-bridge.h)
        #   - the cbindgen output dir (lakko_sframe_native.h)
        #   - the M125 vendored webrtc headers (only needed by
        #     sframe-bridge.cc, which subclasses webrtc::Frame*)
        HEADER_SEARCH_PATHS:
          - $(SRCROOT)/../shared/sframe-bridge
          # G3-sframe-native N-4 — stable mirror path written by
          # crates/lakko-sframe-native/build.rs alongside the
          # canonical OUT_DIR copy. Xcode does NOT glob HEADER_
          # SEARCH_PATHS, so the hash-suffixed `target/release/
          # build/lakko-sframe-native-*/out` cannot be referenced
          # directly. The mirror at `target/lakko-include/` is
          # populated by every `cargo build -p lakko-sframe-
          # native` invocation.
          - $(SRCROOT)/../../target/lakko-include
          - $(SRCROOT)/../shared/webrtc-cpp-headers/M125/include
        # Link the cross-compiled `liblakko_sframe_native.a`
        # archives. Layout under `target/ios-link/`:
        #
        #   iphoneos/           — aarch64-apple-ios (device only)
        #   iphonesimulator/    — fat archive: aarch64-apple-ios-
        #                         sim + x86_64-apple-ios (lipo'd)
        #
        # Xcode substitutes `$(PLATFORM_NAME)` to one of those
        # directory names at link time. The archives are populated
        # by `just ios-cross-build` (justfile recipe that runs
        # `cargo build -p lakko-sframe-native --release --target
        # <slice>` three times + `lipo -create` for the simulator
        # pair). N-4-build is the follow-up sub-sprint that wires
        # this into an Xcode "Run Script" build phase so a fresh
        # `xcodebuild` invocation auto-builds the archives.
        LIBRARY_SEARCH_PATHS:
          - $(SRCROOT)/../../target/ios-link/$(PLATFORM_NAME)
        OTHER_LDFLAGS:
          - -llakko_sframe_native
        # Modern build-settings (Xcode 15+) defaults we want
        # locked in: enable-bitcode is dead, deprecated-build-
        # system is gone, ENABLE_USER_SCRIPT_SANDBOXING is on
        # by default. Nothing to override for now.

  # Phase 1.20c2 — UNNotificationServiceExtension.
  #
  # iOS invokes this extension before displaying any APNs alert
  # push that carries `aps.mutable-content = 1` (see
  # `services/push-gw/src/providers/apns.rs`). The extension
  # has ~30s + 30 MB to mutate the notification before display;
  # 1.20c2 uses the budget to set `threadIdentifier` to the
  # group hex so iOS groups per-conversation notifications on
  # the lock screen. The MLS-decrypt-before-display path lands
  # in 1.20c2b — see `NotificationService.swift` header for
  # the deferred-scope rationale.
  #
  # The bundle id must be a child of the main app's
  # (Apple requirement for extensions); we suffix with
  # `.LakkoNotificationService`.
  LakkoNotificationService:
    type: app-extension
    platform: iOS
    sources:
      - path: LakkoNotificationService
    info:
      path: LakkoNotificationService/Info.plist
      properties:
        CFBundleDisplayName: Lakko Notifications
        # `NSExtension` block now lives in `properties` so
        # xcodegen owns the entire Info.plist (previous
        # comment about manual editing was stale — Xcode
        # 26 simulator install refuses an app-extension
        # bundle whose Info.plist lacks `NSExtension`
        # outright, surfacing as
        # `extensionDictionary must be set` in IXPlaceholder).
        # `$(PRODUCT_MODULE_NAME)` in the principal-class
        # value IS the syntax the build system substitutes
        # at compile time; xcodegen writes the literal
        # `$(...)` string into the plist and the linker
        # resolves it later, exactly as a hand-rolled
        # Xcode project would.
        NSExtension:
          NSExtensionPointIdentifier: com.apple.usernotifications.service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).NotificationService
    entitlements:
      path: LakkoNotificationService/LakkoNotificationService.entitlements
      properties:
        # Same App Group as the main app — both targets must
        # carry it for the shared-container plumbing to work.
        com.apple.security.application-groups:
          - group.me.lakko.dev.shared
    settings:
      base:
        SWIFT_VERSION: "5.10"
        # Apple requires the extension bundle id to be a strict
        # child of the host app's.
        PRODUCT_BUNDLE_IDENTIFIER: me.lakko.dev.LakkoNotificationService
        # Match the deployment target floor of the host app
        # (Phase 1.14b pinned iOS 17). Lower would prevent
        # bundling.
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
        # The extension target does NOT depend on LakkoCore
        # (or any UniFFI surface). 1.20c2 only reads the APNs
        # `userInfo` dictionary; 1.20c2b's decrypt path will
        # introduce a separate slim `LakkoCoreExtension`
        # framework with just `parseEnvelope` +
        # `Group.processIncoming` carved out for the
        # 30 MB-memory extension process.

  # G3-4-mobile — iOS XCTest target hosted by the Lakko app.
  # Wired into the existing `Lakko` scheme below so
  # `xcodebuild test -scheme Lakko -only-testing:LakkoTests`
  # exercises the bundle on a booted simulator. Reads
  # `LAKKO_SFU_E2E_URL` from the test process environment so
  # the CI workflow `.github/workflows/g3-4-mobile.yml` can
  # point the simulator at the dockerised SFU on the host.
  LakkoTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: LakkoTests
    settings:
      base:
        SWIFT_VERSION: "5.10"
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
        PRODUCT_BUNDLE_IDENTIFIER: me.lakko.dev.LakkoTests
        GENERATE_INFOPLIST_FILE: YES
        # Host-app bundle loader so the test binary can resolve
        # symbols against the running Lakko.app on the
        # simulator (standard app-hosted XCTest pattern).
        BUNDLE_LOADER: "$(TEST_HOST)"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Lakko.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/Lakko"
    dependencies:
      - target: Lakko

# Local Swift Package: the LakkoCore wrapper from 1.14b.
# Relative path resolves from `apps/ios/` to the same
# directory. xcodegen forwards this to Xcode as a "local SPM
# dependency" which Xcode resolves at build time (it's the
# same shape Xcode's "File → Add Packages → Add Local…" wizard
# produces, just in YAML form).
packages:
  LakkoCore:
    path: "."
  # G3-1 — remote SPM: stasel/WebRTC. `from: 125.0.0` allows
  # SemVer-minor bumps inside the 125.x line (stasel uses one
  # major per upstream WebRTC milestone, so this stays inside
  # M125 specifically). Bumping the major (e.g. to M137) is
  # a deliberate decision that should land in its own PR with
  # the matching upstream-WebRTC changelog reviewed for
  # API-shape drift (the public C++ API breaks across
  # milestones surprisingly often).
  WebRTC:
    url: https://github.com/stasel/WebRTC.git
    from: 125.0.0

# Schemes — xcodegen auto-generates one per target, but we
# pin the explicit form so the build / archive / test actions
# are reproducible. Single scheme `Lakko` covers Debug +
# Release + the LakkoTests bundle (G3-4-mobile).
schemes:
  Lakko:
    build:
      targets:
        Lakko: all
        LakkoTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - LakkoTests
      # G3-4-mobile-call iter1 — pull `LAKKO_SFU_E2E_URL`
      # + `LAKKO_SFU_E2E_JWT` from the xcodebuild build-
      # setting environment into the test process via
      # `$(VAR)` interpolation. The workflow passes the
      # actual values on the xcodebuild command line as
      # `xcodebuild test ... LAKKO_SFU_E2E_JWT=<jwt>`;
      # the scheme then expands those into the test
      # runner's process environment. Without this
      # plumbing, `ProcessInfo.environment` in the
      # XCTest target cannot see what the parent shell
      # had.
      environmentVariables:
        - variable: LAKKO_SFU_E2E_URL
          value: "$(LAKKO_SFU_E2E_URL)"
          isEnabled: true
        - variable: LAKKO_SFU_E2E_JWT
          value: "$(LAKKO_SFU_E2E_JWT)"
          isEnabled: true
    archive:
      config: Release
