# Gradle version catalog — single source of truth for plugin
# and dependency versions across every Android module
# (Phase 1.15b). Bumping a version here propagates to every
# subproject that references it via `libs.plugins.<alias>` /
# `libs.<group>.<artifact>`.
#
# Pinned versions track the Android Studio Koala+ wave (AGP 8.5+).
# Kotlin 2.x is required for the Compose Compiler plugin to
# move out of AndroidX and into the official Kotlin plugin
# (lands in 1.15c when the actual Compose UI shows up).

[versions]
agp                = "8.6.1"
kotlin             = "2.0.21"
jna                = "5.14.0"          # UniFFI runtime — JNA-based bindings call into the cdylib
android-min-sdk    = "26"              # Android 8.0+ — covers ~97% of active devices as of 2026
android-target-sdk = "35"              # Android 15 — current Play Store target requirement
android-compile-sdk = "35"

# Phase 1.15c — Compose stack. Compose Compiler since Kotlin 2.0
# moves out of AndroidX into the Kotlin plugin
# `org.jetbrains.kotlin.plugin.compose` (pinned to the same
# Kotlin version above — no separate compiler-version dance).
# Runtime libraries come from the Compose BOM so one version
# pin governs every `androidx.compose.*` artefact.
compose-bom        = "2024.10.01"
activity-compose   = "1.9.3"
# Phase 1.15d4 — ViewModel + StateFlow integration with Compose.
# `androidx.lifecycle:lifecycle-viewmodel-compose` brings the
# `viewModel()` composable factory; `runtime-compose` adds the
# `collectAsStateWithLifecycle` extension so StateFlow can drive
# Compose recomposition with proper lifecycle awareness (no
# emissions to a backgrounded UI).
lifecycle          = "2.8.7"

# Phase 1.15d2 — networking + JSON for the OPAQUE auth client.
# Ktor 3.x is the modern Kotlin HTTP stack: suspending API,
# OkHttp engine on Android (production-grade HTTP/2 + connection
# pooling), pluggable engines mean tests can swap in `MockEngine`
# with zero refactor. kotlinx-serialization is the JSON layer
# Ktor pulls in via `content-negotiation`.
#
# Coroutines are required transitively but pinned explicitly so
# the version stays under our control — Ktor 3.0.x bundles
# kotlinx-coroutines 1.9.x; we follow.
ktor                  = "3.0.1"
kotlinx-serialization = "1.7.3"
kotlinx-coroutines    = "1.9.0"

# Phase 1.15d2 — unit-test stack. JUnit 4 stays the Android-idiomatic
# choice (works under the `testDebugUnitTest` task without an
# emulator); kotlinx-coroutines-test gives `runTest` for suspend
# functions; ktor `client-mock` engine drives `AuthClient` against
# fake responses without a network.
junit              = "4.13.2"

# Phase 1.20d — Firebase Messaging for the FCM client integration.
# Pinned to the 33.x BoM; bumping is a workspace concern because
# FCM's wire protocol is backward-compatible but the SDK surface
# (Firebase BoM coordinated set) bumps in lockstep with the GMS
# baseline. We do NOT use the `com.google.gms:google-services`
# Gradle plugin — that would require checking in a real
# `google-services.json` at build time. Instead Firebase is
# initialised programmatically via `FirebaseOptions` populated
# from BuildConfig env vars (see `apps/android/app/build.gradle.kts`).
firebase-bom          = "33.5.1"

# Phase 1.20d — `awaitToken` glue for Firebase's `Task<T>` API.
# `kotlinx-coroutines-play-services` ships the
# `Task<T>.await()` extension that converts Google Play
# Services' callback-based `Task` into a `suspend` shape.
# Pinned to the same kotlinx-coroutines major as the rest of
# the workspace.
kotlinx-coroutines-play-services-version = "1.9.0"

# Phase 1.20d — `EncryptedSharedPreferences` for the persisted
# device push pseudonym. Wraps a regular SharedPreferences in
# AES-256-GCM with a key stored in the Android Keystore. This
# mirrors the iOS `Keychain` posture: the value is at-rest-
# encrypted with hardware-backed keys; an attacker with raw
# disk access cannot read it without unlocking the device.
androidx-security-crypto = "1.1.0-alpha07"

[libraries]
jna = { group = "net.java.dev.jna", name = "jna", version.ref = "jna" }

# Compose stack — versions resolved through the BOM (use
# `composeBom` as a platform dep in the consumer module).
compose-bom         = { group = "androidx.compose", name = "compose-bom", version.ref = "compose-bom" }
compose-ui          = { group = "androidx.compose.ui", name = "ui" }
compose-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
compose-ui-tooling  = { group = "androidx.compose.ui", name = "ui-tooling" }
compose-material3   = { group = "androidx.compose.material3", name = "material3" }
activity-compose    = { group = "androidx.activity", name = "activity-compose", version.ref = "activity-compose" }

# Phase 1.15d4 — ViewModel <-> Compose glue. `viewmodel-compose`
# gives the `viewModel()` composable factory; `runtime-compose`
# gives `collectAsStateWithLifecycle` so a StateFlow can drive
# Compose recomposition with proper Lifecycle awareness.
lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycle" }
lifecycle-runtime-compose   = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose",   version.ref = "lifecycle" }

# Ktor — HTTP client. `core` is the public API; `okhttp` is the
# Android-side engine; `content-negotiation` is the plug for
# automatic JSON ser/deser; `serialization-kotlinx-json` is the
# actual ser/deser implementation. `client-mock` is test-only —
# drives the high-level signup/login flows against fake responses
# without the network.
ktor-client-core                  = { group = "io.ktor", name = "ktor-client-core",                  version.ref = "ktor" }
ktor-client-okhttp                = { group = "io.ktor", name = "ktor-client-okhttp",                version.ref = "ktor" }
ktor-client-content-negotiation   = { group = "io.ktor", name = "ktor-client-content-negotiation",   version.ref = "ktor" }
ktor-serialization-kotlinx-json   = { group = "io.ktor", name = "ktor-serialization-kotlinx-json",   version.ref = "ktor" }
ktor-client-mock                  = { group = "io.ktor", name = "ktor-client-mock",                  version.ref = "ktor" }

# kotlinx — coroutines + serialization.
kotlinx-coroutines-core        = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-core",        version.ref = "kotlinx-coroutines" }
kotlinx-coroutines-android     = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android",     version.ref = "kotlinx-coroutines" }
kotlinx-coroutines-test        = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-test",        version.ref = "kotlinx-coroutines" }
kotlinx-serialization-json     = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json",     version.ref = "kotlinx-serialization" }

# Test deps.
junit              = { group = "junit", name = "junit", version.ref = "junit" }

# Phase 1.20d — Firebase Messaging (FCM) via the Firebase BoM.
# The BoM coordinates every `com.google.firebase:firebase-*`
# artefact version; consumer just declares the BoM platform +
# `firebase-messaging` without a version (BoM resolves it).
firebase-bom              = { group = "com.google.firebase", name = "firebase-bom",       version.ref = "firebase-bom" }
firebase-messaging        = { group = "com.google.firebase", name = "firebase-messaging" }

# Phase 1.20d — Task<T>.await() extension for Google Play
# Services' Task-based async API (FirebaseMessaging.getToken()
# returns Task<String>).
kotlinx-coroutines-play-services = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-play-services", version.ref = "kotlinx-coroutines-play-services-version" }

# Phase 1.20d — EncryptedSharedPreferences (AES-256-GCM-wrapped
# SharedPreferences with the master key in the Android Keystore).
androidx-security-crypto  = { group = "androidx.security", name = "security-crypto", version.ref = "androidx-security-crypto" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library     = { id = "com.android.library", version.ref = "agp" }
kotlin-android      = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
# Compose Compiler is now a Kotlin plugin (Kotlin 2.0+). Versions
# track the host Kotlin version 1-for-1.
kotlin-compose      = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
# kotlinx-serialization compiler plugin — generates the `Serializer`
# implementations for `@Serializable` types. Version-locked to the
# host Kotlin (same convention as `kotlin-compose`).
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
