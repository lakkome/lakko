# Phase 1.15b — Gradle properties for the Android module.

# JVM args for Gradle workers. 4 GB heap fits an AGP 8.x build
# comfortably on a 16 GB dev machine; bump to 8 GB if Gradle
# starts OOMing on bigger Compose feature modules in 1.15c+.
# `UseG1GC` keeps p99 pauses low during incremental builds.
org.gradle.jvmargs=-Xmx4g -XX:+UseG1GC -Dfile.encoding=UTF-8

# Parallel project compilation. We have one module today; the
# flag becomes load-bearing once 1.15c lands the `app` module.
org.gradle.parallel=true

# Configuration cache — Gradle 8 stable. Dramatically speeds up
# repeat invocations of `assembleDebug` by caching the
# configuration phase.
org.gradle.configuration-cache=true

# AndroidX defaults — required by all modern Android libraries.
# Kotlin code style matches the JetBrains official style guide.
android.useAndroidX=true
kotlin.code.style=official

# Skip non-transitive R class generation — we don't have
# resources in lakko-core today, but the flag also speeds up
# incremental builds when resources DO show up.
android.nonTransitiveRClass=true
