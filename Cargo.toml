[workspace]
resolver = "2"
members = [
    "crates/lakko-core",
    "crates/lakko-crypto",
    "crates/lakko-mls",
    "crates/lakko-proto",
    "crates/lakko-transport",
    "crates/lakko-storage",
    "crates/lakko-sync",
    "crates/lakko-calls",
    "crates/lakko-channels",
    "crates/lakko-contacts",
    "crates/lakko-presence",
    "crates/lakko-push",
    "crates/lakko-transparency",
    "crates/lakko-attachments",
    "crates/lakko-backup",
    "crates/lakko-auth-client",
    "crates/lakko-auth-token",
    "crates/lakko-ds-proof",
    "crates/lakko-device-link",
    "crates/lakko-call-jwt",
    "crates/lakko-attest",
    "crates/lakko-sfu-proto",
    "crates/lakko-pow",
    "crates/lakko-pow-server",
    "crates/lakko-anon-token",
    "crates/lakko-anon-token-server",
    "crates/lakko-mnemonic",
    "crates/lakko-ui-rules",
    "crates/lakko-feed",
    "crates/lakko-l10n",
    "crates/lakko-discovery-client",
    "crates/lakko-tuf",
    "crates/lakko-ffi-uniffi",
    "crates/lakko-ffi-extension",
    "crates/lakko-ffi-wasm",
    "crates/lakko-sframe-native",
    "services/auth",
    "services/channels",
    "services/ds",
    "services/storage",
    "services/gif-proxy",
    "services/edge",
    "services/discovery",
    "services/obfs-proxy",
    "services/push-gw",
    "services/sfu",
    "services/transparency",
    "services/witness",
    "services/transport-rendezvous",
    "tools/release-manifest",
    "tools/l10n",
]
# Fuzz crates require nightly + libfuzzer-sys; they opt out of this
# workspace via their own `[workspace]` block and are listed here only so
# `cargo` does not accidentally absorb them.
exclude = [
    "crates/lakko-mls/fuzz",
    "crates/lakko-proto/fuzz",
    # Vendored fork of webauthn-rs-core (ADR-0014) — consumed via
    # `[patch.crates-io]` below, not as a workspace member. Upstream
    # MPL-2.0 third-party code (carries `unsafe`, its own deps), so it
    # sits outside our workspace lint / forbid-unsafe posture.
    "crates/vendor/webauthn-rs-core",
    # Vendored fork of hpke-rs-libcrux (G-23) — Cargo.toml-only delta
    # bumping libcrux-aead 0.0.7 -> 0.0.8 + libcrux-traits 0.0.6 -> 0.0.7
    # to pull the RUSTSEC-2026-0124 fix; consumed via `[patch.crates-io]`.
    "crates/vendor/hpke-rs-libcrux",
    # Vendored SHIM (G-25) re-exporting web-time in place of fluvio-wasm-timer
    # to drop the unmaintained `instant` (RUSTSEC-2024-0384); consumed via
    # `[patch.crates-io]` below, not a workspace member.
    "crates/vendor/fluvio-wasm-timer",
    # Vendored fork of str0m 0.19.0 carrying ONE additive change: the
    # packetizer tells an `ExtensionSerializer` which packet of the frame it
    # is writing (`ExtensionValues::frame_position`). Needed so the SFU can
    # relay the RFC-less generic frame descriptor, whose first/last-packet
    # bits differ per packet. Upstream MIT/Apache-2.0 third-party code with
    # its own deps, so it sits outside our workspace lint / forbid-unsafe
    # posture; consumed via `[patch.crates-io]` below.
    "crates/vendor/str0m",
]

[workspace.package]
version = "0.0.0"
edition = "2021"
rust-version = "1.79"
license = "AGPL-3.0-or-later"
authors = ["Lakko Contributors"]
repository = "https://github.com/lakkome/lakko"
homepage = "https://github.com/lakkome/lakko"
publish = false

[workspace.dependencies]
# Error handling
thiserror = "1"
anyhow = "1"

# Async runtime
tokio = { version = "1", features = ["full"] }
futures = "0.3"

# Tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# SMTP client for the one letter `services/auth` sends (ADR-0075 recovery
# email code). Minimal features: the SMTP transport and the message builder
# over tokio with rustls (ring provider, bundled web PKI roots). Default
# features are off so native-tls, the connection pool and `hostname` stay out.
lettre = { version = "0.11", default-features = false, features = [
    "smtp-transport",
    "builder",
    "tokio1-rustls",
    "ring",
    "webpki-roots",
] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# CLDR plural categories for lakko-l10n (ADR-0061).
icu_plurals = "2"
icu_locale_core = "2"
# `sync`: ICU4X data held in `Arc`, not `Rc`, so a catalog can cross the
# UniFFI boundary (which requires `Send + Sync`).
icu_provider = { version = "2", features = ["sync"] }

# Internal crates — path + version (cargo-deny rejects wildcard-only deps).
# The version is kept in lockstep with workspace.package.version so they
# move atomically.
lakko-core = { path = "crates/lakko-core", version = "0.0.0" }
lakko-crypto = { path = "crates/lakko-crypto", version = "0.0.0" }
lakko-mls = { path = "crates/lakko-mls", version = "0.0.0" }
lakko-proto = { path = "crates/lakko-proto", version = "0.0.0" }
lakko-transport = { path = "crates/lakko-transport", version = "0.0.0" }
lakko-storage = { path = "crates/lakko-storage", version = "0.0.0" }
lakko-sync = { path = "crates/lakko-sync", version = "0.0.0" }
lakko-calls = { path = "crates/lakko-calls", version = "0.0.0" }
lakko-channels = { path = "crates/lakko-channels", version = "0.0.0" }
lakko-contacts = { path = "crates/lakko-contacts", version = "0.0.0" }
lakko-presence = { path = "crates/lakko-presence", version = "0.0.0" }
lakko-push = { path = "crates/lakko-push", version = "0.0.0" }
lakko-transparency = { path = "crates/lakko-transparency", version = "0.0.0" }
lakko-attachments = { path = "crates/lakko-attachments", version = "0.0.0" }
lakko-backup = { path = "crates/lakko-backup", version = "0.0.0" }
lakko-auth-client = { path = "crates/lakko-auth-client", version = "0.0.0" }
lakko-auth-token = { path = "crates/lakko-auth-token", version = "0.0.0" }
lakko-ds-proof = { path = "crates/lakko-ds-proof", version = "0.0.0" }
lakko-device-link = { path = "crates/lakko-device-link", version = "0.0.0" }
lakko-call-jwt = { path = "crates/lakko-call-jwt", version = "0.0.0" }
lakko-attest = { path = "crates/lakko-attest", version = "0.0.0" }
lakko-sfu-proto = { path = "crates/lakko-sfu-proto", version = "0.0.0" }
lakko-pow = { path = "crates/lakko-pow", version = "0.0.0" }
lakko-pow-server = { path = "crates/lakko-pow-server", version = "0.0.0" }
lakko-anon-token = { path = "crates/lakko-anon-token", version = "0.0.0" }
lakko-anon-token-server = { path = "crates/lakko-anon-token-server", version = "0.0.0" }
lakko-mnemonic = { path = "crates/lakko-mnemonic", version = "0.0.0" }
lakko-ui-rules = { path = "crates/lakko-ui-rules", version = "0.0.0" }
lakko-feed = { path = "crates/lakko-feed", version = "0.0.0" }
lakko-l10n = { path = "crates/lakko-l10n", version = "0.0.0" }
lakko-discovery-client = { path = "crates/lakko-discovery-client", version = "0.0.0" }

[workspace.lints.rust]
unsafe_code = "deny"
unreachable_pub = "warn"
trivial_casts = "warn"
trivial_numeric_casts = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# Too pedantic — silenced workspace-wide.
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
needless_pass_by_value = "allow"
# `doc_markdown` would require backticks around every CamelCase / acronym
# (MLS, OPRF, FIPS, BIP39, FoundationDB, …) — too noisy for a security-
# domain codebase that names dozens of standards in every doc-comment.
doc_markdown = "allow"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "debuginfo"
panic = "abort"
overflow-checks = true

[profile.release-with-debug]
inherits = "release"
strip = "none"
debug = true

[profile.dev]
opt-level = 0
debug = true
overflow-checks = true

# tls_codec 0.4.2 guards its QUIC-varint parser with `debug_assert!`s that
# fire BEFORE the graceful `Err(InvalidVectorLength)` returns right below
# them (`src/quic_vec.rs`) — so attacker-shaped input (e.g. a corrupted
# KeyPackage length byte) PANICS in dev/test builds while release builds
# (debug-assertions off) and fuzz builds (`cfg(fuzzing)` carve-out upstream)
# take the graceful error path. Disable debug assertions for this one
# dependency so tests exercise exactly the production behaviour — pinned by
# `lakko-calls::link_invite::tests::accept_invite_with_corrupted_kp_rejects`.
# Every cfg(debug_assertions) branch in the crate is a self-check followed by
# a graceful return (audited 0.4.2); nothing semantic changes.
[profile.dev.package.tls_codec]
debug-assertions = false

# ADR-0014 — WebAuthn action binding. Replace the upstream
# `webauthn-rs-core` with our vendored fork under `crates/vendor/`, which
# adds exactly one method (`generate_challenge_authenticate_with_challenge`)
# for RP-controlled action-bound challenges. The verification path is
# upstream-verbatim. The high-level `webauthn-rs` crate transparently picks
# up the patched core.
[patch.crates-io]
webauthn-rs-core = { path = "crates/vendor/webauthn-rs-core" }

# G-23 — RUSTSEC-2026-0124 (libcrux-chacha20poly1305 0.0.7 overlong-buffer
# panic, HIGH 8.2). Replace upstream `hpke-rs-libcrux` 0.6.1 with a
# Cargo.toml-only vendored fork that bumps `libcrux-aead` 0.0.7 -> 0.0.8
# (which pulls the fixed `libcrux-chacha20poly1305 0.0.8`) and its own
# `libcrux-traits` 0.0.6 -> 0.0.7 to match the AEAD trait the new aead
# impls. No source changes — hpke-rs-libcrux only uses libcrux-traits for
# the AEAD trait, so ecdh / hkdf staying on libcrux-traits 0.0.6 is fine.
hpke-rs-libcrux = { path = "crates/vendor/hpke-rs-libcrux" }

# G-25 — RUSTSEC-2024-0384 (`instant` 0.1, unmaintained). The only consumer of
# `fluvio-wasm-timer` in our graph is openmls 0.8.1, which uses just its
# `SystemTime` + `UNIX_EPOCH` on wasm. Replace it with a shim re-exporting the
# maintained `web-time`, so `instant` (which the real crate pulls via
# parking_lot 0.11) leaves the graph entirely. No openmls source change; remove
# when openmls 0.9 moves off fluvio-wasm-timer itself.
fluvio-wasm-timer = { path = "crates/vendor/fluvio-wasm-timer" }

# Generic-frame-descriptor relay. A libwebrtc receiver reads the key-frame
# flag and picture size out of the codec bitstream, which SFrame has replaced
# with ciphertext, so the only way it can recognise a key frame is the
# `generic-frame-descriptor-00` RTP header extension. Relaying that extension
# needs a per-packet value: its `B` / `E` bits mark the first and last packet
# of a frame, so the frame-level value cannot simply be copied onto every
# packet of a re-packetized frame.
#
# Upstream str0m's `ExtensionSerializer::write_to` is not told which packet of
# the frame it is writing, so this is impossible to express. The vendored fork
# adds exactly that: an `ExtensionValues::frame_position` field, set by the
# packetizer in `packet/payload.rs` right where it already strips other
# per-packet fields. Two source files, additive only; no behaviour changes for
# any existing serializer, since they all ignore the new field.
#
# `services/sfu/tests/fork_delta_guard.rs` pins both files so an accidental
# edit fails CI. Drop this patch if the capability lands upstream.
str0m = { path = "crates/vendor/str0m" }
