version = 1

SPDX-PackageName = "Lakko"
SPDX-PackageSupplier = "Lakko Contributors <noreply@lakko.app>"
SPDX-PackageDownloadLocation = "https://github.com/lakkome/lakko"

# Default for files that cannot carry an SPDX header (binary fixtures,
# generated code, JSON, lockfiles). Files that DO carry a header take
# precedence over this fallback.
[[annotations]]
path = "**"
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Lakko Contributors"
SPDX-License-Identifier = "AGPL-3.0-or-later"

# Vendored upstream third-party crate (ADR-0014). It keeps its own
# MPL-2.0 license — the AGPL `**` fallback above must NOT relicense it.
# `precedence = "override"` makes this win over the aggregate default.
# The single Lakko addition
# (`generate_challenge_authenticate_with_challenge` in core.rs) is a
# derivative of the surrounding MPL-2.0 file and stays MPL-2.0.
[[annotations]]
path = "crates/vendor/webauthn-rs-core/**"
precedence = "override"
SPDX-FileCopyrightText = "The webauthn-rs Authors (https://github.com/kanidm/webauthn-rs)"
SPDX-License-Identifier = "MPL-2.0"

# Vendored upstream third-party crate (G-23). MPL-2.0 — the AGPL `**`
# fallback must NOT relicense it. The Lakko delta is Cargo.toml-only
# (bump libcrux-aead 0.0.7 -> 0.0.8 + libcrux-traits 0.0.6 -> 0.0.7 to
# pull the RUSTSEC-2026-0124 fix); `src/` is byte-identical to upstream
# hpke-rs-libcrux 0.6.1.
[[annotations]]
path = "crates/vendor/hpke-rs-libcrux/**"
precedence = "override"
SPDX-FileCopyrightText = "The hpke-rs Authors (https://github.com/cryspen/hpke-rs)"
SPDX-License-Identifier = "MPL-2.0"

# Vendored upstream third-party crate. str0m 0.19.0 with one additive
# capability: the packetizer tells an `ExtensionSerializer` which packet of
# the frame it is writing, without which the SFU cannot relay the generic
# frame descriptor. It keeps its own MIT-or-Apache-2.0 licence — the AGPL
# `**` fallback must NOT relicense it — and the Lakko delta is a derivative
# of the surrounding files, so it carries the same terms. The delta is
# frozen by `services/sfu/tests/fork_delta_guard.rs`.
[[annotations]]
path = "crates/vendor/str0m/**"
precedence = "override"
SPDX-FileCopyrightText = "The str0m Authors (https://github.com/algesten/str0m)"
SPDX-License-Identifier = "MIT OR Apache-2.0"

# ADR-0047 §3 — the web emoji picker's bundled data, generated by
# `apps/web/scripts/gen-emoji-data.mjs` from two pinned, SHA-256-checked
# Unicode sources: Emoji 15.1 `emoji-test.txt` and the CLDR 45 English
# annotations. Both are Unicode License v3 and the generated JSON is a
# derivative of them, so the AGPL `**` fallback must NOT relicense it.
[[annotations]]
path = "apps/web/src/media/emoji/emoji-data.json"
precedence = "override"
SPDX-FileCopyrightText = "1991-2023 Unicode, Inc."
SPDX-License-Identifier = "Unicode-3.0"

# The iOS client bundles a byte-identical copy of the same generated file as an
# app resource (ADR-0047 §3: emoji data ships with the app, never fetched).
[[annotations]]
path = "apps/ios/Lakko/Resources/Emoji/emoji-data.json"
precedence = "override"
SPDX-FileCopyrightText = "1991-2023 Unicode, Inc."
SPDX-License-Identifier = "Unicode-3.0"
