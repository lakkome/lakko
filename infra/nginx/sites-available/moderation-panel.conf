#
# nginx vhost for the moderators' panel (ADR-0099 step 5, UX
# `reporting-and-moderation.md` section 5). NOT enabled by default: copy it
# to /etc/nginx/sites-available/ and link it into sites-enabled/ only on the
# host that should serve the panel, once the moderator client CA exists.
#
# The panel's API is the moderation service's third listener
# (LAKKO_MODERATION_PANEL_BIND, default 127.0.0.1:8099), proxied at
# /panel/api/ only. The built `apps/moderation` app is served by nginx itself
# from its own static root, /var/www/lakko-moderation-panel (installed by
# `just deploy-moderation-panel`), so the code a moderator's browser runs,
# which drives the security key, never comes from the moderation service: a
# compromise of that process cannot change it (ADR-0099 F4). A production
# moderation unit leaves LAKKO_MODERATION_PANEL_DIR unset; that variable is
# for local development only. The panel is never reachable from the
# product's own hostnames.
#
# Residual: a security key's touch shows the moderator nothing of what is
# signed; the panel app shows it, so the app's integrity is what this
# separation protects.
#
# Two gates, in this order:
#   1. A client certificate signed by the moderator client CA, required for
#      the WHOLE server (`ssl_verify_client on` at server level, so the TLS
#      handshake itself fails without one; no request, not even for the app's
#      files, reaches the service). Only moderators' browsers hold such a
#      certificate.
#   2. Inside, a moderator signs in with their security key (WebAuthn,
#      checked by the service against the root-signed moderator list) and
#      touches it again for every decision.
#
# The RP id and origin of the moderator list must name this host
# (`moderation.lakko.me`, `https://moderation.lakko.me`): a security key's
# assertion is bound to the origin the browser is on, and the service refuses
# any other.
#
# Note: sfu.conf and turn.conf gate /metrics with `ssl_verify_client`
# inside a location; nginx accepts that directive only in http and server
# context, so that form may not load. Not fixed here; this file uses the
# server-level form.
#
# Test stack: the stack runs on one host behind the same nginx. To try the
# panel there, issue a client CA and a client certificate by hand
# (openssl), put the CA at the path below, give this server a test hostname
# with its own certificate, and install `apps/moderation/dist` into the
# static root below. The moderator list for the test stack is
# made with `tools/moderation-root dev-moderator`; its RP id and origin must
# be that test hostname.

upstream lakko_moderation_panel {
    server 127.0.0.1:8099;
    keepalive 4;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name moderation.lakko.me;

    # No request log: the paths carry report receipts and targets.
    access_log off;
    error_log  /var/log/nginx/error.log crit;

    ssl_certificate     /etc/letsencrypt/live/moderation.lakko.me/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/moderation.lakko.me/privkey.pem;

    ssl_protocols         TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout   1d;
    ssl_session_cache     shared:lakko_moderation_ssl:10m;
    ssl_session_tickets   off;

    # Gate 1: the moderator client CA, for the whole server.
    ssl_client_certificate /etc/nginx/lakko-moderator-ca.pem;
    ssl_verify_client      on;
    ssl_verify_depth       2;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    # The app is self-contained; the wasm core needs 'wasm-unsafe-eval';
    # decrypted evidence previews are blob: URLs.
    add_header Content-Security-Policy
        "default-src 'self'; \
         script-src 'self' 'wasm-unsafe-eval'; \
         style-src 'self' 'unsafe-inline'; \
         img-src 'self' data: blob:; \
         media-src 'self' blob:; \
         font-src 'self'; \
         connect-src 'self'; \
         worker-src 'self'; \
         frame-ancestors 'none'; \
         base-uri 'self'; \
         form-action 'self'; \
         object-src 'none'"
        always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    client_max_body_size 64k;

    # The app: static files only, never proxied. Any path that is not a
    # file gives index.html, so the app's own routes (/case/..., deep links)
    # load. The app's routes must not start with /panel/api/.
    root /var/www/lakko-moderation-panel;
    # No location-level add_header here, so the server's security headers
    # (CSP included) apply to every file.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # The API: the only thing proxied to the moderation service.
    location /panel/api/ {
        proxy_pass         http://lakko_moderation_panel;
        proxy_http_version 1.1;
        proxy_set_header   Connection "";
        proxy_set_header   Host       $host;
        # Evidence blobs are up to 50 MiB and storage may take 60 s.
        proxy_read_timeout 90s;
        proxy_hide_header  Server;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name moderation.lakko.me;
    access_log off;
    return 301 https://$host$request_uri;
}
