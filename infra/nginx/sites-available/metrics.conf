# The metrics server block of the main VPS (ADR-0096 section 7, P3).
#
# Every Lakko service and every host exporter listens on 127.0.0.1 only.
# This one server block is the only way in: metrics.lakko.me:9643, one path
# per target, every request must present a client certificate signed by the
# monitoring CA (/etc/lakko/mtls/monitoring-ca.crt), which only the
# monitoring VPS holds. The firewall additionally admits port 9643 from the
# monitoring VPS's address alone (infra/scripts/setup-metrics.sh).
#
#   /<service>/metrics   the service's LAKKO_<SVC>_METRICS_BIND listener
#   /sfu/metrics         LAKKO_SFU_METRICS_BIND (it moved here from
#                        sfu.lakko.me/metrics)
#   /node/metrics        node_exporter (127.0.0.1:9100)
#   /mysqld/metrics      mysqld_exporter (127.0.0.1:9104)
#   /nginx/metrics       nginx-prometheus-exporter (127.0.0.1:9113), which
#                        reads the stub_status server at the end of this file
#
# A target whose process is not running answers 502, and Prometheus marks
# it down. transparency, witness and obfs-proxy have locations here although
# they are not deployed yet; their scrape targets are added when they are.
#
# No access log: a metrics scrape carries nothing about a person, but the
# rule on the Lakko hosts is that nginx keeps no access log at all.

server {
    # `listen ... http2` rather than `http2 on`, which needs nginx 1.25.1; the
    # other Lakko vhosts use the same form.
    listen 9643 ssl http2;
    listen [::]:9643 ssl http2;
    server_name metrics.lakko.me;

    access_log off;
    error_log  /var/log/nginx/error.log crit;

    ssl_certificate     /etc/letsencrypt/live/metrics.lakko.me/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/metrics.lakko.me/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache   shared:lakko_metrics_ssl:1m;
    ssl_session_tickets off;

    # The whole server block (nginx accepts ssl_verify_client nowhere else):
    # a request without a client certificate signed by the monitoring CA is
    # answered 400 by nginx itself and never reaches a target. Checked
    # 2026-11-20 against nginx 1.24 in a container: no certificate 400, a
    # certificate from another CA 400, the monitoring certificate passes.
    ssl_verify_client      on;
    ssl_verify_depth       1;
    ssl_client_certificate /etc/lakko/mtls/monitoring-ca.crt;

    proxy_http_version 1.1;
    proxy_set_header   Host $host;
    proxy_set_header   Connection "";
    proxy_read_timeout 10s;
    proxy_send_timeout 10s;
    proxy_hide_header  Server;
    default_type       text/plain;

    location = /auth/metrics         { proxy_pass http://127.0.0.1:9651/metrics; }
    location = /ds/metrics           { proxy_pass http://127.0.0.1:9652/metrics; }
    location = /discovery/metrics    { proxy_pass http://127.0.0.1:9653/metrics; }
    location = /storage/metrics      { proxy_pass http://127.0.0.1:9654/metrics; }
    location = /push-gw/metrics      { proxy_pass http://127.0.0.1:9655/metrics; }
    location = /channels/metrics     { proxy_pass http://127.0.0.1:9656/metrics; }
    location = /transparency/metrics { proxy_pass http://127.0.0.1:9657/metrics; }
    location = /witness/metrics      { proxy_pass http://127.0.0.1:9658/metrics; }
    location = /gif-proxy/metrics    { proxy_pass http://127.0.0.1:9659/metrics; }
    location = /obfs-proxy/metrics   { proxy_pass http://127.0.0.1:9660/metrics; }
    location = /sfu/metrics          { proxy_pass http://127.0.0.1:9641/metrics; }

    location = /node/metrics         { proxy_pass http://127.0.0.1:9100/metrics; }
    location = /mysqld/metrics       { proxy_pass http://127.0.0.1:9104/metrics; }
    location = /nginx/metrics        { proxy_pass http://127.0.0.1:9113/metrics; }

    location / {
        return 404 "not found\n";
    }
}

# nginx's own counters for nginx-prometheus-exporter. Loopback only.
server {
    listen 127.0.0.1:8090;
    server_name _;
    access_log off;

    location = /stub_status {
        stub_status;
        allow 127.0.0.1;
        deny all;
    }

    location / {
        return 404;
    }
}
