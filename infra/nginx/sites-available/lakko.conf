# Reverse proxy for the existing lakko.me / api.lakko.me domains.
# (edge.lakko.me is served by the system coturn — Phase 3.)
#
# Install on the VPS:
#   sudo cp infra/nginx/sites-available/lakko.conf /etc/nginx/sites-available/
#   sudo cp infra/nginx/sites-available/lakko-proxy-headers.inc /etc/nginx/sites-available/
#   sudo ln -sf /etc/nginx/sites-available/lakko.conf /etc/nginx/sites-enabled/lakko.conf
#   sudo nginx -t && sudo systemctl reload nginx
#
# TLS certificates — reused from the existing lakko_me deploy:
#   /etc/letsencrypt/live/lakko.me/{fullchain,privkey}.pem
#   /etc/letsencrypt/live/api.lakko.me/{fullchain,privkey}.pem

# ---- Upstreams (Lakko services listen on localhost) ----------------------
upstream lakko_auth      { server 127.0.0.1:8081; }
upstream lakko_ds        { server 127.0.0.1:8082; }
upstream lakko_storage   { server 127.0.0.1:8083; }
upstream lakko_discovery { server 127.0.0.1:8084; }
upstream lakko_push_gw   { server 127.0.0.1:8085; }
upstream lakko_channels  { server 127.0.0.1:8086; }
upstream lakko_gif_proxy { server 127.0.0.1:8091; }

# ADR-0060: the DS reach check is anonymous (the proof is the gate) and
# answers whether a key is registered, so it is rate-limited per address here,
# the layer the DS relies on for its anonymous routes. Rate and burst chosen,
# not measured: a search checks at most 20 results.
limit_req_zone $binary_remote_addr zone=lakko_ds_reach_check:10m rate=5r/s;

# ---- HTTP — ACME challenge + redirect ------------------------------------
server {
    listen      80;
    listen      [::]:80;
    server_name lakko.me api.lakko.me;
    # Invariant #5: no request log. An access log line (client address,
    # time, path and query) is enough to rebuild who talks to whom: journal,
    # mailbox, account and blob ids sit in the paths, call tokens in the
    # query. Error logs stay at crit, because an error line carries the
    # client address and the request too. Services log without request ids.
    access_log off;
    error_log  /var/log/nginx/error.log crit;

    # Let's Encrypt webroot challenge — the path must match the certbot config.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        allow all;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ---- HTTPS — lakko.me — web client (Phase 1.17c) -------------------------
server {
    listen              443 ssl;
    listen              [::]:443 ssl;
    http2               on;
    server_name         lakko.me;
    # Invariant #5: no request log. An access log line (client address,
    # time, path and query) is enough to rebuild who talks to whom: journal,
    # mailbox, account and blob ids sit in the paths, call tokens in the
    # query. Error logs stay at crit, because an error line carries the
    # client address and the request too. Services log without request ids.
    access_log off;
    error_log  /var/log/nginx/error.log crit;

    ssl_certificate     /etc/letsencrypt/live/lakko.me/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/lakko.me/privkey.pem;
    ssl_protocols       TLSv1.3;
    ssl_ciphers         TLS_AES_256_GCM_SHA384:TLS_CHACHA20_POLY1305_SHA256;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    # ---- Security headers (Phase 1.17a/c) ----------------------------------
    # Source of truth for the directives a `<meta>` tag cannot
    # carry (`frame-ancestors`, HSTS, COOP/CORP, Permissions-
    # Policy). Keep `script-src` / `style-src` / `connect-src` /
    # `worker-src` etc. in lock-step with
    # `apps/web/scripts/post-build.mjs::CSP`.
    #
    # `connect-src` names the cross-origin endpoints the production bundle
    # dials. `wss://sfu.lakko.me` MUST equal the origin of the
    # `VITE_LAKKO_SFU_URL` the production web build was made with (the SFU
    # vhost is `sfu.conf`); without it every group call fails at the
    # WebSocket open. The post-build script derives the meta copy from that
    # env var and warns when an origin it derived is missing here. When the
    # build also sets `VITE_LAKKO_TRANSPARENCY_URL`, add that origin too.
    #
    # `img-src` / `media-src` carry `blob:` for decrypted attachment previews
    # (`URL.createObjectURL`), which `'self'` does not match.
    add_header Content-Security-Policy
        "default-src 'self'; \
         script-src 'self' 'wasm-unsafe-eval'; \
         style-src 'self' 'unsafe-inline'; \
         img-src 'self' data: blob:; \
         media-src 'self' blob:; \
         font-src 'self'; \
         connect-src 'self' wss://sfu.lakko.me; \
         worker-src 'self'; \
         manifest-src 'self'; \
         frame-ancestors 'none'; \
         base-uri 'self'; \
         form-action 'self'; \
         object-src 'none'"
        always;

    # 1 year HSTS — bump to 2y + preload after a quarter of clean
    # renewal runs, then submit hstspreload.org.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Belt-and-suspenders for middleboxes that strip CSP:
    add_header X-Frame-Options              "DENY"        always;
    add_header X-Content-Type-Options       "nosniff"     always;
    add_header Referrer-Policy              "no-referrer" always;
    add_header Cross-Origin-Opener-Policy   "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    # COEP `unsafe-none` until 1.18+ tells us we want SAB / SIMD —
    # `require-corp` would force every cross-origin sub-resource
    # to opt in via CORP, which we don't have today.
    add_header Cross-Origin-Embedder-Policy "unsafe-none" always;

    # Lock down sensors / DOM features we don't use. Calls DO use the
    # microphone, the camera and media autoplay (remote call audio / video
    # plays without a click), so those three are allowed for this origin
    # only: `=()` there blocked `getUserMedia` outright on the deployed site.
    add_header Permissions-Policy
        "accelerometer=(), \
         ambient-light-sensor=(), \
         autoplay=(self), \
         battery=(), \
         camera=(self), \
         display-capture=(), \
         fullscreen=(), \
         geolocation=(), \
         gyroscope=(), \
         magnetometer=(), \
         microphone=(self), \
         midi=(), \
         payment=(), \
         picture-in-picture=(), \
         publickey-credentials-get=(self), \
         screen-wake-lock=(), \
         usb=(), \
         xr-spatial-tracking=()" always;

    # ---- Web client root ---------------------------------------------------
    root /var/www/lakko-web;
    index index.html;

    location = /health {
        access_log off;
        return    200 "lakko.me ok\n";
        add_header Content-Type text/plain;
    }

    # Hashed assets are content-addressed — cache forever.
    location /assets/ {
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # Service worker MUST NOT be cached past the SW update cycle:
    # browsers re-fetch sw.js on every navigation, but if an
    # intermediate caches it stale we get a deploy-stuck app.
    location = /sw.js {
        access_log off;
        add_header Cache-Control "no-store" always;
        try_files $uri =404;
    }

    # Manifest, robots, favicon — short cache.
    location ~* ^/(manifest\.webmanifest|robots\.txt|favicon\.ico)$ {
        access_log off;
        add_header Cache-Control "public, max-age=3600" always;
        try_files $uri =404;
    }

    # App-link association files, served from the web root the SPA build
    # ships them in. Apple fetches the extension-less file and expects JSON;
    # Android fetches assetlinks.json. Short cache so a re-deploy takes effect
    # within minutes.
    location ~ ^/\.well-known/(apple-app-site-association|assetlinks\.json)$ {
        access_log off;
        default_type application/json;
        add_header Cache-Control "public, max-age=300" always;
        try_files $uri =404;
    }

    # ---- ADR-0061 signed translation bundle --------------------------------
    # Every interface language in one Ed25519-signed blob, signed OFFLINE by
    # tools/l10n (`just sign-translations`) and verified by the native clients
    # against a pinned publisher key (LakkoTranslationKey /
    # LAKKO_TRANSLATION_KEY). One file for every language, so the request does
    # not reveal the device's language. Same separate-root pattern as the
    # release manifest below (`just deploy-web` rsyncs the SPA with --delete).
    # Absent file -> 404 -> clients keep their built-in translations.
    location = /.well-known/lakko-translations {
        alias      /var/www/lakko-release/lakko-translations.bin;
        default_type application/octet-stream;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
        access_log off;
    }

    # ---- ADR-0038 signed release manifest ----------------------------------
    # The "update available" notice: a raw 89-byte Ed25519-signed blob minted
    # OFFLINE by tools/release-manifest and client-verified against a pinned
    # publisher key (VITE_LAKKO_RELEASE_KEY / LakkoReleaseKey /
    # LAKKO_RELEASE_KEY). Served from a SEPARATE root, /var/www/lakko-release/,
    # NOT the web SPA root: `just deploy-web` rsyncs the SPA with `--delete`
    # and would otherwise wipe the manifest on the next web deploy. `no-store`
    # so a new manifest propagates on the next fetch (the signature is what's
    # trusted, not the cache freshness; the client applies its own staleness
    # window). Absent file -> 404 -> clients render no notice (fail-open).
    # Publish: mint the blob, `scp` it to the alias target below — served
    # immediately, no reload. Clients pin the path `/.well-known/lakko-release`
    # (S4/S5 MUST pin the SAME path). See infra/README.md.
    location = /.well-known/lakko-release {
        alias      /var/www/lakko-release/lakko-release.bin;
        default_type application/octet-stream;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
        access_log off;
    }

    # ---- Same-origin /api/* proxy ------------------------------------------
    # Mirrors the Vite dev proxy in `apps/web/vite.config.ts` so
    # the JS layer's relative URLs work in both environments. The
    # canonical external entry point stays `api.lakko.me` (server
    # block below) — these duplicate paths exist purely to keep
    # the web client's CSP `connect-src 'self'` directive valid.
    location /api/auth/ {
        proxy_pass http://lakko_auth/;
        include    /etc/nginx/sites-available/lakko-proxy-headers.inc;
    }
    location ~ "^/api/ds/(ds/mailbox/[0-9a-f]{64}/reach/check)$" {
        limit_req zone=lakko_ds_reach_check burst=40 nodelay;
        limit_req_status 429;
        proxy_pass http://lakko_ds/$1;
        include    /etc/nginx/sites-available/lakko-proxy-headers.inc;
    }
    location /api/ds/ {
        proxy_pass http://lakko_ds/;
        include    /etc/nginx/sites-available/lakko-proxy-headers.inc;
        # DS uses long-poll / streaming — bumped timeouts.
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }
    location /api/discovery/ {
        proxy_pass http://lakko_discovery/;
        include    /etc/nginx/sites-available/lakko-proxy-headers.inc;
    }
    # 1.19c1 — content-addressable blob storage. The body is
    # raw ciphertext (`application/octet-stream`) and per-blob
    # ceiling is 50 MB; bump `client_max_body_size` so nginx
    # doesn't 413 before the storage service gets a chance.
    location /api/storage/ {
        proxy_pass http://lakko_storage/;
        include    /etc/nginx/sites-available/lakko-proxy-headers.inc;
        client_max_body_size 50M;
        # GETs stream large blobs back — bump the read timeout
        # to match the DS long-poll generous shape (storage is
        # not actually slow, but a slow client over a slow
        # connection shouldn't get killed mid-download).
        proxy_read_timeout 600s;
    }
    # 1.20b — Web Push registration (`/push/register` and the group
    # subscribe routes, each spending an anonymous token since ADR-0054
    # S3); no long-poll, default timeouts are fine.
    location /api/push/ {
        proxy_pass http://lakko_push_gw/;
        include    /etc/nginx/sites-available/lakko-proxy-headers.inc;
    }
    # ADR-0054 - no public route wakes a device. push-gw no longer serves
    # these on its public listener (the wake is the DS's forward to push-gw's
    # internal listener on 127.0.0.1:8092, which nginx never proxies); the
    # exact matches below keep them unrouted even if that ever regressed.
    location = /api/push/push/notify       { return 404; }
    location = /api/push/push/notify-group { return 404; }

    # Phase 4 — channel-broadcast backend. POST /posts carries
    # opaque ChannelPost bytes (per-post cap is 17 MiB
    # plaintext, ~17 MiB on the wire); bump `client_max_body_size`
    # so nginx doesn't 413 a legitimately-sized post.
    # POST /subscribers/:pk/envelope is a fixed 80 bytes —
    # the same limit covers it trivially.
    location /api/channels/ {
        proxy_pass http://lakko_channels/;
        include    /etc/nginx/sites-available/lakko-proxy-headers.inc;
        client_max_body_size 20M;
    }

    # ADR-0059 section 5 - directory search: the query rides the query
    # string, and the service never logs it; neither does nginx.
    location = /api/channels/v1/directory/search {
        access_log off;
        proxy_pass http://lakko_channels/v1/directory/search;
        include    /etc/nginx/sites-available/lakko-proxy-headers.inc;
    }

    # ADR-0047 §4 — GIF search + media proxy. Same prefix-strip convention as
    # the routes above: `/api/gifs/<service path>` reaches the service as
    # `<service path>`, and the service's own paths start with `/gifs/`, so the
    # web client calls `/api/gifs/gifs/search?q=...` and loads
    # `/api/gifs` + the item's `preview_url`. Previews therefore stay
    # same-origin and `img-src 'self'` needs no third-party host.
    #
    # No logging here: the query string is the user's GIF search, which
    # ADR-0047 keeps out of every log. The access log would record it in
    # `$request`, and nginx error lines quote the request line too. The
    # service logs route template, status and latency itself.
    location /api/gifs/ {
        proxy_pass http://lakko_gif_proxy/;
        include    /etc/nginx/sites-available/lakko-proxy-headers.inc;
        access_log off;
        error_log  /dev/null;
    }

    # SPA fallback — every unrouted GET serves the app shell so
    # client-side routing (/chat/:id, /contacts, …) works on a
    # full reload.
    # The page itself is revalidated on every load, so a deploy is picked up
    # on the next reload and never served from a stale browser cache. The
    # hashed files under /assets/ stay immutable.
    location = /index.html {
        add_header Cache-Control "no-cache" always;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}

# ---- HTTPS — api.lakko.me — backend reverse proxy ------------------------
server {
    listen              443 ssl;
    listen              [::]:443 ssl;
    http2               on;
    server_name         api.lakko.me;
    # Invariant #5: no request log. An access log line (client address,
    # time, path and query) is enough to rebuild who talks to whom: journal,
    # mailbox, account and blob ids sit in the paths, call tokens in the
    # query. Error logs stay at crit, because an error line carries the
    # client address and the request too. Services log without request ids.
    access_log off;
    error_log  /var/log/nginx/error.log crit;

    ssl_certificate     /etc/letsencrypt/live/api.lakko.me/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.lakko.me/privkey.pem;
    ssl_protocols       TLSv1.3;
    ssl_ciphers         TLS_AES_256_GCM_SHA384:TLS_CHACHA20_POLY1305_SHA256;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Referrer-Policy           "no-referrer" always;

    location = /health {
        access_log off;
        return    200 "api.lakko.me ok\n";
        add_header Content-Type text/plain;
    }

    location /auth/ {
        proxy_pass         http://lakko_auth/;
        include            /etc/nginx/sites-available/lakko-proxy-headers.inc;
    }

    location ~ "^/ds/(ds/mailbox/[0-9a-f]{64}/reach/check)$" {
        limit_req          zone=lakko_ds_reach_check burst=40 nodelay;
        limit_req_status   429;
        proxy_pass         http://lakko_ds/$1;
        include            /etc/nginx/sites-available/lakko-proxy-headers.inc;
    }

    location /ds/ {
        proxy_pass         http://lakko_ds/;
        include            /etc/nginx/sites-available/lakko-proxy-headers.inc;
        # DS uses long-poll / streaming — bumped timeouts.
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    location /storage/ {
        proxy_pass         http://lakko_storage/;
        include            /etc/nginx/sites-available/lakko-proxy-headers.inc;
        client_max_body_size 50M;
    }

    location /discovery/ {
        proxy_pass         http://lakko_discovery/;
        include            /etc/nginx/sites-available/lakko-proxy-headers.inc;
    }

    location /push-gw/ {
        proxy_pass         http://lakko_push_gw/;
        include            /etc/nginx/sites-available/lakko-proxy-headers.inc;
    }
    # ADR-0054 - see the /api/push/ block: the wake is internal-only.
    location = /push-gw/push/notify       { return 404; }
    location = /push-gw/push/notify-group { return 404; }

    # Phase 4 channel-broadcast backend. POST /posts caps
    # at ~17 MiB plaintext + overhead; mirror the storage
    # block's body cap so legitimately-sized posts pass.
    location /channels/ {
        proxy_pass         http://lakko_channels/;
        include            /etc/nginx/sites-available/lakko-proxy-headers.inc;
        client_max_body_size 20M;
    }

    # ADR-0059 section 5 - directory search, unlogged (see /api/channels/ above).
    location = /channels/v1/directory/search {
        access_log off;
        proxy_pass         http://lakko_channels/v1/directory/search;
        include            /etc/nginx/sites-available/lakko-proxy-headers.inc;
    }

    # ADR-0047 §4 — GIF proxy for the native clients (base
    # `https://api.lakko.me/gifs`, then the service path `/gifs/...`). Logging
    # off for the same reason as `/api/gifs/` above.
    location /gifs/ {
        proxy_pass         http://lakko_gif_proxy/;
        include            /etc/nginx/sites-available/lakko-proxy-headers.inc;
        access_log         off;
        error_log          /dev/null;
    }

    location / {
        return 404;
    }
}
