# Reverse proxy for the existing lakko.me / api.lakko.me domains.
# (edge.lakko.me is served by the system coturn — Phase 3.)
#
# Install on the VPS:
#   sudo cp infra/nginx/sites-available/lakko.conf /etc/nginx/sites-available/
#   sudo cp infra/nginx/sites-available/lakko-proxy-headers.inc /etc/nginx/sites-available/
#   sudo ln -sf /etc/nginx/sites-available/lakko.conf /etc/nginx/sites-enabled/lakko.conf
#   sudo nginx -t && sudo systemctl reload nginx
#
# TLS certificates — reused from the existing lakko_me deploy:
#   /etc/letsencrypt/live/lakko.me/{fullchain,privkey}.pem
#   /etc/letsencrypt/live/api.lakko.me/{fullchain,privkey}.pem

# ---- Upstreams (Lakko services listen on localhost) ----------------------
upstream lakko_auth      { server 127.0.0.1:8081; }
upstream lakko_ds        { server 127.0.0.1:8082; }
upstream lakko_storage   { server 127.0.0.1:8083; }
upstream lakko_discovery { server 127.0.0.1:8084; }
upstream lakko_push_gw   { server 127.0.0.1:8085; }

# ---- HTTP — ACME challenge + redirect ------------------------------------
server {
    listen      80;
    listen      [::]:80;
    server_name lakko.me api.lakko.me;

    # Let's Encrypt webroot challenge — the path must match the certbot config.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        allow all;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ---- HTTPS — lakko.me — web client (Phase 1.16+) -------------------------
server {
    listen              443 ssl;
    listen              [::]:443 ssl;
    http2               on;
    server_name         lakko.me;

    ssl_certificate     /etc/letsencrypt/live/lakko.me/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/lakko.me/privkey.pem;
    ssl_protocols       TLSv1.3;
    ssl_ciphers         TLS_AES_256_GCM_SHA384:TLS_CHACHA20_POLY1305_SHA256;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Referrer-Policy           "no-referrer" always;
    add_header X-Content-Type-Options    "nosniff" always;
    add_header X-Frame-Options           "DENY" always;

    # Phase 1.0: placeholder. apps/web (sprint 1.16) will drop its build output
    # into /var/www/lakko-web/, and we'll serve it from here.
    # root /var/www/lakko-web;
    # try_files $uri $uri/ /index.html;

    location = /health {
        access_log off;
        return    200 "lakko.me ok\n";
        add_header Content-Type text/plain;
    }

    location / {
        return 200 "Lakko — secure messenger. Web client coming in Phase 1.16.\n";
        add_header Content-Type text/plain;
    }
}

# ---- HTTPS — api.lakko.me — backend reverse proxy ------------------------
server {
    listen              443 ssl;
    listen              [::]:443 ssl;
    http2               on;
    server_name         api.lakko.me;

    ssl_certificate     /etc/letsencrypt/live/api.lakko.me/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.lakko.me/privkey.pem;
    ssl_protocols       TLSv1.3;
    ssl_ciphers         TLS_AES_256_GCM_SHA384:TLS_CHACHA20_POLY1305_SHA256;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Referrer-Policy           "no-referrer" always;

    location = /health {
        access_log off;
        return    200 "api.lakko.me ok\n";
        add_header Content-Type text/plain;
    }

    location /auth/ {
        proxy_pass         http://lakko_auth/;
        include            /etc/nginx/sites-available/lakko-proxy-headers.inc;
    }

    location /ds/ {
        proxy_pass         http://lakko_ds/;
        include            /etc/nginx/sites-available/lakko-proxy-headers.inc;
        # DS uses long-poll / streaming — bumped timeouts.
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    location /storage/ {
        proxy_pass         http://lakko_storage/;
        include            /etc/nginx/sites-available/lakko-proxy-headers.inc;
        client_max_body_size 50M;
    }

    location /discovery/ {
        proxy_pass         http://lakko_discovery/;
        include            /etc/nginx/sites-available/lakko-proxy-headers.inc;
    }

    location /push-gw/ {
        proxy_pass         http://lakko_push_gw/;
        include            /etc/nginx/sites-available/lakko-proxy-headers.inc;
    }

    location / {
        return 404;
    }
}
