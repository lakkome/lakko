#
# nginx vhost for the LiveKit SFU (Phase 3b2). Terminates TLS
# on port 443 → proxies signaling to upstream 7880 (LiveKit's
# WebSocket signal port) and the Prometheus metrics scrape to
# the local exporter.
#
# Two listeners on the same vhost:
#   1. WebSocket /            — LiveKit signaling (binary frames,
#                               long-lived, upgraded).
#   2. /metrics                — Prometheus scrape, gated by
#                               mTLS client cert (only the
#                               monitoring VPS holds it).
#
# Why nginx in front instead of binding 443 in LiveKit directly:
#   - TLS termination + cert reload via certbot is mature here.
#   - Survives a LiveKit restart without a TLS hiccup on
#     in-flight WebSocket frames (LiveKit's TLS reloader is
#     less battle-tested than nginx's).
#   - mTLS on /metrics is a one-liner; doing it in Go is more
#     code than it's worth.

upstream lakko_sfu_signal {
    # LiveKit's `port` from livekit.yaml; the SFU runs on the
    # same VPS as nginx so loopback is fine.
    server 127.0.0.1:7880;
    keepalive 16;
}

upstream lakko_sfu_metrics {
    # LiveKit's `prometheus_port` (default 6789).
    server 127.0.0.1:6789;
    keepalive 4;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name sfu.lakko.me;

    ssl_certificate     /etc/letsencrypt/live/sfu.lakko.me/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sfu.lakko.me/privkey.pem;

    # Modern TLS only.
    ssl_protocols         TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_ciphers           ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_session_timeout   1d;
    ssl_session_cache     shared:lakko_sfu_ssl:10m;
    ssl_session_tickets   off;

    # HSTS — one year, include subdomains, preload-eligible.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

    # Signal WebSocket. LiveKit clients upgrade on `/rtc`; the
    # path is anchored so an unrelated HTTP scan on `/` doesn't
    # spin up a WebSocket dance.
    location /rtc {
        proxy_pass         http://lakko_sfu_signal;
        proxy_http_version 1.1;

        # WebSocket upgrade plumbing.
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";

        # Standard reverse-proxy headers.
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # WebSocket frames can take a while; bump the idle
        # timeouts so a long pause (e.g. silence in a call)
        # doesn't drop the signal channel.
        proxy_read_timeout  3600s;
        proxy_send_timeout  3600s;

        # No buffering — frames are tiny and latency-sensitive.
        proxy_buffering     off;
    }

    # Health / version endpoint LiveKit exposes for liveness
    # probes. Returns a 200 with a small JSON body; the
    # monitoring VPS scrapes this every 10 s as the up/down
    # signal for alerting.
    location /health {
        proxy_pass         http://lakko_sfu_signal;
        proxy_http_version 1.1;
        proxy_set_header   Host       $host;
        proxy_set_header   X-Real-IP  $remote_addr;
        # Strict timeout — if the SFU is wedged, fail fast.
        proxy_read_timeout  5s;
        proxy_send_timeout  5s;
        # Hide upstream metadata so a 502 here doesn't leak
        # nginx version + LiveKit version to passers-by.
        proxy_hide_header   Server;
        proxy_hide_header   X-Powered-By;
    }

    # Prometheus metrics — mTLS-gated. The monitoring VPS holds
    # the client cert (a private CA Lakko signs at first deploy);
    # nothing else has it. This is the right shape for "expose
    # but only to one consumer" — no need for HTTP basic-auth
    # secrets in plaintext config files.
    location /metrics {
        # mTLS: require + verify client cert against the Lakko
        # private CA. Issue from a one-off cert authority living
        # only on the maintainer's machine (see ops playbook).
        ssl_verify_client       on;
        ssl_client_certificate  /etc/lakko/mtls/monitoring-ca.crt;

        proxy_pass         http://lakko_sfu_metrics/metrics;
        proxy_http_version 1.1;
        proxy_set_header   Host       $host;
        proxy_read_timeout  10s;
    }

    # Everything else → 404. The SFU's own HTTP surface is
    # deliberately small (signal + health + metrics).
    location / {
        return 404 "not found\n";
        add_header Content-Type "text/plain";
    }

    # Rate-limit the signaling handshake. A torrent of new-
    # connection attempts is a cheap DoS surface; cap to 20 / s
    # per IP at the edge so the LiveKit accept loop doesn't
    # saturate.
    limit_req zone=lakko_sfu_handshake burst=40 nodelay;
}

# Standalone rate-limit zone — must live at http{} scope so
# the include order matters. Put this in `infra/nginx/conf.d/`
# rather than the vhost itself if your nginx layout is
# strict.
# (Operators: if you see "limit_req_zone redefined" on reload,
# extract this to conf.d/lakko-rate-limit.conf — same line.)
limit_req_zone $binary_remote_addr zone=lakko_sfu_handshake:10m rate=20r/s;
