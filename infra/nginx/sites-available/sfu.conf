#
# nginx vhost for the Rust SFU (ADR-0011 — supersedes the
# LiveKit-fork vhost of ADR-0008). Terminates TLS on 443 and
# reverse-proxies to the `lakko-svc-sfu` axum listener on
# loopback:
#   1. /v1/connect  — the `lakko-sfu-v1` signaling WebSocket
#                     (long-lived, upgraded; the client connects
#                     to wss://sfu.lakko.me/v1/connect?token=<jwt>).
#   2. /health /ready /version — liveness + readiness probes.
#   3. /metrics     — Prometheus scrape, mTLS-gated (only the
#                     monitoring VPS holds the client cert),
#                     proxied to the SFU's separate metrics
#                     listener on 127.0.0.1:9641.
#
# IMPORTANT: the UDP media plane is NOT proxied here. str0m binds
# LAKKO_SFU_MEDIA_BIND (e.g. 0.0.0.0:43210) directly; clients
# reach it on that public UDP port (opened in the firewall by
# deploy-sfu.sh). nginx only fronts the TCP signaling + metrics.
#
# Why nginx in front instead of binding 443 in the SFU directly:
#   - TLS termination + certbot cert reload are mature here.
#   - Survives an SFU restart without a TLS hiccup on in-flight
#     WebSocket frames.
#   - mTLS on /metrics is a one-liner.

upstream lakko_sfu_signal {
    # LAKKO_SFU_BIND from lakko.env; the SFU runs on the same VPS
    # as nginx so loopback is fine.
    server 127.0.0.1:7880;
    keepalive 16;
}

upstream lakko_sfu_metrics {
    # LAKKO_SFU_METRICS_BIND (Prometheus exporter).
    server 127.0.0.1:9641;
    keepalive 4;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name sfu.lakko.me;

    ssl_certificate     /etc/letsencrypt/live/sfu.lakko.me/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sfu.lakko.me/privkey.pem;

    # Modern TLS only.
    ssl_protocols         TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_ciphers           ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_session_timeout   1d;
    ssl_session_cache     shared:lakko_sfu_ssl:10m;
    ssl_session_tickets   off;

    # HSTS — one year, include subdomains, preload-eligible.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

    # Signaling WebSocket. Clients upgrade on /v1/connect; the
    # path is anchored so an unrelated HTTP scan on / doesn't
    # spin up a WebSocket dance.
    location /v1/connect {
        proxy_pass         http://lakko_sfu_signal;
        proxy_http_version 1.1;

        # WebSocket upgrade plumbing.
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";

        # Standard reverse-proxy headers.
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # WebSocket frames can take a while; bump the idle
        # timeouts so a long pause (e.g. silence in a call)
        # doesn't drop the signal channel.
        proxy_read_timeout  3600s;
        proxy_send_timeout  3600s;

        # No buffering — frames are tiny and latency-sensitive.
        proxy_buffering     off;

        # Rate-limit the signaling handshake. A torrent of new-
        # connection attempts is a cheap DoS surface; cap to 20/s
        # per IP at the edge so the SFU accept loop + JWT verify
        # don't saturate.
        limit_req zone=lakko_sfu_handshake burst=40 nodelay;
    }

    # Liveness / readiness / version. The SFU exposes /health
    # (always 200 once the process is up), /ready (200 once the
    # JWKS cache is warm), and /version. The monitoring VPS
    # scrapes /health as the up/down signal.
    location ~ ^/(health|ready|version)$ {
        proxy_pass         http://lakko_sfu_signal;
        proxy_http_version 1.1;
        proxy_set_header   Host       $host;
        proxy_set_header   X-Real-IP  $remote_addr;
        # Strict timeout — if the SFU is wedged, fail fast.
        proxy_read_timeout  5s;
        proxy_send_timeout  5s;
        # Hide upstream metadata so a 502 here doesn't leak
        # nginx + SFU version to passers-by.
        proxy_hide_header   Server;
        proxy_hide_header   X-Powered-By;
    }

    # Prometheus metrics — mTLS-gated. The monitoring VPS holds
    # the client cert (a private CA Lakko signs at first deploy);
    # nothing else has it. The SFU's metrics listener is a
    # SEPARATE bind (127.0.0.1:9641) from the signaling listener,
    # so a public-side /metrics probe never reaches it without
    # the client cert.
    location /metrics {
        ssl_verify_client       on;
        ssl_client_certificate  /etc/lakko/mtls/monitoring-ca.crt;

        proxy_pass         http://lakko_sfu_metrics/metrics;
        proxy_http_version 1.1;
        proxy_set_header   Host       $host;
        proxy_read_timeout  10s;
    }

    # Everything else → 404. The SFU's HTTP surface is
    # deliberately small (signal + probes + metrics).
    location / {
        return 404 "not found\n";
        add_header Content-Type "text/plain";
    }
}

# Standalone rate-limit zone — must live at http{} scope. If your
# nginx layout is strict, extract this line to
# infra/nginx/conf.d/lakko-rate-limit.conf instead of the vhost.
# (Operators: if you see "limit_req_zone redefined" on reload,
# that means it's already declared elsewhere — drop this copy.)
limit_req_zone $binary_remote_addr zone=lakko_sfu_handshake:10m rate=20r/s;
