# nginx vhost for the coturn VPS (G3-turn-deploy, infra row 3a2).
#
# coturn itself owns port 443 (TURN-over-TLS) and port 3478
# (plain STUN/TURN). nginx cannot share 443 with coturn, so the
# only role nginx plays on this VPS is **mTLS-fronting the
# Prometheus metrics scrape** that coturn exposes on the
# internal `prometheus` port (9641 by default).
#
# Why front the scrape with nginx rather than ship the metrics
# port to the open internet:
#   - coturn does not implement mTLS on its built-in Prometheus
#     listener. Without nginx the scrape endpoint is unauthenticated
#     and would have to be opened to the whole internet for the
#     monitoring VPS to reach it.
#   - mTLS in nginx is a one-liner (`ssl_verify_client on`).
#     Doing it in C inside coturn is more code than it's worth.
#   - Same posture as `infra/nginx/sites-available/sfu.conf` —
#     the symmetry helps the operator's mental model.
#
# Trade-off: this means the operator has to install nginx on
# the coturn VPS even though coturn is the only application
# there. The cost is ~30 MB of disk + ~10 MB of RAM — trivial
# next to coturn itself.

# coturn's internal Prometheus listener. Binds 127.0.0.1:9641 by
# default (when `prometheus` is set in turnserver.conf without an
# explicit IP). The exporter speaks plain HTTP — nginx adds the
# TLS + client-cert verification.
upstream lakko_coturn_metrics {
    server 127.0.0.1:9641;
    keepalive 4;
}

server {
    # Port 9642 — one above the default coturn metrics port (9641).
    # We intentionally do NOT use the standard 443 here because
    # coturn owns 443 for TURN-over-TLS; binding 443 in nginx would
    # collide. Anything in the 9600-9700 range works; 9642 keeps
    # the proximity to 9641 so the operator's mental model stays
    # close to the source.
    listen 9642 ssl http2;
    listen [::]:9642 ssl http2;
    server_name turn.lakko.me;

    # Same Let's Encrypt cert coturn uses on 443. nginx and coturn
    # read the file independently; certbot's renewal hook reloads
    # both processes in sequence (see
    # `infra/letsencrypt/lakko-coturn-renew-hook.sh`).
    ssl_certificate     /etc/letsencrypt/live/turn.lakko.me/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/turn.lakko.me/privkey.pem;

    # Modern TLS only — mirrors the sfu.conf posture.
    ssl_protocols         TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_ciphers           ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_session_timeout   1d;
    ssl_session_cache     shared:lakko_coturn_ssl:10m;
    ssl_session_tickets   off;

    # HSTS — one year, include subdomains, preload-eligible.
    # Yes, even though this port is non-standard — HSTS still
    # applies to the hostname.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

    # mTLS for the whole server block: nginx accepts ssl_verify_client only
    # at server level (an earlier version put it inside the location, which
    # `nginx -t` refuses). Everything this vhost serves is metrics.
    ssl_verify_client       on;
    ssl_verify_depth        1;
    ssl_client_certificate  /etc/lakko/mtls/monitoring-ca.crt;

    # Prometheus metrics — mTLS-gated (server level, above). The monitoring VPS holds
    # the client cert (the private CA Lakko signs at first deploy
    # — the same CA the main VPS's metrics block trusts). Nothing else
    # has it; a request without that certificate is answered 400 by nginx
    # itself after the handshake and never reaches the exporter.
    location = /metrics {
        proxy_pass         http://lakko_coturn_metrics/metrics;
        proxy_http_version 1.1;
        proxy_set_header   Host       $host;
        proxy_set_header   X-Real-IP  $remote_addr;
        # Strict timeout — if coturn's internal exporter is
        # wedged, fail fast so Prometheus's scrape error counter
        # surfaces it.
        proxy_read_timeout 10s;
        proxy_send_timeout 10s;
        # Hide upstream metadata so a 502 here does not leak
        # nginx version + coturn version to scanners.
        proxy_hide_header  Server;
        proxy_hide_header  X-Powered-By;
    }

    # node_exporter of this VPS (ADR-0096 P3), on 127.0.0.1:9100.
    location = /node/metrics {
        proxy_pass         http://127.0.0.1:9100/metrics;
        proxy_http_version 1.1;
        proxy_set_header   Host       $host;
        proxy_read_timeout 10s;
        proxy_send_timeout 10s;
        proxy_hide_header  Server;
    }

    # Everything else → 404. This vhost is single-purpose; the
    # two metrics paths are the only things it serves.
    location / {
        return 404 "not found\n";
        add_header Content-Type "text/plain";
    }
}
