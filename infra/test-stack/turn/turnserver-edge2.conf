#
# coturn for edge2.lakko.me: STUN and TURN over UDP (and DTLS on UDP 5349).
# Installed as /etc/turnserver2.conf and run by coturn2.service. UDP 3478 on every
# address of the host is this instance's, so STUN to either name over IPv4 lands
# here; over IPv6 only edge2's address answers. Same shared secret as
# turnserver-edge.conf.

listening-port=3478
tls-listening-port=5349
listening-ip=0.0.0.0
listening-ip=::0
relay-ip=46.224.156.97
relay-ip=2a01:4f8:c2c:354f::ed62
# coturn keeps the first external-ip and logs an error for the second.
external-ip=46.224.156.97
external-ip=2a01:4f8:c2c:354f::ed62
min-port=49152
max-port=54999
fingerprint
use-auth-secret
static-auth-secret=@TURN_SHARED_SECRET@
server-name=edge2.lakko.me
realm=edge2.lakko.me
no-tcp
no-tls
no-tcp-relay
cert=/etc/letsencrypt/live/edge2.lakko.me/fullchain.pem
pkey=/etc/letsencrypt/live/edge2.lakko.me/privkey.pem
# No connection log (Lakko invariant #5).
no-stdout-log
log-file=/dev/null
no-multicast-peers
no-cli
