#
# /etc/haproxy/haproxy.cfg on the test host: every TCP and TLS path to the
# edge.lakko.me coturn (turnserver-edge.conf).
#
#   :443   client --TLS--> nginx stream SNI router --PROXY v1--> here 127.0.0.1:5350
#   :5349  client --TLS--> here (public, IPv4 and IPv6)
#   :3478  client --TCP--> here (public, IPv4 and IPv6; UDP 3478 is coturn2)
#   here: terminate TLS for edge.lakko.me --plain TURN + PROXY v2--> coturn 127.0.0.1:5351
#
# coturn 4.5.2 takes a client address only as binary PROXY v2 (tcp-proxy-port), which
# nginx 1.18 cannot send, and that port speaks plain TCP, not TLS. With tcp-proxy-port
# set coturn listens on that port only (measured: its TCP 3478 and TLS 5349 listeners
# were gone), so this proxy owns all three. Without the client address coturn reports
# 127.0.0.1 as the mapped address, which Firefox rejects. The certificate is the
# fullchain plus key of edge.lakko.me in one file, rebuilt by lakko-reload.sh.
# No connection log (Lakko invariant #5): no "log" in defaults or the proxies, so only
# HAProxy's own start-up and alert messages reach syslog.

global
    log /dev/log local0 notice
    chroot /var/lib/haproxy
    user haproxy
    group haproxy
    daemon
    ssl-default-bind-options ssl-min-ver TLSv1.2

defaults
    mode tcp
    timeout connect 5s
    timeout client 3600s
    timeout server 3600s

frontend turn_tls
    bind 127.0.0.1:5350 accept-proxy ssl crt /etc/haproxy/certs/edge.lakko.me.pem
    default_backend coturn_proxy

frontend turn_tls_direct
    bind :::5349 v4v6 ssl crt /etc/haproxy/certs/edge.lakko.me.pem
    default_backend coturn_proxy

frontend turn_tcp
    bind :::3478 v4v6
    default_backend coturn_proxy

backend coturn_proxy
    server coturn 127.0.0.1:5351 send-proxy-v2
