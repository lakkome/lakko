#
# The stream block of /etc/nginx/nginx.conf on the test host (top level, beside
# http {}): the SNI router on 443. edge.lakko.me goes to HAProxy on 127.0.0.1:5350,
# which terminates TLS for the edge coturn; every other name goes to the HTTP server
# on 127.0.0.1:8443 (nginx/lakko-test.conf). Both get the client address as PROXY
# protocol v1.

stream {
    map $ssl_preread_server_name $backend {
        edge.lakko.me   turn_backend;
        default         web_backend;
    }

    upstream turn_backend {
        server 127.0.0.1:5350;    # HAProxy (haproxy.cfg)
    }

    upstream web_backend {
        server 127.0.0.1:8443;    # the HTTP server
    }

    # Lakko invariant #5: no connection log (client address, time, SNI).
    access_log off;
    error_log  /var/log/nginx/stream_error.log crit;

    server {
        listen 443 reuseport;
        listen [::]:443 reuseport;
        ssl_preread on;

        proxy_connect_timeout 30s;
        proxy_timeout 3600s;
        proxy_responses 0;
        proxy_buffer_size 4k;
        proxy_socket_keepalive on;

        # Pass the client address on; the web backend and HAProxy both read it.
        proxy_protocol on;
        proxy_pass $backend;
    }
}
