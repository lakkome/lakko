#
# coturn for edge.lakko.me: TURN over TCP and TLS. Installed as /etc/turnserver.conf
# and run by coturn.service. Every client reaches it through HAProxy (haproxy.cfg),
# which terminates TLS and passes the client address as PROXY v2 on tcp-proxy-port.
# With tcp-proxy-port set, coturn 4.5.2 opens that port only: the listening-port,
# tls-listening-port, cert and TLS lines below stay for the day it is run without it.
# Replace @TURN_SHARED_SECRET@ with the secret services/auth mints credentials from;
# turnserver-edge2.conf carries the same one (setup-server.sh reads it from here).

listening-port=3478
tls-listening-port=5349
listening-ip=0.0.0.0
listening-ip=::0
relay-ip=46.224.156.97
relay-ip=2a01:4f8:c2c:354f::ed6e
# coturn keeps the first external-ip and logs an error for the second.
external-ip=46.224.156.97
external-ip=2a01:4f8:c2c:354f::ed6e
min-port=55000
max-port=65335
fingerprint
use-auth-secret
static-auth-secret=@TURN_SHARED_SECRET@
server-name=edge.lakko.me
realm=edge.lakko.me
no-udp
no-dtls
cert=/etc/letsencrypt/live/edge.lakko.me/fullchain.pem
pkey=/etc/letsencrypt/live/edge.lakko.me/privkey.pem
# No connection log (Lakko invariant #5): no verbose, no syslog, no log file. coturn
# still writes its start-up lines to /var/tmp/turn_<pid>_<date>.log before it reads
# this file.
no-stdout-log
log-file=/dev/null
no-multicast-peers
secure-stun
no-cli
no-tlsv1
no-tlsv1_1
# PROXY protocol v2 from HAProxy; plain TCP, not TLS. Not open in ufw.
tcp-proxy-port=5351
