#
# Lakko test stack — test.lakko.me.
# Derived from infra/nginx/sites-available/lakko.conf + sfu.conf. TLS arrives through
# the nginx stream SNI router on :443, which forwards non-TURN names to :8443.
# Services listen on 127.0.0.1 only (units lakko-test-*.service).
#
# Install: /etc/nginx/sites-available/lakko-test (symlinked into sites-enabled), with
# infra/nginx/sites-available/lakko-proxy-headers.inc copied to
# /etc/nginx/snippets/lakko-test-proxy-headers.inc and
# nginx/lakko-test-security-headers.inc copied to
# /etc/nginx/snippets/lakko-test-security-headers.inc. See README.md.

upstream lakko_test_auth      { server 127.0.0.1:8081; }
upstream lakko_test_ds        { server 127.0.0.1:8082; }
upstream lakko_test_storage   { server 127.0.0.1:8083; }
upstream lakko_test_discovery { server 127.0.0.1:8084; }
upstream lakko_test_push_gw   { server 127.0.0.1:8085; }
upstream lakko_test_gif_proxy { server 127.0.0.1:8091; }
upstream lakko_test_channels  { server 127.0.0.1:8086; }
upstream lakko_test_sfu       { server 127.0.0.1:7880; keepalive 16; }

limit_req_zone $binary_remote_addr zone=lakko_test_sfu_handshake:10m rate=20r/s;
# Cross-Origin-Resource-Policy per path, used by lakko-test-security-headers.inc:
# the link preview picture (apps/web/scripts/link-previews.mjs) is meant to be
# shown by other apps, so it alone is cross-origin.
map $uri $lakko_test_corp {
    default                                      "same-origin";
    "~^/assets/link-preview-[0-9a-f]+\.png$"    "cross-origin";
}
# ADR-0060: the DS reach check is anonymous (the proof is the gate) and
# answers whether a key is registered, so it is rate-limited per address here,
# the layer the DS relies on for its anonymous routes. Rate and burst chosen,
# not measured: a search checks at most 20 results.
limit_req_zone $binary_remote_addr zone=lakko_test_ds_reach_check:10m rate=5r/s;
# ADR-0065: per-address backstop in front of the blob pass gate (chosen, not
# measured; see infra/nginx/sites-available/lakko.conf).
limit_req_zone $binary_remote_addr zone=lakko_test_storage_blob:10m rate=50r/s;

server {
    listen 80;
    listen [::]:80;
    server_name test.lakko.me;
    # Invariant #5: no request log. An access log line (client address,
    # time, path and query) is enough to rebuild who talks to whom: journal,
    # mailbox, account and blob ids sit in the paths, call tokens in the
    # query. Error logs stay at crit, because an error line carries the
    # client address and the request too. Services log without request ids.
    access_log off;
    error_log  /var/log/nginx/error.log crit;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 8443 ssl http2 proxy_protocol;
    listen [::]:8443 ssl http2 proxy_protocol;
    # The obfs-proxy relay (ADR-0026). Loopback only.
    listen 127.0.0.1:8180;
    server_name test.lakko.me;
    # Invariant #5: no request log. An access log line (client address,
    # time, path and query) is enough to rebuild who talks to whom: journal,
    # mailbox, account and blob ids sit in the paths, call tokens in the
    # query. Error logs stay at crit, because an error line carries the
    # client address and the request too. Services log without request ids.
    access_log off;
    error_log  /var/log/nginx/error.log crit;

    # The client address arrives from the :443 SNI router via PROXY protocol.
    set_real_ip_from 127.0.0.1;
    set_real_ip_from ::1;
    real_ip_header proxy_protocol;

    ssl_certificate     /etc/letsencrypt/live/test.lakko.me/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/test.lakko.me/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:lakko_test_ssl:10m;
    ssl_session_timeout 1d;

    # Security headers. Repeated by include inside every location below that
    # sets an add_header of its own, since nginx does not inherit them there.
    include /etc/nginx/snippets/lakko-test-security-headers.inc;

    # The signed anti-censorship bootstrap config (ADR-0026).
    location = /bootstrap.json {
        root /var/www/lakko-test-bootstrap;
        default_type application/json;
        add_header Cache-Control "no-store" always;
        include /etc/nginx/snippets/lakko-test-security-headers.inc;
    }

    root /var/www/lakko-test-web;
    index index.html;

    location = /health {
        access_log off;
        default_type text/plain;
        return 200 "test.lakko.me ok\n";
    }

    location /assets/ {
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        include /etc/nginx/snippets/lakko-test-security-headers.inc;
        try_files $uri =404;
    }

    # nginx 1.18's mime.types has no wasm entry.
    location ~* \.wasm$ {
        types { }
        default_type application/wasm;
        try_files $uri =404;
    }

    location = /sw.js {
        access_log off;
        add_header Cache-Control "no-store" always;
        include /etc/nginx/snippets/lakko-test-security-headers.inc;
        try_files $uri =404;
    }

    # App-link association files, served from the web root the SPA build
    # ships them in. Apple fetches the extension-less file and expects JSON;
    # Android fetches assetlinks.json. Short cache so a re-deploy takes effect
    # within minutes.
    location ~ ^/\.well-known/(apple-app-site-association|assetlinks\.json)$ {
        access_log off;
        default_type application/json;
        add_header Cache-Control "public, max-age=300" always;
        include /etc/nginx/snippets/lakko-test-security-headers.inc;
        try_files $uri =404;
    }

    location /api/auth/ {
        proxy_pass http://lakko_test_auth/;
        include    /etc/nginx/snippets/lakko-test-proxy-headers.inc;
    }
    location ~ "^/api/ds/(ds/mailbox/[0-9a-f]{64}/reach/check)$" {
        limit_req zone=lakko_test_ds_reach_check burst=40 nodelay;
        limit_req_status 429;
        proxy_pass http://lakko_test_ds/$1;
        include    /etc/nginx/snippets/lakko-test-proxy-headers.inc;
    }
    location /api/ds/ {
        proxy_pass http://lakko_test_ds/;
        include    /etc/nginx/snippets/lakko-test-proxy-headers.inc;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }
    location /api/discovery/ {
        proxy_pass http://lakko_test_discovery/;
        include    /etc/nginx/snippets/lakko-test-proxy-headers.inc;
    }
    # Every storage route, the vault routes of ADR-0064 section 1 included
    # (`/vault/{id}`, `/vault/{id}/head`, `/vault/{id}/chunk/{n}`, signed with
    # the vault's write key over the service path without this prefix), goes
    # through this location and the per-address backstop; a vault object is
    # at most 4 MiB plus 8 bytes, inside the 50M ceiling.
    location /api/storage/ {
        limit_req zone=lakko_test_storage_blob burst=300 nodelay;
        limit_req_status 429;
        proxy_pass http://lakko_test_storage/;
        include    /etc/nginx/snippets/lakko-test-proxy-headers.inc;
        client_max_body_size 50M;
        proxy_read_timeout 600s;
    }
    location /api/push/ {
        proxy_pass http://lakko_test_push_gw/;
        include    /etc/nginx/snippets/lakko-test-proxy-headers.inc;
    }
    # ADR-0054 - no public route wakes a device: the wake is the DS's forward
    # to push-gw's internal listener (127.0.0.1:8092, never proxied). push-gw
    # no longer serves these publicly; the exact matches keep them unrouted.
    location = /api/push/push/notify          { return 404; }
    location = /api/push/push/notify-group    { return 404; }
    location = /native/push-gw/push/notify       { return 404; }
    location = /native/push-gw/push/notify-group { return 404; }
    # Channel posts are AEAD ciphertext; the 20M cap matches production.
    location /api/channels/ {
        proxy_pass http://lakko_test_channels/;
        include    /etc/nginx/snippets/lakko-test-proxy-headers.inc;
        client_max_body_size 20M;
    }
    # GIF search terms must not reach any log (ADR-0047).
    location /api/gifs/ {
        proxy_pass http://lakko_test_gif_proxy/;
        include    /etc/nginx/snippets/lakko-test-proxy-headers.inc;
        access_log off;
        error_log  /dev/null;
    }

    # Native clients use the prefix-less API paths (api.lakko.me shape) under /native/.
    location /native/auth/      { proxy_pass http://lakko_test_auth/;      include /etc/nginx/snippets/lakko-test-proxy-headers.inc; }
    location ~ "^/native/ds/(ds/mailbox/[0-9a-f]{64}/reach/check)$" {
        limit_req zone=lakko_test_ds_reach_check burst=40 nodelay;
        limit_req_status 429;
        proxy_pass http://lakko_test_ds/$1;
        include /etc/nginx/snippets/lakko-test-proxy-headers.inc;
    }
    location /native/ds/        { proxy_pass http://lakko_test_ds/;        include /etc/nginx/snippets/lakko-test-proxy-headers.inc; proxy_read_timeout 600s; proxy_send_timeout 600s; }
    # Native storage, vault routes included (see /api/storage/ above).
    location /native/storage/   { limit_req zone=lakko_test_storage_blob burst=300 nodelay; limit_req_status 429; proxy_pass http://lakko_test_storage/;  include /etc/nginx/snippets/lakko-test-proxy-headers.inc; client_max_body_size 50M; proxy_read_timeout 600s; }
    location /native/discovery/ { proxy_pass http://lakko_test_discovery/; include /etc/nginx/snippets/lakko-test-proxy-headers.inc; }
    location /native/push-gw/   { proxy_pass http://lakko_test_push_gw/;   include /etc/nginx/snippets/lakko-test-proxy-headers.inc; }
    location /native/gifs/      { proxy_pass http://lakko_test_gif_proxy/; include /etc/nginx/snippets/lakko-test-proxy-headers.inc; access_log off; error_log /dev/null; }
    location /native/channels/  { proxy_pass http://lakko_test_channels/;  include /etc/nginx/snippets/lakko-test-proxy-headers.inc; client_max_body_size 20M; }

    # SFU signaling: VITE_LAKKO_SFU_URL=wss://test.lakko.me/sfu -> /sfu/v1/connect.
    location /sfu/v1/connect {
        proxy_pass         http://lakko_test_sfu/v1/connect;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering    off;
        limit_req zone=lakko_test_sfu_handshake burst=40 nodelay;
    }
    location ~ ^/sfu/(health|ready|version)$ {
        proxy_pass http://lakko_test_sfu/$1;
        proxy_http_version 1.1;
        proxy_read_timeout 5s;
    }
    # Whether a call is still there (services/sfu call lifetime): a member
    # showing a call as joinable asks this. No token (ADR-0078 section 2):
    # knowing the room id (a one-way function of the call id) is the
    # capability.
    location ~ "^/sfu/v1/rooms/([0-9a-f]{64})$" {
        proxy_pass http://lakko_test_sfu/v1/rooms/$1;
        proxy_http_version 1.1;
        proxy_read_timeout 5s;
        limit_req zone=lakko_test_sfu_handshake burst=40 nodelay;
    }

    # Link previews (apps/web/scripts/link-previews.mjs). An app a link is
    # pasted into (Telegram, WhatsApp, iMessage, Slack, X, ...) fetches it and
    # reads the page's <head>. Each link kind gets a copy of index.html with
    # its own preview tags and the same app for a person; the tags name
    # nothing from the link. Without the copy (an older build) the path gets
    # index.html as before. Revalidated on every load like index.html.
    location ~ "^/([igc])/" {
        add_header Cache-Control "no-cache" always;
        include /etc/nginx/snippets/lakko-test-security-headers.inc;
        try_files /link-preview/$1.html /index.html;
    }

    # A shared feed (docs/ux/feed.md): the rules ride after `#`.
    location = /feed/import {
        add_header Cache-Control "no-cache" always;
        include /etc/nginx/snippets/lakko-test-security-headers.inc;
        try_files /link-preview/feed.html /index.html;
    }

    # The page itself is revalidated on every load, so a deploy is picked up
    # on the next reload and never served from a stale browser cache. The
    # hashed files under /assets/ stay immutable.
    location = /index.html {
        add_header Cache-Control "no-cache" always;
        include /etc/nginx/snippets/lakko-test-security-headers.inc;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
