# Local full-stack run of the Lakko core HTTP services. One command
# (`docker compose -f infra/docker/docker-compose.yml up --build`) brings up
# every backend a client needs for the core flow: register -> recover ->
# username discovery -> identity bundle + KeyPackage -> MLS 1x1 chat over the
# Delivery Service, plus channels + push.
#
#   db        - MariaDB 11, seeded by ./initdb.sql (one DB per service).
#   auth      :8081 - OPAQUE register/login, session-token + call-JWT mint,
#                     WebAuthn, TURN credentials, the JWKS the SFU verifies.
#   ds        :8082 - MLS group journal + the stranger-inbox mailbox.
#   storage   :8083 - ciphertext blob proxy (local blob dir in this profile).
#   discovery :8084 - OPRF username register/lookup, identity bundle, KeyPackage.
#   push-gw   :8085 - encrypted push fan-out (LogOnlyProvider until real APNs /
#                     FCM / WebPush creds are supplied - see the README).
#   channels  :8086 - channel broadcast backend.
#   transparency :8087 - persistent CONIKS key-transparency log (signed roots
#                     + inclusion proofs; identity trust anchor).
#
# The SFU (calls) carries a UDP media plane and its own image; run it via
# ci/sfu-e2e/ or wire it into this file with a JWKS URL pointing at
# http://auth:8081/.well-known/jwks.json (see the README).
#
# ALL secrets here are FIXED LOCAL-DEV FIXTURES, never production values.
# Production deploys via systemd (infra/README.md + infra/systemd/).

services:
  db:
    image: mariadb:11
    container_name: lakko-db
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: rootpw
      MARIADB_USER: lakko
      MARIADB_PASSWORD: devpass
    volumes:
      - ./initdb.sql:/docker-entrypoint-initdb.d/00-init.sql:ro
      - lakko-db-data:/var/lib/mysql
    ports:
      - "127.0.0.1:3306:3306"
    healthcheck:
      # Passes only once the init script created the last DB (lakko_push_gw)
      # AND granted the lakko user - so depends_on: service_healthy never
      # races the one-time bootstrap.
      test:
        - CMD-SHELL
        - "mariadb -ulakko -pdevpass -e 'USE lakko_push_gw' || exit 1"
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 5s

  auth:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile
      target: auth-runtime
    container_name: lakko-auth
    restart: unless-stopped
    depends_on:
      db: { condition: service_healthy }
    environment:
      LAKKO_BIND: 0.0.0.0:8081
      LAKKO_AUTH_DATABASE_URL: mysql://lakko:devpass@db:3306/lakko_auth
      DATABASE_URL: mysql://lakko:devpass@db:3306/lakko_auth
      LAKKO_SESSION_TOKEN_SECRET: ${LAKKO_SESSION_TOKEN_SECRET:-ZGV2LXNlc3Npb24tdG9rZW4tc2VjcmV0LWZvci1sb2NhbC10ZXN0aW5nLW9ubHkhIQ==}
      LAKKO_WEBAUTHN_RP_ID: localhost
      LAKKO_WEBAUTHN_RP_NAME: Lakko (dev)
      LAKKO_WEBAUTHN_RP_ORIGIN: http://localhost:5173
      LAKKO_TURN_SHARED_SECRET: ${LAKKO_TURN_SHARED_SECRET:-ZHVtbXktdHVybi1zZWNyZXQ=}
      LAKKO_TURN_URIS: ${LAKKO_TURN_URIS:-turn:localhost:3478}
      # ADR-0018 factor (c) — TOTP secret-encryption key (base64, 32 bytes
      # after decode). Dev fixture only; never a production value. Unset it
      # to disable the /totp/* routes (they return 503).
      LAKKO_TOTP_ENC_KEY: ${LAKKO_TOTP_ENC_KEY:-ZGV2LXRvdHAtZW5jLWtleS0zMi1ieXRlcy1maXhlZCE=}
      # ADR-0072 — passkey-vault blob-encryption key (base64, 32 bytes after
      # decode). Dev fixture only; never a production value. Unset it to
      # disable the /vault/passkey* routes (they return 503).
      LAKKO_VAULT_ENC_KEY: ${LAKKO_VAULT_ENC_KEY:-ZGV2LXZhdWx0LWVuYy1rZXktMzItYnl0ZXMtZml4ZWQh}
      LAKKO_SIGNUP_POW_EFFORT_BITS: ${LAKKO_SIGNUP_POW_EFFORT_BITS:-8}
      # ADR-0054 - the anonymous-token master secret (64 hex chars) auth issues
      # under; discovery, the DS and push-gw MUST hold the same value. Unset:
      # /auth/tokens and every token route answer 503.
      LAKKO_ANON_TOKEN_MASTER_SECRET: ${LAKKO_ANON_TOKEN_MASTER_SECRET:-}
      # ADR-0054 S5 - pepper keying the stored login handles (64 hex chars).
      # Dev fixture only; never a production value. Unset: every route that
      # names an account by login handle answers 503.
      LAKKO_AUTH_HANDLE_PEPPER: ${LAKKO_AUTH_HANDLE_PEPPER:-6c616b6b6f2d6c6f63616c2d6465762d6c6f67696e2d68616e646c652d706570}
    ports:
      - "127.0.0.1:8081:8081"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://127.0.0.1:8081/ready || exit 1"]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 3s

  ds:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile
      target: ds-runtime
    container_name: lakko-ds
    restart: unless-stopped
    depends_on:
      db: { condition: service_healthy }
    environment:
      LAKKO_BIND: 0.0.0.0:8082
      LAKKO_DS_DATABASE_URL: mysql://lakko:devpass@db:3306/lakko_ds
      DATABASE_URL: mysql://lakko:devpass@db:3306/lakko_ds
      # ADR-0054 - forward group wakes to push-gw's internal listener. The
      # secret MUST match push-gw's LAKKO_PUSH_GW_INTERNAL_SECRET. Unset BOTH
      # to turn wakes off; setting only one refuses to start.
      LAKKO_DS_PUSH_GW_URL: ${LAKKO_DS_PUSH_GW_URL:-http://push-gw:8092}
      LAKKO_DS_PUSH_GW_SECRET: ${LAKKO_PUSH_GW_INTERNAL_SECRET:-ZGV2LXB1c2gtZ3ctaW50ZXJuYWwtd2FrZS1zZWNyZXQ=}
      # ADR-0054 - the anonymous-token master secret; MUST match auth's.
      # Unset: the knock answers 503 anon-tokens-disabled.
      LAKKO_ANON_TOKEN_MASTER_SECRET: ${LAKKO_ANON_TOKEN_MASTER_SECRET:-}
    ports:
      - "127.0.0.1:8082:8082"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://127.0.0.1:8082/ready || exit 1"]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 3s

  storage:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile
      target: storage-runtime
    container_name: lakko-storage
    restart: unless-stopped
    environment:
      LAKKO_BIND: 0.0.0.0:8083
      LAKKO_BLOB_DIR: /var/lib/lakko/blobs
      LAKKO_SESSION_TOKEN_SECRET: ${LAKKO_SESSION_TOKEN_SECRET:-ZGV2LXNlc3Npb24tdG9rZW4tc2VjcmV0LWZvci1sb2NhbC10ZXN0aW5nLW9ubHkhIQ==}
    volumes:
      - lakko-blobs:/var/lib/lakko/blobs
    ports:
      - "127.0.0.1:8083:8083"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://127.0.0.1:8083/ready || exit 1"]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 3s

  discovery:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile
      target: discovery-runtime
    container_name: lakko-discovery
    restart: unless-stopped
    depends_on:
      db: { condition: service_healthy }
    environment:
      LAKKO_BIND: 0.0.0.0:8084
      LAKKO_DISCOVERY_DATABASE_URL: mysql://lakko:devpass@db:3306/lakko_discovery
      DATABASE_URL: mysql://lakko:devpass@db:3306/lakko_discovery
      # MUST match auth's secret - discovery verifies the bearer session
      # tokens auth mints (identity-bundle upload is gated).
      LAKKO_SESSION_TOKEN_SECRET: ${LAKKO_SESSION_TOKEN_SECRET:-ZGV2LXNlc3Npb24tdG9rZW4tc2VjcmV0LWZvci1sb2NhbC10ZXN0aW5nLW9ubHkhIQ==}
      # ADR-0054 - the anonymous-token master secret; MUST match auth's.
      # Unset: the token routes (OPRF, channel register, invite consumes)
      # answer 503 anon-tokens-disabled.
      LAKKO_ANON_TOKEN_MASTER_SECRET: ${LAKKO_ANON_TOKEN_MASTER_SECRET:-}
      # ADR-0017 (ii) — per-account cool-down (seconds) on UNPROVEN
      # AccountIdentity changes to a NEW key (the lost-everything publish),
      # blunting attacker churn. Default 1 h; 0 disables. A heal-back to the
      # previous key and a proven rotation are never gated.
      LAKKO_DISCOVERY_FRESH_IDENTITY_COOLDOWN_SECS: ${LAKKO_DISCOVERY_FRESH_IDENTITY_COOLDOWN_SECS:-3600}
      # KT-log S2 — discovery appends an identity-key CHANGE to the
      # transparency log (best-effort, fail-open). Both vars arm it; the
      # secret MUST match the transparency service's
      # LAKKO_TRANSPARENCY_APPEND_SECRET. Unset the URL to disable.
      LAKKO_TRANSPARENCY_URL: ${LAKKO_TRANSPARENCY_URL:-http://transparency:8087}
      LAKKO_TRANSPARENCY_APPEND_SECRET: ${LAKKO_TRANSPARENCY_APPEND_SECRET:-ZGV2LXRyYW5zcGFyZW5jeS1hcHBlbmQtc2VjcmV0LTMyYiE=}
      # KT-log S2.5 — the reconciliation-sweep interval (seconds, default
      # 300). The reconciler back-fills every account's CURRENT published
      # identity into the transparency log, closing the S2 best-effort
      # fail-open gap. Spawned only when LAKKO_TRANSPARENCY_URL is set; 0
      # disables the sweep.
      LAKKO_DISCOVERY_TRANSPARENCY_RECONCILE_SECS: ${LAKKO_DISCOVERY_TRANSPARENCY_RECONCILE_SECS:-300}
    ports:
      - "127.0.0.1:8084:8084"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://127.0.0.1:8084/ready || exit 1"]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 3s

  push-gw:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile
      target: push-gw-runtime
    container_name: lakko-push-gw
    restart: unless-stopped
    depends_on:
      db: { condition: service_healthy }
    environment:
      LAKKO_BIND: 0.0.0.0:8085
      LAKKO_PUSH_GW_DATABASE_URL: mysql://lakko:devpass@db:3306/lakko_push_gw
      DATABASE_URL: mysql://lakko:devpass@db:3306/lakko_push_gw
      LAKKO_SESSION_TOKEN_SECRET: ${LAKKO_SESSION_TOKEN_SECRET:-ZGV2LXNlc3Npb24tdG9rZW4tc2VjcmV0LWZvci1sb2NhbC10ZXN0aW5nLW9ubHkhIQ==}
      # ADR-0054 - the anonymous-token master secret; MUST match auth's.
      # Unset: the registration routes answer 503 anon-tokens-disabled.
      LAKKO_ANON_TOKEN_MASTER_SECRET: ${LAKKO_ANON_TOKEN_MASTER_SECRET:-}
      # ADR-0054 - the internal listener the DS forwards wakes to. Reachable
      # on the compose network only (not published below). The secret MUST
      # match the DS's LAKKO_DS_PUSH_GW_SECRET.
      LAKKO_PUSH_GW_INTERNAL_BIND: 0.0.0.0:8092
      LAKKO_PUSH_GW_INTERNAL_SECRET: ${LAKKO_PUSH_GW_INTERNAL_SECRET:-ZGV2LXB1c2gtZ3ctaW50ZXJuYWwtd2FrZS1zZWNyZXQ=}
      # No APNS_/FCM_/WEBPUSH_ creds in dev -> the LogOnlyProvider records
      # envelopes instead of delivering. Supply real creds to enable
      # delivery (see the README).
    ports:
      - "127.0.0.1:8085:8085"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://127.0.0.1:8085/ready || exit 1"]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 3s

  transparency:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile
      target: transparency-runtime
    container_name: lakko-transparency
    restart: unless-stopped
    depends_on:
      db: { condition: service_healthy }
    environment:
      LAKKO_BIND: 0.0.0.0:8087
      LAKKO_TRANSPARENCY_DATABASE_URL: mysql://lakko:devpass@db:3306/lakko_transparency
      DATABASE_URL: mysql://lakko:devpass@db:3306/lakko_transparency
      # KT-log S2 — shared service secret gating POST /transparency/append.
      # The SAME value the discovery service presents as a bearer (below).
      # Base64, >= 16 bytes after decode. Dev fixture only; unset it to
      # disable the append endpoint (it then serves 503). Read paths stay
      # anonymous regardless.
      LAKKO_TRANSPARENCY_APPEND_SECRET: ${LAKKO_TRANSPARENCY_APPEND_SECRET:-ZGV2LXRyYW5zcGFyZW5jeS1hcHBlbmQtc2VjcmV0LTMyYiE=}
    ports:
      - "127.0.0.1:8087:8087"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://127.0.0.1:8087/ready || exit 1"]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 3s

  channels:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile
      target: channels-runtime
    container_name: lakko-channels
    restart: unless-stopped
    depends_on:
      db: { condition: service_healthy }
    environment:
      LAKKO_CHANNELS_BIND: 0.0.0.0:8086
      LAKKO_CHANNELS_DATABASE_URL: mysql://lakko:devpass@db:3306/lakko_channels
      DATABASE_URL: mysql://lakko:devpass@db:3306/lakko_channels
    ports:
      - "127.0.0.1:8086:8086"
    healthcheck:
      # channels exposes /health (+ /version) but no /ready probe.
      test: ["CMD-SHELL", "curl -sf http://127.0.0.1:8086/health || exit 1"]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 3s

volumes:
  lakko-db-data:
  lakko-blobs:
