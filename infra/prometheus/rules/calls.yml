# Alert rules for calls: the Rust SFU (ADR-0011, metrics lakko_sfu_*) and
# coturn. That the SFU is up at all is LakkoServiceDown in services.yml.
#
# Thresholds are first guesses, to be tuned on the test stack.

groups:
  - name: lakko_sfu
    interval: 30s
    rules:
      # Packets offered to subscribers that had no writer for them
      # (renegotiation not open, transport not connected). A high share
      # while calls run means subscribers are starved.
      - alert: LakkoSfuSubscribersStarved
        expr: |
          rate(lakko_sfu_media_frames_dropped_total{reason="no_writer"}[5m])
            /
          (rate(lakko_sfu_media_frames_forwarded_total[5m]) + rate(lakko_sfu_media_frames_dropped_total{reason="no_writer"}[5m]))
            > 0.2
          and on (stack) lakko_sfu_peers_active > 1
        for: 5m
        labels:
          severity: warning
          service: sfu
        annotations:
          summary: "SFU ({{ $labels.stack }}): {{ $value | humanizePercentage }} of fanout has no writer"

      - alert: LakkoSfuAdmissionsRefused
        expr: |
          rate(lakko_sfu_peers_rejected_total[10m])
            /
          (rate(lakko_sfu_peers_rejected_total[10m]) + rate(lakko_sfu_peers_admitted_total[10m]))
            > 0.5
        for: 10m
        labels:
          severity: warning
          service: sfu
        annotations:
          summary: "SFU ({{ $labels.stack }}): {{ $value | humanizePercentage }} of call admissions refused"
          description: |
            Usually a stale JWKS (auth rotated its call-token key) or a
            client minting tokens the SFU cannot verify.

      # The JWKS refreshes every 300 s by default
      # (LAKKO_SFU_JWKS_REFRESH_SECS); six missed refreshes is a fault.
      - alert: LakkoSfuJwksStale
        expr: lakko_sfu_jwks_cache_age_seconds > 1800
        for: 5m
        labels:
          severity: warning
          service: sfu
        annotations:
          summary: "SFU ({{ $labels.stack }}): JWKS not refreshed for {{ $value | humanizeDuration }}"

      # Hetzner's monthly transfer allowance is 20 TB; warn at 16 TiB.
      - alert: LakkoMainHostEgressBudget
        expr: |
          sum by (stack) (increase(node_network_transmit_bytes_total{host="main",device!="lo"}[30d]))
            > 16 * 1024 * 1024 * 1024 * 1024
        for: 1h
        labels:
          severity: warning
        annotations:
          summary: "Main host egress is past 16 TiB in 30 days"

  - name: lakko_coturn
    interval: 30s
    rules:
      - alert: LakkoCoturnDown
        expr: up{job="coturn", service="coturn"} == 0
        for: 2m
        labels:
          severity: critical
          service: coturn
        annotations:
          summary: "coturn ({{ $labels.stack }}) is unreachable"
          description: |
            Calls that need a relay fail to connect while coturn is down.
            Check `systemctl status coturn` on turn.lakko.me.
