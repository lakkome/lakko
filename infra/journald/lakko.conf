# journald retention on every Lakko host (ADR-0096 section 6). Installed as
# /etc/systemd/journald.conf.d/lakko.conf by infra/scripts/setup-metrics.sh,
# deploy-coturn.sh and infra/monitoring/setup-monitoring.sh.
#
# journald is the only log store: no shipping, no second copy. A week and a
# gigabyte are chosen, not measured; whichever is reached first applies.

[Journal]
Storage=persistent
SystemMaxUse=1G
MaxRetentionSec=7day
