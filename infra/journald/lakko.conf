# journald retention on every Lakko host (ADR-0096 section 6). Installed as
# /etc/systemd/journald.conf.d/lakko.conf by infra/scripts/setup-metrics.sh,
# deploy-coturn.sh, infra/monitoring/setup-monitoring.sh and
# infra/scripts/log-retention.sh.
#
# journald is the only log store: no shipping, no second copy. The Lakko
# services and the SFU log no client address by design, but anything a
# process prints on failure lands here, so the journal keeps 7 days and no
# more: the privacy policy (docs/legal/privacy.md, "Logs") states this
# period; change both together. A gigabyte is chosen, not measured; whichever
# is reached first applies. ForwardToSyslog=no keeps a second copy out of
# /var/log/syslog, whose rotation the distribution owns.

[Journal]
Storage=persistent
SystemMaxUse=1G
MaxRetentionSec=7day
ForwardToSyslog=no
