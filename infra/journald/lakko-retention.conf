#
# Installed as /etc/systemd/journald.conf.d/lakko-retention.conf by
# infra/scripts/log-retention.sh. The privacy policy (docs/legal/privacy.md,
# "Logs") states this period; change both together.
#
# The Lakko services and the SFU log to the journal. They log no client
# address by design, but anything a process prints on failure lands here, so
# the journal keeps 7 days and no more. coturn keeps no connection log at all
# (log-file=/dev/null). ForwardToSyslog=no keeps a second copy out of
# /var/log/syslog, whose rotation the distribution owns.

[Journal]
MaxRetentionSec=7day
SystemMaxUse=2G
ForwardToSyslog=no
