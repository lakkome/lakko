# coturn config for Lakko's TURN-over-TLS deployment (Phase 3a2).
#
# Hetzner CX22 (2 vCPU, 4 GB) is enough for the V1 user base; the
# CCX-tier SFU VPS handles the actual media bandwidth, coturn only
# relays sessions whose ICE candidate pair didn't establish via
# direct STUN. Expect ~15-25 % of calls to fall back to TURN.
#
# Operational notes:
#  - Run on its own VPS — not co-located with the SFU. Two
#    independent failure domains: a coturn crash should not take
#    down the in-call signaling on the SFU.
#  - Pin the bind to ALL interfaces (0.0.0.0 + ::); the host's
#    firewall (ufw / nftables) is what limits exposure.
#  - The `use-auth-secret` model gives every client a short-lived
#    HMAC-SHA-1 credential derived from a 32-byte shared secret
#    `services/auth` knows. Static long-lived credentials are
#    a perpetual leak waiting to happen; the HMAC scheme rotates
#    on every session.
#
# Production deploy (one-time):
#   1. Provision Hetzner CX22 + Ubuntu 24.04 LTS.
#   2. DNS A + AAAA for `turn.lakko.me` → VPS IP.
#   3. `apt install coturn` (the Ubuntu repo carries 4.6+, fine).
#   4. `certbot certonly --standalone -d turn.lakko.me` for TLS.
#   5. Copy this file → /etc/turnserver.conf.
#   6. Fill in `static-auth-secret` with a fresh 32-byte secret
#      (the same value goes into `/etc/lakko/lakko.env` as
#      `TURN_SHARED_SECRET=...` so `services/auth` can mint
#      matching credentials).
#   7. `systemctl enable --now coturn`.
#
# Re-deploy (after a renew):
#   - `systemctl reload coturn` is enough; coturn re-reads the
#     cert files without a restart.

# Listen on every interface — firewall gates the surface.
listening-ip=0.0.0.0
listening-ip=::

# Standard STUN/TURN port (UDP/TCP) — gives clients a chance to
# negotiate without TLS first. TURN-over-TLS on 443 is the
# anti-censorship fallback that always works.
listening-port=3478
tls-listening-port=443

# Bind both UDP + TCP. UDP is the canonical media transport;
# TCP fallback is for networks that block UDP altogether.
# TLS listens on TCP-only on the tls-listening-port (RFC 8489).
# No need for separate tcp-listening-port — coturn handles both
# on listening-port.

# Relay range — the kernel allocates ephemeral UDP ports out of
# this window for each relayed stream. 49152-65535 is the
# IANA-recommended dynamic range. Open these in the firewall.
min-port=49152
max-port=65535

# `use-auth-secret` enables the time-limited credentials model
# (RFC 7635). Client gets username `<expiry-unix-secs>:<user_id>`
# and password `HMAC-SHA-1(static-auth-secret, username)`.
# Lakko's services/auth mints both via the call-admission JWT
# response — never long-lived static creds.
use-auth-secret
# Replace at first deploy with a 32-byte random value.
# `head -c 32 /dev/urandom | base64` produces a suitable string.
# Also write the SAME value to /etc/lakko/lakko.env as
# TURN_SHARED_SECRET=... so services/auth can mint matching
# credentials.
static-auth-secret=REPLACE-WITH-RANDOM-32-BYTES-BASE64

# Realm — visible to clients via STUN messages. Match the
# user-facing domain so it's recognisable in client diagnostics.
realm=lakko.me

# TLS cert paths — point at Let's Encrypt output.
cert=/etc/letsencrypt/live/turn.lakko.me/fullchain.pem
pkey=/etc/letsencrypt/live/turn.lakko.me/privkey.pem
# Modern cipher suite. coturn defaults to a sensible set but we
# pin TLS 1.2+ explicitly so a future libssl bump doesn't drop
# back to weak ciphers silently.
no-tlsv1
no-tlsv1_1
cipher-list="ECDHE+AESGCM:ECDHE+CHACHA20:DHE+AESGCM:!aNULL:!eNULL:!EXPORT:!DES:!MD5:!PSK:!RC4"

# No web admin interface — that's an attack surface we don't need.
# coturn's `cli-port` for the operator CLI is bind-localhost-only.
no-cli

# Production logging — rotated by the system journal via stdout.
syslog
# Drop banner from STUN responses (less attack-surface enumeration).
no-software-attribute
fingerprint
mobility

# Quota (per user; not bytes-per-time — coturn's quota model is
# crude). Set generous values; real abuse detection lives in
# services/auth's PoW + Privacy Pass gate.
user-quota=12
total-quota=1200
max-bps=5000000  # 5 Mbps per session (covers 1080p video + audio)

# Anti-amplification: don't relay to private / loopback ranges.
# A misconfigured client could otherwise be turned into a UDP
# amplifier targeting internal hosts on the same VPS.
denied-peer-ip=0.0.0.0-0.255.255.255
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=100.64.0.0-100.127.255.255
denied-peer-ip=127.0.0.0-127.255.255.255
denied-peer-ip=169.254.0.0-169.254.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.0.0.0-192.0.0.255
denied-peer-ip=192.0.2.0-192.0.2.255
denied-peer-ip=192.88.99.0-192.88.99.255
denied-peer-ip=192.168.0.0-192.168.255.255
denied-peer-ip=198.18.0.0-198.19.255.255
denied-peer-ip=198.51.100.0-198.51.100.255
denied-peer-ip=203.0.113.0-203.0.113.255
denied-peer-ip=240.0.0.0-255.255.255.255
denied-peer-ip=::1
denied-peer-ip=fc00::-fdff:ffff:ffff:ffff:ffff:ffff:ffff:ffff
denied-peer-ip=fe80::-febf:ffff:ffff:ffff:ffff:ffff:ffff:ffff

# Prometheus metrics endpoint — scraped by the monitoring VPS.
# Default port 9641. Bind localhost-only; nginx fronts the
# scrape with mTLS (see infra/nginx/sites-available/turn.conf).
prometheus

# Don't run the legacy "fingerprint-based authentication" — we
# only use static-auth-secret + JWT.
no-stun

# Performance: thread count. CCX-tier vCPU count × 2 is the
# rule of thumb; on a CX22 (2 vCPU) we want 4 threads.
relay-threads=4
