[graph]
all-features = false

[advisories]
db-urls = ["https://github.com/rustsec/advisory-db"]
yanked = "deny"
# Unmaintained / informational notices are surfaced but do not block CI.
# Track upstream and ignore individual advisories via `ignore = []` when
# a dep stays stuck.
unmaintained = "workspace"
ignore = [
    # Transitive through uniffi 0.28.x — track upstream bump.
    # bincode 1.3.x → uniffi_macros (RUSTSEC-2025-0141, unmaintained).
    "RUSTSEC-2025-0141",
    # paste 1.0.x → uniffi_core / uniffi_bindgen (RUSTSEC-2024-0436, unmaintained).
    "RUSTSEC-2024-0436",
]

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "MPL-2.0",
    "Unicode-DFS-2016",
    "Unicode-3.0",
    "Zlib",
    "CC0-1.0",
    "BSL-1.0",
    "AGPL-3.0",
    "AGPL-3.0-or-later",
    "OpenSSL",
]
confidence-threshold = 0.9
exceptions = []

[bans]
multiple-versions = "warn"
wildcards = "deny"
deny = []
skip = []
skip-tree = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
