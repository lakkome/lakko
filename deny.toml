[graph]
all-features = false

[advisories]
db-urls = ["https://github.com/rustsec/advisory-db"]
yanked = "deny"
# Unmaintained / informational notices are surfaced but do not block CI.
# Track upstream and ignore individual advisories via `ignore = []` when
# a dep stays stuck.
unmaintained = "workspace"
ignore = [
    # Transitive through uniffi 0.28.x — track upstream bump.
    # bincode 1.3.x → uniffi_macros (RUSTSEC-2025-0141, unmaintained).
    "RUSTSEC-2025-0141",
    # paste 1.0.x → uniffi_core / uniffi_bindgen (RUSTSEC-2024-0436, unmaintained).
    "RUSTSEC-2024-0436",
    # Marvin Attack — rsa 0.9.x, NO fixed upgrade available upstream.
    # Transitive через sqlx-mysql 0.8.x для MySQL caching_sha2_password
    # authentication handshake. Attack требует MITM на DB-соединении +
    # измерение timing-а на тысячах RSA decryption-ов; у нас Auth ↔ MariaDB
    # — localhost only (через unix socket или 127.0.0.1), MITM невозможен.
    # Track: https://github.com/launchbadge/sqlx/issues/2911 — sqlx ждёт
    # rsa 0.10.0 release.
    "RUSTSEC-2023-0071",
]

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "MPL-2.0",
    "Unicode-DFS-2016",
    "Unicode-3.0",
    "Zlib",
    "CC0-1.0",
    "BSL-1.0",
    "AGPL-3.0",
    "AGPL-3.0-or-later",
    "OpenSSL",
    # CDLA-Permissive-2.0 — Community Data License Agreement (permissive).
    # Используется webpki-roots (Mozilla CA trust store) — это data, не code.
    # FSF-considered free, OSI-style permissive. Транзитивно через sqlx-core.
    "CDLA-Permissive-2.0",
]
confidence-threshold = 0.9
exceptions = []

[bans]
multiple-versions = "warn"
wildcards = "deny"
deny = []
skip = []
skip-tree = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
