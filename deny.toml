[graph]
all-features = false

[advisories]
db-urls = ["https://github.com/rustsec/advisory-db"]
yanked = "deny"
# Unmaintained / informational notices are surfaced but do not block CI.
# Track upstream and ignore individual advisories via `ignore = []` when
# a dep stays stuck.
unmaintained = "workspace"
ignore = [
    # Transitive through uniffi 0.28.x — track upstream bump.
    # bincode 1.3.x → uniffi_macros (RUSTSEC-2025-0141, unmaintained).
    "RUSTSEC-2025-0141",
    # paste 1.0.x → uniffi_core / uniffi_bindgen (RUSTSEC-2024-0436, unmaintained).
    "RUSTSEC-2024-0436",
    # Marvin Attack — rsa 0.9.x. RUSTSEC-2023-0071 has NO patched rsa version
    # (advisory `patched = []`); the advisory is cleared by DROPPING rsa, not by
    # upgrading it. Transitive through sqlx-mysql 0.8.x, whose `auth.rs` uses
    # `rsa::` UNCONDITIONALLY (the `optional = true` dep is not `#[cfg]`-gated),
    # so on 0.8.x rsa cannot be removed without forking sqlx.
    # FIX PATH (real, not yet done): sqlx 0.9.0 is released and feature-gates rsa
    # (`sqlx-mysql/rsa = [dep:rand, dep:rsa]`); bumping 0.8 -> 0.9 and OMITTING
    # the `rsa` feature drops the crate from the tree entirely — our MariaDB is
    # localhost-only over a Unix socket / TLS, so the caching_sha2_password
    # RSA-password-encrypt path is never exercised at runtime anyway. Deferred
    # only because 0.8 -> 0.9 is a breaking, multi-service migration. Residual
    # until then is near-zero: encrypt-side only, localhost DB, and the MySQL
    # connection password is the service's OWN (OPAQUE-PAKE runs above the DB
    # layer), never a user's. See known-gaps G-24.
    "RUSTSEC-2023-0071",
    # NB: RUSTSEC-2026-0124 (libcrux-chacha20poly1305 0.0.7 overlong-buffer
    # panic) is FIXED, not ignored — the vendored `hpke-rs-libcrux` fork in
    # `crates/vendor/` ([patch.crates-io]) pulls libcrux-chacha20poly1305
    # 0.0.8. See known-gaps G-23.
]

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    # BSD Zero Clause — OSI-approved, FSF-free, more permissive than BSD-2/3
    # (no attribution requirement; effectively public domain). Reaches us via
    # `quoted_printable`, a transitive dep of `lettre` (ADR-0018 factor (d)
    # SMTP email adapter).
    "0BSD",
    "ISC",
    "MPL-2.0",
    "Unicode-DFS-2016",
    "Unicode-3.0",
    "Zlib",
    "CC0-1.0",
    "BSL-1.0",
    "AGPL-3.0",
    "AGPL-3.0-or-later",
    # GPL family — compatible with AGPL-3.0-or-later (AGPL inherits GPL terms).
    # Reaches us via:
    #   * equix (Tor Project)         — Phase 1.1e PoW anti-spam
    #   * tor-rtcompat / hashx (deps) — Phase 5 anti-censorship transports
    "LGPL-3.0-only",
    "OpenSSL",
    # CDLA-Permissive-2.0 — Community Data License Agreement (permissive).
    # Used by webpki-roots (Mozilla CA trust store) — this is data, not
    # code. FSF-considered free, OSI-style permissive. Reaches us
    # transitively through sqlx-core.
    "CDLA-Permissive-2.0",
]
confidence-threshold = 0.9
exceptions = []

[bans]
multiple-versions = "warn"
wildcards = "deny"
deny = []
skip = []
skip-tree = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
