[graph]
all-features = false

[advisories]
db-urls = ["https://github.com/rustsec/advisory-db"]
yanked = "deny"
# Unmaintained / informational notices are surfaced but do not block CI.
# Track upstream and ignore individual advisories via `ignore = []` when
# a dep stays stuck.
unmaintained = "workspace"
ignore = [
    # NB: RUSTSEC-2025-0141 (bincode 1.3.x unmaintained) + RUSTSEC-2024-0436
    # (paste 1.0.x unmaintained) are FIXED, not ignored — G-25 closed both by
    # the uniffi 0.28 -> 0.31 bump (`crates/lakko-ffi-uniffi`). uniffi_macros
    # dropped bincode and uniffi_core / uniffi_bindgen dropped paste (replaced
    # by the maintained `pastey` fork) at 0.29+, so neither crate is in the
    # tree (`cargo tree -i bincode` / `-i paste` both empty). See known-gaps
    # G-25.
    # NB: RUSTSEC-2023-0071 (rsa 0.9.x Marvin Attack) is FIXED, not ignored —
    # G-24 closed by the sqlx 0.8 -> 0.9 bump, which feature-gates rsa
    # (`sqlx-mysql/rsa`); we omit the `rsa` feature, so the crate is no longer
    # in the tree (`cargo tree -i rsa` is empty). See known-gaps G-24.
    # NB: RUSTSEC-2026-0124 (libcrux-chacha20poly1305 0.0.7 overlong-buffer
    # panic) is FIXED, not ignored — the vendored `hpke-rs-libcrux` fork in
    # `crates/vendor/` ([patch.crates-io]) pulls libcrux-chacha20poly1305
    # 0.0.8. See known-gaps G-23.
    # NB: RUSTSEC-2024-0384 (instant 0.1.x unmaintained) is NOT in this list
    # because cargo-deny does not traverse it on the host target — it reaches
    # us only on the wasm target (openmls 0.8.1 -> fluvio-wasm-timer ->
    # parking_lot 0.11 -> instant). It stays an open documented accept until
    # openmls ships a release dropping fluvio-wasm-timer (0.9 unreleased as of
    # 2026-06-23). See known-gaps G-25.
]

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    # BSD Zero Clause — OSI-approved, FSF-free, more permissive than BSD-2/3
    # (no attribution requirement; effectively public domain). Reaches us via
    # `quoted_printable`, a transitive dep of `lettre` (ADR-0018 factor (d)
    # SMTP email adapter).
    "0BSD",
    "ISC",
    "MPL-2.0",
    "Unicode-DFS-2016",
    "Unicode-3.0",
    "Zlib",
    "CC0-1.0",
    "BSL-1.0",
    "AGPL-3.0",
    "AGPL-3.0-or-later",
    # GPL family — compatible with AGPL-3.0-or-later (AGPL inherits GPL terms).
    # Reaches us via:
    #   * equix (Tor Project)         — Phase 1.1e PoW anti-spam
    #   * tor-rtcompat / hashx (deps) — Phase 5 anti-censorship transports
    "LGPL-3.0-only",
    "OpenSSL",
    # CDLA-Permissive-2.0 — Community Data License Agreement (permissive).
    # Used by webpki-roots (Mozilla CA trust store) — this is data, not
    # code. FSF-considered free, OSI-style permissive. Reaches us
    # transitively through sqlx-core.
    "CDLA-Permissive-2.0",
]
confidence-threshold = 0.9
exceptions = []

[bans]
multiple-versions = "warn"
wildcards = "deny"
deny = []
skip = []
skip-tree = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
