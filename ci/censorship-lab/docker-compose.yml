# G5-7 — censorship-lab compose stack.
#
# Brings up the SNI observer on `127.0.0.1:8443` and
# mounts its log file into the host at
# `./logs/observed.jsonl` so the integration test
# (`crates/lakko-transport/tests/sni_observer_e2e.rs`)
# can tail it without exec-ing into the container.
#
# Subsequent G5-7 sub-sprints (TSPU active probing,
# GFW packet-drop, IR throttle — see `README.md`)
# layer additional observer / filter sidecars onto the
# same compose so the matrix grows by appending
# services rather than forking the stack.

services:
  sni-observer:
    build:
      context: ./sni-observer
      dockerfile: Dockerfile
    container_name: lakko-censorship-sni-observer
    restart: "no"
    environment:
      LAKKO_SNI_BIND: "0.0.0.0:8443"
      LAKKO_SNI_LOG: "/var/log/sni-observer/observed.jsonl"
      # G5-7-gfw-string — run the observer as a GFW-style SNI
      # string-match censor. `observer_blocks_a_listed_sni_and_allows_others`
      # connects with a SNI in this list (-> blocked:true) + one outside it
      # (-> blocked:false), and a Shadowsocks non-TLS flow (observed_sni null)
      # is blocked:false (the evasion). Exact + suffix forms.
      LAKKO_SNI_BLOCKLIST: "blocked-target.example,*.evil.example"
      RUST_LOG: "info,sni_observer=debug"
    ports:
      # Pinned to 127.0.0.1 so a stray Internet host
      # never sees an open observer on the runner.
      - "127.0.0.1:8443:8443"
      # G5-7-transport-matrix-iter3 — UDP/8443 for QUIC
      # Initial observations (MASQUE / WebTransport).
      # The observer binds the same port on both
      # transports; consumers disambiguate via the
      # `transport: "tcp"|"udp"` JSONL field.
      - "127.0.0.1:8443:8443/udp"
    volumes:
      # Host bind-mount. The compose `up` step in CI
      # creates `./logs/` first so the volume points at
      # a real (empty) file the container's non-root
      # user can write to.
      - ./logs:/var/log/sni-observer
    healthcheck:
      # `nc -z` against the observer's own bind. The
      # Dockerfile installs `netcat-openbsd` precisely
      # so this check is available without needing
      # bash / /dev/tcp shenanigans.
      test:
        - CMD-SHELL
        - "nc -z 127.0.0.1 8443"
      interval: 1s
      timeout: 2s
      retries: 15
      start_period: 2s
