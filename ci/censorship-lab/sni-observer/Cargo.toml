# `sni-observer` — passive TLS-SNI observer used by the
# G5-7 censorship lab. NOT a workspace member (lives
# under `ci/`, gitignored from `cargo metadata` via the
# workspace exclude rule) so the production binaries
# don't take a dep on a CI fixture and so a CI-only bump
# of `tokio` here doesn't ripple through `services/sfu`.

[package]
name        = "sni-observer"
version     = "0.0.0"
edition     = "2021"
publish     = false
description = "Censorship-lab fixture — reads a TLS ClientHello off TCP, extracts SNI, logs (epoch_ms, sni) to a file."

# Explicit empty `[workspace]` keeps cargo from rolling
# this crate into the parent workspace at
# `/Users/.../lakko/Cargo.toml`. The CI fixture has a
# different MSRV story (we deliberately do not pin
# `rust-toolchain.toml` here so a contributor on a
# slightly older Rust still gets a working observer).
[workspace]

[[bin]]
name = "sni-observer"
path = "src/main.rs"

[dependencies]
tokio   = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "time", "sync", "fs"] }
anyhow  = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# G5-7-fingerprint — JA3 + JA4 fingerprint extraction.
# md-5 for the JA3 MD5(raw-string) hash (Salesforce 2017 spec),
# sha2 for the JA4 SHA-256-truncated-to-12-hex hashes (FoxIO
# 2023 spec). Both are RustCrypto crates, pure-Rust, no system
# OpenSSL dep. The observer crate is `#![forbid(unsafe_code)]`
# — RustCrypto stays inside that posture.
md-5 = "0.10"
sha2 = "0.10"

# G5-7-transport-matrix-iter3 — QUIC Initial packet decryption
# per RFC 9001 §5.2. The observer's UDP path decrypts the
# first inbound datagram to extract the TLS ClientHello
# wrapped in a CRYPTO frame.
#   aes      — AES-128-ECB for the header-protection mask.
#   aes-gcm  — AES-128-GCM for the AEAD-protected packet
#              payload.
#   hkdf     — HKDF-Extract + HKDF-Expand-Label for the
#              initial-keys derivation. RustCrypto, no
#              unsafe.
aes = "0.8"
aes-gcm = "0.10"
hkdf = "0.12"

[dev-dependencies]
# `hex` is only used by the RFC 9001 §A.2 test-vector
# assertions in `quic_initial.rs`; the production code path
# does not need it.
hex = "0.4"
