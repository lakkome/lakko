# Recovery + KT-log live e2e — brings up the minimal stack the
# `services/discovery/tests/recovery_kt_e2e.rs` driver needs:
#
#   - `transparency-db` / `discovery-db` — one MariaDB per service (each
#     service tracks its own `_sqlx_migrations`; sharing a DB would make them
#     see each other's migrations as missing).
#   - `transparency` — the KT log; verifies + rejects an unauthorised leaf
#     (`LAKKO_TRANSPARENCY_REQUIRE_LEAF_AUTH=1`, G-30 #2 / ADR-0019).
#   - `discovery` — fronts the identity-bundle upload; on a key change it
#     best-effort appends to `transparency` (+ a fast reconciler sweep).
#   - `witness` / `witness2` / `witness3` — the ADR-0039 K-of-N witness QUORUM:
#     three independent instances of `services/witness`, each its own DB + its
#     own cosign secret, all pinning the SAME operator key. transparency fans
#     out to all three; the driver pins the 3 keys + a threshold of 2.
#
# NO auth service: discovery's upload is gated by a shared-secret session
# token, so the driver mints it directly (see the test's `session_secret()`).
#
# The driver runs on the HOST and connects to the published ports
# (127.0.0.1:8084 discovery, 127.0.0.1:8087 transparency, 127.0.0.1:8088 /
# :8089 / :8090 the three witnesses). The build context is the workspace root
# (`../..`) so each Dockerfile's `COPY . .` sees every workspace crate.

services:
  transparency-db:
    image: mariadb:11
    container_name: lakko-recovery-e2e-transparency-db
    restart: "no"
    environment:
      MARIADB_ROOT_PASSWORD: rootpw
      MARIADB_DATABASE: lakko_transparency
      MARIADB_USER: lakko
      MARIADB_PASSWORD: devpass
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 2s
      timeout: 3s
      retries: 20
      start_period: 5s

  discovery-db:
    image: mariadb:11
    container_name: lakko-recovery-e2e-discovery-db
    restart: "no"
    environment:
      MARIADB_ROOT_PASSWORD: rootpw
      MARIADB_DATABASE: lakko_discovery
      MARIADB_USER: lakko
      MARIADB_PASSWORD: devpass
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 2s
      timeout: 3s
      retries: 20
      start_period: 5s

  # ADR-0020 + ADR-0039 — the independent witness co-signers, a 2-of-3 K-of-N
  # QUORUM. Three instances of the SAME `services/witness` binary (K-of-N needs
  # no witness-service code change — the fan-out + threshold live in transparency
  # + the client). Each has its OWN DB + its OWN cosign secret, but all pin the
  # SAME operator key (the fixed-seed fixture below). transparency fans out to
  # all three via the LIST vars (LAKKO_TRANSPARENCY_WITNESS_URLS +
  # _COSIGN_SECRETS) and serves the bundle; the driver pins the 3 keys + demands
  # a threshold of 2 (`verify_witness_quorum`). In production the witnesses MUST
  # run in SEPARATE trust domains (the collusion-resistance is a deploy property,
  # ADR-0039 caveat); here they are co-located for the test.
  witness-db:
    image: mariadb:11
    container_name: lakko-recovery-e2e-witness-db
    restart: "no"
    environment:
      MARIADB_ROOT_PASSWORD: rootpw
      MARIADB_DATABASE: lakko_witness
      MARIADB_USER: lakko
      MARIADB_PASSWORD: devpass
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 2s
      timeout: 3s
      retries: 20
      start_period: 5s

  witness:
    build:
      context: ../..
      dockerfile: services/witness/Dockerfile
    container_name: lakko-recovery-e2e-witness
    restart: "no"
    depends_on:
      witness-db:
        condition: service_healthy
    environment:
      LAKKO_BIND: "0.0.0.0:8088"
      LAKKO_WITNESS_DATABASE_URL: "mysql://lakko:devpass@witness-db:3306/lakko_witness"
      # The PINNED operator key — base64 of the Ed25519 verifying key derived
      # from the transparency container's fixed seed (0xAB x 32). Pinned by the
      # `fixed_seed_env_override_derives_deterministic_key` test.
      LAKKO_WITNESS_OPERATOR_PUBKEY: "JIrL26+eBQGW3nBL6i1odw5RkVDRA7WH2uLZytU92TA="
      # base64(16x 0x77). Shared with transparency (presented as a Bearer on
      # POST /witness/cosign).
      LAKKO_WITNESS_COSIGN_SECRET: "d3d3d3d3d3d3d3d3d3d3dw=="
      RUST_LOG: "info,lakko_svc_witness=debug"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8088/ready || exit 1"]
      interval: 2s
      timeout: 3s
      retries: 20
      start_period: 3s
    ports:
      - "127.0.0.1:8088:8088"

  witness2-db:
    image: mariadb:11
    container_name: lakko-recovery-e2e-witness2-db
    restart: "no"
    environment:
      MARIADB_ROOT_PASSWORD: rootpw
      MARIADB_DATABASE: lakko_witness2
      MARIADB_USER: lakko
      MARIADB_PASSWORD: devpass
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 2s
      timeout: 3s
      retries: 20
      start_period: 5s

  witness2:
    build:
      context: ../..
      dockerfile: services/witness/Dockerfile
    container_name: lakko-recovery-e2e-witness2
    restart: "no"
    depends_on:
      witness2-db:
        condition: service_healthy
    environment:
      LAKKO_BIND: "0.0.0.0:8088"
      LAKKO_WITNESS_DATABASE_URL: "mysql://lakko:devpass@witness2-db:3306/lakko_witness2"
      # The SAME pinned operator key as witness (base64 of the Ed25519 verifying
      # key derived from the transparency container's fixed seed, 0xAB x 32).
      LAKKO_WITNESS_OPERATOR_PUBKEY: "JIrL26+eBQGW3nBL6i1odw5RkVDRA7WH2uLZytU92TA="
      # base64(16x 0x88) — DISTINCT per witness. The i-th of transparency's
      # LAKKO_TRANSPARENCY_WITNESS_COSIGN_SECRETS.
      LAKKO_WITNESS_COSIGN_SECRET: "iIiIiIiIiIiIiIiIiIiIiA=="
      RUST_LOG: "info,lakko_svc_witness=debug"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8088/ready || exit 1"]
      interval: 2s
      timeout: 3s
      retries: 20
      start_period: 3s
    ports:
      - "127.0.0.1:8089:8088"

  witness3-db:
    image: mariadb:11
    container_name: lakko-recovery-e2e-witness3-db
    restart: "no"
    environment:
      MARIADB_ROOT_PASSWORD: rootpw
      MARIADB_DATABASE: lakko_witness3
      MARIADB_USER: lakko
      MARIADB_PASSWORD: devpass
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 2s
      timeout: 3s
      retries: 20
      start_period: 5s

  witness3:
    build:
      context: ../..
      dockerfile: services/witness/Dockerfile
    container_name: lakko-recovery-e2e-witness3
    restart: "no"
    depends_on:
      witness3-db:
        condition: service_healthy
    environment:
      LAKKO_BIND: "0.0.0.0:8088"
      LAKKO_WITNESS_DATABASE_URL: "mysql://lakko:devpass@witness3-db:3306/lakko_witness3"
      # The SAME pinned operator key as witness (0xAB x 32 derived).
      LAKKO_WITNESS_OPERATOR_PUBKEY: "JIrL26+eBQGW3nBL6i1odw5RkVDRA7WH2uLZytU92TA="
      # base64(16x 0x99) — DISTINCT per witness.
      LAKKO_WITNESS_COSIGN_SECRET: "mZmZmZmZmZmZmZmZmZmZmQ=="
      RUST_LOG: "info,lakko_svc_witness=debug"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8088/ready || exit 1"]
      interval: 2s
      timeout: 3s
      retries: 20
      start_period: 3s
    ports:
      - "127.0.0.1:8090:8088"

  transparency:
    build:
      context: ../..
      dockerfile: services/transparency/Dockerfile
    container_name: lakko-recovery-e2e-transparency
    restart: "no"
    depends_on:
      transparency-db:
        condition: service_healthy
      witness:
        condition: service_healthy
      witness2:
        condition: service_healthy
      witness3:
        condition: service_healthy
    environment:
      LAKKO_BIND: "0.0.0.0:8087"
      LAKKO_TRANSPARENCY_DATABASE_URL: "mysql://lakko:devpass@transparency-db:3306/lakko_transparency"
      # base64(16x 0x42). Shared with discovery (presented as a Bearer on
      # the append POST). >= 16 bytes after decode.
      LAKKO_TRANSPARENCY_APPEND_SECRET: "QkJCQkJCQkJCQkJCQkJCQg=="
      # G-30 #2: refuse a new binding with no leaf_auth (the e2e's step-5
      # negative depends on this).
      LAKKO_TRANSPARENCY_REQUIRE_LEAF_AUTH: "1"
      # ADR-0020: a FIXED operator seed (0xAB x 32) so the witness can pin the
      # derived verifying key (dev / e2e only).
      LAKKO_TRANSPARENCY_OPERATOR_SEED_HEX: "abababababababababababababababababababababababababababababababab"
      # ADR-0039 — arm the K-of-N witness fan-out toward all THREE witnesses via
      # the LIST vars (comma-separated, 1:1 positional: the i-th URL is
      # bearer-authed with the i-th secret). base64(16x 0x77 / 0x88 / 0x99).
      LAKKO_TRANSPARENCY_WITNESS_URLS: "http://witness:8088,http://witness2:8088,http://witness3:8088"
      LAKKO_TRANSPARENCY_WITNESS_COSIGN_SECRETS: "d3d3d3d3d3d3d3d3d3d3dw==,iIiIiIiIiIiIiIiIiIiIiA==,mZmZmZmZmZmZmZmZmZmZmQ=="
      RUST_LOG: "info,lakko_svc_transparency=debug"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8087/ready || exit 1"]
      interval: 2s
      timeout: 3s
      retries: 20
      start_period: 3s
    ports:
      - "127.0.0.1:8087:8087"

  discovery:
    build:
      context: ../..
      dockerfile: services/discovery/Dockerfile
    container_name: lakko-recovery-e2e-discovery
    restart: "no"
    depends_on:
      discovery-db:
        condition: service_healthy
      transparency:
        condition: service_healthy
    environment:
      LAKKO_BIND: "0.0.0.0:8084"
      LAKKO_DISCOVERY_DATABASE_URL: "mysql://lakko:devpass@discovery-db:3306/lakko_discovery"
      # MUST match the driver's default session secret (base64(32x 0x5e)).
      LAKKO_SESSION_TOKEN_SECRET: "Xl5eXl5eXl5eXl5eXl5eXl5eXl5eXl5eXl5eXl5eXl4="
      # Arm the KT-log append integration toward the transparency container.
      LAKKO_TRANSPARENCY_URL: "http://transparency:8087"
      LAKKO_TRANSPARENCY_APPEND_SECRET: "QkJCQkJCQkJCQkJCQkJCQg=="
      # Fast reconciler so a best-effort-missed append lands within a poll
      # cycle.
      LAKKO_DISCOVERY_TRANSPARENCY_RECONCILE_SECS: "2"
      RUST_LOG: "info,lakko_svc_discovery=debug"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8084/ready || exit 1"]
      interval: 2s
      timeout: 3s
      retries: 20
      start_period: 3s
    ports:
      - "127.0.0.1:8084:8084"
