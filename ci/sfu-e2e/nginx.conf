# Static-content nginx config — serves the fixture JWKS at
# `/.well-known/jwks.json` over plain HTTP. Used only by
# the G3-4 E2E gate; never deployed to production.

worker_processes 1;

events {
    worker_connections 64;
}

http {
    sendfile on;
    keepalive_timeout 30;

    # Single vhost on port 8080. We don't TLS-terminate
    # inside the compose stack — the production posture
    # (nginx-on-host fronting the SFU + auth) is exercised
    # by the deployment integration tests under `infra/`,
    # not here.
    server {
        listen 8080 default_server;
        server_name _;
        access_log off;

        location = /.well-known/jwks.json {
            # The compose service mounts the fixture file
            # at `/srv/jwks.json`. Always JSON, never an
            # error.
            default_type application/json;
            alias /srv/jwks.json;
        }

        location / {
            return 404;
        }
    }
}
