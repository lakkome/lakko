[package]
name = "lakko-ffi-wasm"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false
description = "wasm-bindgen surface for Web and Tauri clients — mirror of UniFFI surface (Phase 1.13)"

[lib]
# `cdylib` for wasm-pack output; `rlib` so doctests / unit tests can
# build on the host without a separate target invocation.
crate-type = ["cdylib", "rlib"]

[lints]
workspace = true

[dependencies]
lakko-mls.workspace = true
# ADR-0053 - the request proof a claimed DS journal requires (the client
# half: per-epoch group signer, mailbox signer, claim bodies).
lakko-ds-proof.workspace = true
# ADR-0054 S3 - the client half of the anonymous rate-limit tokens (blind,
# finalize with the DLEQ check, header encoding).
lakko-anon-token.workspace = true
lakko-contacts.workspace = true
# Presentation rules the three clients share — the order of the one
# conversation list and the gate in front of the discovery lookup
# (docs/ux/navigation.md). One copy, reached from two FFI surfaces.
lakko-ui-rules.workspace = true
# Phase 4 G4-2-crypto — channel post composer + decoder.
# The web client uses this to produce signed encrypted
# ChannelPosts instead of raw bytes in the publish form.
lakko-channels.workspace = true
lakko-sync.workspace = true
lakko-push.workspace = true
lakko-presence.workspace = true
# Phase 1.19b — attachment encryption + JSON envelope wire format.
lakko-attachments.workspace = true
# Phase 2a1c — encrypted backup envelope (Argon2id KEK from the
# recovery phrase + ChaCha20-Poly1305 AEAD) and the payload codec
# the web client uploads to `services/storage`'s per-account
# backup endpoint.
lakko-backup.workspace = true
# Phase 1.21b — Shamir's Secret Sharing (GF(256) split / combine
# + human-typable share encode / decode) for the social-recovery
# flow on the Web client.
lakko-shamir.workspace = true
# OPAQUE-PAKE client surface — wraps `RegistrationSession` and
# `LoginSession` into wasm-bindgen classes for `apps/web`.
lakko-auth-client.workspace = true
# Equix proof-of-work solver — exposed as a JS class so the web
# client can produce the `pow` field every expensive auth endpoint
# demands.
lakko-pow.workspace = true
# BIP39 mnemonic — exposed as a JS class for the signup-time
# recovery passphrase (1.16c3c1) and the future recover-from-words
# flow (1.16c3c3).
lakko-mnemonic.workspace = true
# VOPRF client — username discovery. Exposes the OPRF blind/finalize
# dance + the canonical username-normalisation helper (1.16d1).
lakko-discovery-client.workspace = true
# Base64 framing for the PoW JS surface (binary seed/nonce/solution
# fields → base64 strings on the JSON request body). The auth-client
# surface uses base64 internally; we don't re-export that, so we
# pull our own dep here.
base64 = "0.22"
# `lakko-storage` is included for the in-memory + encrypted-value
# layers; the rusqlite-backed `SqliteStore` it ships does not build
# on wasm32 (requires libsqlite C source) and is suppressed from the
# wasm-bindgen surface in `storage.rs`. IndexedDB persistence lands
# in 1.13c.
lakko-storage.workspace = true
# Re-exposed for `Hlc`, `Draft`, etc. that take `lakko_crypto::secret::SecretBytes`.
lakko-crypto.workspace = true
# G-4 (ADR-0007 §6) — identity supersession proof surface (sign on
# rotation, verify on a peer's pubkey change).
lakko-transparency.workspace = true
# ADR-0036 — genesis-attestation client verify (`verify_genesis_binding`)
# for the first-observation anti-squatting gate (G-30 finding 2).
lakko-attest.workspace = true
# Phase 2a3d8 — `HistoryBundle` / `SealedBundle` generated types
# + prost runtime for the inner-bytes re-encode in
# `sealHistoryBundle` / `openHistoryBundle`.
lakko-proto.workspace = true
prost = "0.13"
# Phase 3a4 — call signaling typed classes + SFrame keying
# free-function surface for the web client.
lakko-calls.workspace = true
# SFU multi-party (subsprint 1c) — shared SFU signaling wire
# frames for the web client (parse ServerFrame, compose
# ClientFrame, payload base64url helpers).
lakko-sfu-proto.workspace = true
# Phase 3b4 — call-admission JWT mint + verify shared with
# `services/auth`. Same shape Swift / Kotlin clients get via
# UniFFI.
lakko-call-jwt.workspace = true

# JS bindings.
wasm-bindgen = "0.2"
js-sys = "0.3"

# `getrandom` is pulled in transitively by every crypto dep; on
# wasm32-unknown-unknown it needs the `js` feature so the random
# source is `crypto.getRandomValues` rather than failing at runtime.
# This is the standard Rust + wasm pattern.
#
# `openmls` likewise needs its own `js` feature on wasm32 (it uses
# `fluvio_wasm_timer` for `SystemTime` access). Cargo unifies
# features across the dep graph, so adding the feature here flows
# through to the same openmls instance that `lakko-mls` consumes.
[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.2", features = ["js"] }
openmls = { version = "0.8", features = ["js"], default-features = false }

# Phase 1.16f3 — wasm-bindgen-test runner. Tests in
# `src/wasm_tests.rs` are gated `#[cfg(target_arch = "wasm32")]`
# and run via `wasm-pack test --node` (or any browser driver).
# Host-side `cargo test -p lakko-ffi-wasm` is unaffected — those
# tests sit in `#[cfg(test)]` modules with regular `#[test]`
# attributes, while the wasm-bindgen-test ones use
# `#[wasm_bindgen_test]`.
[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test = "0.3"

# Phase 1.16f1 — bundle-size pass. wasm-pack defaults to
# `wasm-opt -O` (Binaryen's balanced level); we switch to `-Oz`
# (size-only optimisation) which shaves another ~5-15 % off the
# final bytes. The runtime regression is irrelevant for our
# workload — the hot path is the underlying crypto crates'
# generated code, which `[profile.release]` already builds at
# `opt-level = 3`.
#
# `--enable-mutable-globals` is a safety belt: some of our deps
# emit mutable-globals instructions, and forgetting to flag the
# feature would cause Binaryen to reject the input. The proposal
# is in every evergreen browser since 2018.
[package.metadata.wasm-pack.profile.release]
wasm-opt = ['-Oz', '--enable-mutable-globals']
