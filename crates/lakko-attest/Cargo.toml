[package]
name = "lakko-attest"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false
description = "Action attestation (G-13, ADR-0015) — a compact Ed25519-signed, domain-separated proof that an account completed a passkey ceremony for a specific action, verifiable by peer devices."

[lints]
workspace = true

[dependencies]
lakko-crypto.workspace = true
thiserror.workspace = true
# ADR-0097: the supporters list checks every name with the ADR-0048
# display-name rule, defined once in `lakko-contacts` (which depends only on
# `lakko-crypto`, `thiserror` and `tracing`, so no cycle and nothing new in
# the tree).
lakko-contacts.workspace = true

[dev-dependencies]
proptest = "1"

