[package]
name = "lakko-attest-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

# Opt out of the parent workspace — cargo-fuzz crates require nightly and
# libfuzzer-sys, which we don't want as a workspace-wide dep.
[workspace]

[dependencies]
libfuzzer-sys = "0.4"
lakko-attest = { path = ".." }

# `ActionAttestation::open` is the device-removal attestation parser (ADR-0015):
# a fixed-layout 121-byte Ed25519-signed blob that arrives ALONGSIDE a peer's
# DeviceGroup Remove commit, so a malformed envelope is fully attacker-controlled
# and reaches this bounded parser before any state is consulted. Any panic /
# overflow / slice-out-of-bounds here is a vulnerability.
[[bin]]
name = "attestation_open"
path = "fuzz_targets/attestation_open.rs"
test = false
doc = false
bench = false

# `GenesisAttestation::open` is the auth-attested genesis parser (ADR-0036): a
# fixed-layout 153-byte Ed25519-signed blob served as a bundle sidecar field that
# a malicious discovery / Delivery Service can craft, so a malformed envelope is
# fully attacker-controlled and reaches this bounded parser before any state is
# consulted. Any panic / overflow / slice-out-of-bounds here is a vulnerability.
[[bin]]
name = "genesis_attestation_open"
path = "fuzz_targets/genesis_attestation_open.rs"
test = false
doc = false
bench = false

# `BackupHead::open` is the auth-signed backup-head parser (ADR-0037): a
# fixed-layout 129-byte Ed25519-signed blob that rides as a prefix of the storage
# backup blob (CONTAINER_TAG | head | envelope), which a malicious storage tier
# can craft, so a malformed envelope is fully attacker-controlled and reaches this
# bounded parser before any state is consulted. Any panic / overflow /
# slice-out-of-bounds here is a vulnerability.
[[bin]]
name = "backup_head_open"
path = "fuzz_targets/backup_head_open.rs"
test = false
doc = false
bench = false

# `ReleaseManifest::open` is the signed update-notice parser (ADR-0038): a
# fixed-layout 89-byte Ed25519-signed blob (global, not account-bound) fetched
# from a host a malicious network could tamper, so a malformed envelope is fully
# attacker-controlled and reaches this bounded parser before any state is
# consulted. Any panic / overflow / slice-out-of-bounds here is a vulnerability.
[[bin]]
name = "release_manifest_open"
path = "fuzz_targets/release_manifest_open.rs"
test = false
doc = false
bench = false

# `UsernameCertificate::open` is the discovery-signed username certificate
# parser (ADR-0060): a fixed-layout 153-byte Ed25519-signed blob carried opaquely
# inside a profile envelope any group member, channel subscriber or stranger can
# craft, so a malformed envelope is fully attacker-controlled and reaches this
# bounded parser before any state is consulted. Any panic / overflow /
# slice-out-of-bounds here is a vulnerability.
[[bin]]
name = "username_cert_open"
path = "fuzz_targets/username_cert_open.rs"
test = false
doc = false
bench = false

# `KeyResetAttestation::open` is the key-reset attestation parser (ADR-0073): a
# fixed-layout 177-byte Ed25519-signed blob posted to discovery's identity
# upload and to the Delivery Service's journal reset by whoever holds a session
# or a journal id, and read back by a client from its own persisted state, so
# a malformed envelope is fully attacker-controlled and reaches this bounded
# parser before any state is consulted. Any panic / overflow /
# slice-out-of-bounds here is a vulnerability.
[[bin]]
name = "key_reset_attestation_open"
path = "fuzz_targets/key_reset_attestation_open.rs"
test = false
doc = false
bench = false

# `AccountStatement` is the client-signed account-key statement (ADR-0074): a
# fixed-layout 138-byte Ed25519-signed blob sent as a request body field to
# auth and as a request header to discovery by anyone, so a malformed envelope
# is fully attacker-controlled and reaches the bounded parser and the verifier
# before any state is consulted. Any panic / overflow / slice-out-of-bounds
# here is a vulnerability.
[[bin]]
name = "account_statement_open"
path = "fuzz_targets/account_statement_open.rs"
test = false
doc = false
bench = false

# `HandleCertificate` is discovery's signature binding a group's or channel's
# @name to its handle key (ADR-0087 section 3): a fixed-layout 169-byte blob
# relayed opaquely by any group member inside a conversation-handle envelope,
# so a malformed certificate reaches the bounded parser before any state is
# consulted. Any panic / slice-out-of-bounds here is a vulnerability.
[[bin]]
name = "handle_cert_open"
path = "fuzz_targets/handle_cert_open.rs"
test = false
doc = false
bench = false

# The donation statements (docs/ux/donations.md section 3): a payment method
# or its phone number, signed offline and served by discovery, which a hostile
# operator controls, so a malformed statement is fully attacker-controlled and
# reaches the length-prefixed parsers before anything is shown. Any panic /
# slice-out-of-bounds / oversized allocation here is a vulnerability.
[[bin]]
name = "donation_open"
path = "fuzz_targets/donation_open.rs"
# `SupportersList` is the backer-name list signed by the release publisher key
# (ADR-0097 section 2), fetched from a static host, so a tampered file reaches
# the bounded parser before anything is shown. Any panic / slice-out-of-bounds
# / oversized allocation here is a vulnerability.
[[bin]]
name = "supporters_list_open"
path = "fuzz_targets/supporters_list_open.rs"
test = false
doc = false
bench = false
