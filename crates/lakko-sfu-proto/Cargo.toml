[package]
name = "lakko-sfu-proto"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false
description = "Lakko-native SFU signaling wire frames — shared between services/sfu and the client FFI (SFU multi-party arc, subsprint 1)"

[lints]
workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
base64 = "0.22"
# BLAKE3 for the per-call peer tag (ADR-0021) — a domain-separated,
# length-framed hash of (call_id, account_id) the SFU emits and the
# clients re-derive over their contacts. Same `blake3` major the wider
# workspace already pulls via `lakko-crypto`; declared here so the one
# canonical derivation lives next to the `PeerSnapshot` type that carries
# the tag (the SFU + all three clients compute byte-identical bytes).
blake3 = "1"
