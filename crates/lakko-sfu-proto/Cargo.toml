[package]
name = "lakko-sfu-proto"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false
description = "Lakko-native SFU signaling wire frames — shared between services/sfu and the client FFI (SFU multi-party arc, subsprint 1)"

[lints]
workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
base64 = "0.22"
# BLAKE3 for the room id (ADR-0078 section 2): one definition of
# `room = BLAKE3_derive_key("lakko/sfu/room/v1", call_id)` that auth's
# tests, the SFU's tests and all three clients (through the FFI) share.
# Same `blake3` major the wider workspace already pulls via `lakko-crypto`.
blake3 = "1"
