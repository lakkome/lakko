[package]
name = "lakko-vault"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false
description = "The conversation vault (ADR-0064): key derivations, sealed padded objects, the storage request proof and the bounded codec of saved history; plus the blob delete key (ADR-0065)"

[lints]
workspace = true

[dependencies]
thiserror.workspace = true

# BLAKE3 derive-key, ChaCha20-Poly1305, Ed25519 and the zeroizing secret
# container. The same primitives the rest of the core uses; no new
# cryptography enters here.
lakko-crypto.workspace = true

# Base64url-no-pad (RFC 4648 section 5) for the signature in the storage
# proof header, the same crate and engine `lakko-ds-proof` uses for its
# header.
base64 = "0.22"

[target.'cfg(target_arch = "wasm32")'.dependencies]
# `lakko-crypto` pulls `rand_core`'s `getrandom`, which needs its WebCrypto
# backend on wasm32 (the same pin `lakko-anon-token` and
# `lakko-discovery-client` carry). This crate draws no randomness itself.
getrandom = { version = "0.2", features = ["js"] }

[dev-dependencies]
proptest = "1"
