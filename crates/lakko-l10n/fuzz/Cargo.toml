[package]
name = "lakko-l10n-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

# Opt out of the parent workspace — cargo-fuzz crates require nightly and
# libfuzzer-sys, which we don't want as a workspace-wide dep.
[workspace]

[dependencies]
libfuzzer-sys = "0.4"
lakko-l10n = { path = ".." }

# `accept_bundle` is the signed translation-bundle parser (ADR-0058): the
# bundle is downloaded from a static host a malicious network or operator
# could tamper, so the bytes are attacker-controlled and reach the length /
# layout / signature checks before anything is trusted.
[[bin]]
name = "bundle_accept"
path = "fuzz_targets/bundle_accept.rs"
test = false
doc = false
bench = false

# `Message::parse` + `format` + `check_translation`: the message syntax a
# translation (built in or from an accepted bundle) is written in. A bundle
# string is signed but written by translators; the parser must never panic.
[[bin]]
name = "message_parse"
path = "fuzz_targets/message_parse.rs"
test = false
doc = false
bench = false
