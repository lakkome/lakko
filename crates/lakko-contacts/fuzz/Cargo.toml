[package]
name = "lakko-contacts-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

# Opt out of the parent workspace — cargo-fuzz crates require nightly
# and libfuzzer-sys, which we don't want as a workspace-wide dep.
[workspace]

[dependencies]
libfuzzer-sys = "0.4"
lakko-contacts = { path = ".." }
# The registrar-seed target opens a hostile seal under a fixed X25519 key.
lakko-crypto = { path = "../../lakko-crypto" }

[[bin]]
name = "call_welcome_unwrap"
path = "fuzz_targets/call_welcome_unwrap.rs"
test = false
doc = false
bench = false

