[package]
name = "lakko-contacts-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

# Opt out of the parent workspace — cargo-fuzz crates require nightly
# and libfuzzer-sys, which we don't want as a workspace-wide dep.
[workspace]

[dependencies]
libfuzzer-sys = "0.4"
lakko-contacts = { path = ".." }

[[bin]]
name = "call_welcome_unwrap"
path = "fuzz_targets/call_welcome_unwrap.rs"
test = false
doc = false
bench = false

[[bin]]
name = "call_kp_forward_unwrap"
path = "fuzz_targets/call_kp_forward_unwrap.rs"
test = false
doc = false
bench = false

[[bin]]
name = "incoming_envelope_dispatch"
path = "fuzz_targets/incoming_envelope_dispatch.rs"
test = false
doc = false
bench = false

[[bin]]
name = "contact_request_decode_and_verify"
path = "fuzz_targets/contact_request_decode_and_verify.rs"
test = false
doc = false
bench = false

[[bin]]
name = "call_invite_capability_decode_and_verify"
path = "fuzz_targets/call_invite_capability_decode_and_verify.rs"
test = false
doc = false
bench = false
