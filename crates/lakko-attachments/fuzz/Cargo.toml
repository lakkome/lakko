[package]
name = "lakko-attachments-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

# Opt out of the parent workspace — cargo-fuzz crates require nightly and
# libfuzzer-sys, which we don't want as a workspace-wide dep.
[workspace]

[dependencies]
libfuzzer-sys = "0.4"
lakko-attachments = { path = ".." }

# `parse` is the receiver-side MLS Application message-body decoder: a
# malicious or compromised group member can craft arbitrary envelope bytes,
# which reach the JSON envelope decode + the per-ref base64 decoders on
# receipt. Any panic / overflow / slice-out-of-bounds here is a vulnerability.
[[bin]]
name = "message_body_parse"
path = "fuzz_targets/message_body_parse.rs"
test = false
doc = false
bench = false

# ADR-0092 section 8: the article block format. An article rides in a chat
# envelope any member or publisher writes; the decoder must never panic and
# must accept only canonical bytes.
[[bin]]
name = "article_decode"
path = "fuzz_targets/article_decode.rs"
test = false
doc = false
bench = false

# ADR-0092: the content payload and state snapshot carried by history bundles
# and vault records.
[[bin]]
name = "content_bundle_decode"
path = "fuzz_targets/content_bundle_decode.rs"
test = false
doc = false
bench = false
