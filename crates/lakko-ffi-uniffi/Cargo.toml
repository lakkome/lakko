[package]
name = "lakko-ffi-uniffi"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false
description = "UniFFI bindings — Swift (iOS/iPadOS/macOS/watchOS) and Kotlin (Android) surface"

[lib]
crate-type = ["staticlib", "cdylib", "rlib"]

[lints]
workspace = true

[dependencies]
thiserror.workspace = true
lakko-mls.workspace = true

# `build` powers the `uniffi::setup_scaffolding!()` proc-macro
# the lib uses to register types; `cli` enables
# `uniffi::uniffi_bindgen_main()` in `src/bin/uniffi-bindgen.rs`
# so `just regen-bindings` runs a workspace-pinned bindgen
# instead of a floating `cargo install`. Both feed the same
# 0.28 release — no ABI drift between cdylib and Kotlin / Swift
# generation.
uniffi = { version = "0.28", features = ["build", "cli"] }

[build-dependencies]
uniffi = { version = "0.28", features = ["build"] }

# The crate ships two artefacts: the `cdylib` from `[lib]` above
# (real Swift / Kotlin runtime) plus the `uniffi-bindgen` host
# tool below — codegen only, runs during `just regen-bindings`,
# never ships in a production build.
[[bin]]
name = "uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"
