[package]
name = "lakko-ffi-uniffi"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false
description = "UniFFI bindings — Swift (iOS/iPadOS/macOS/watchOS) and Kotlin (Android) surface"

[lib]
crate-type = ["staticlib", "cdylib", "rlib"]

[lints]
workspace = true

[dependencies]
thiserror.workspace = true
lakko-mls.workspace = true
# OPAQUE-PAKE client surface — wraps `RegistrationSession` and
# `LoginSession` for Swift / Kotlin (mirror of the wasm-bindgen
# surface in `lakko-ffi-wasm/src/auth.rs`). 1.15d1.
lakko-auth-client.workspace = true
# BIP39 24-word mnemonic — for the recovery passphrase shown
# at signup and parsed at recover-from-words.
lakko-mnemonic.workspace = true
# Equix proof-of-work solver — every expensive auth endpoint
# demands a `pow` proof; exposed as a static-only class.
lakko-pow.workspace = true
# VOPRF client — username discovery. The blind/finalize dance +
# the canonical username-normalisation helper. 1.15e1.
lakko-discovery-client.workspace = true
# Contact-request envelope + pseudonym lifecycle. Used by 1.15e2's
# ContactRequest UniFFI surface. Pulls `lakko-crypto` transitively
# for the X25519 / Ed25519 primitive types compose / open_envelope
# need at the boundary.
lakko-contacts.workspace = true
lakko-crypto.workspace = true
# Phase 1.19b — attachment encryption + JSON envelope wire format
# (per-message ChaCha20-Poly1305 CEK + SHA-256 content addressing).
lakko-attachments.workspace = true
# Phase 2a1c — encrypted backup envelope (Argon2id KEK from the
# recovery phrase + ChaCha20-Poly1305 AEAD) and the payload
# codec. Same primitive both iOS and Android clients consume
# through this UniFFI surface.
lakko-backup.workspace = true
# Phase 1.21b — Shamir's Secret Sharing for the social-recovery
# flow (split / combine / encode / decode + GF(256) field ops).
lakko-shamir.workspace = true
# Phase 2a3d8 — `lakko-proto` generated `HistoryBundle` /
# `SealedBundle` types + prost runtime for the inner-bytes
# re-encode in `seal_history_bundle` / `open_history_bundle`.
lakko-proto.workspace = true
prost = "0.13"
# Phase 3a4 — call signaling typed Records + SFrame keying
# free-function surface for Swift / Kotlin callers. Hides
# the proto codec + AEAD plumbing behind plain UniFFI
# Records the platform composes by hand.
lakko-calls.workspace = true
# Phase 3b4 — call-admission JWT mint + verify shared with
# `services/auth`. Client-side surface lets a platform parse
# / self-verify a JWT it just received from
# `POST /call/jwt` and inspect role / expiry before
# presenting it to the SFU.
lakko-call-jwt.workspace = true
# Base64 framing for the PoW surface (seed/nonce/solution
# fields → base64 strings on the JSON request body). Matches
# the wasm surface 1:1.
base64 = "0.22"

# `build` powers the `uniffi::setup_scaffolding!()` proc-macro
# the lib uses to register types; `cli` enables
# `uniffi::uniffi_bindgen_main()` in `src/bin/uniffi-bindgen.rs`
# so `just regen-bindings` runs a workspace-pinned bindgen
# instead of a floating `cargo install`. Both feed the same
# 0.28 release — no ABI drift between cdylib and Kotlin / Swift
# generation.
uniffi = { version = "0.28", features = ["build", "cli"] }

[build-dependencies]
uniffi = { version = "0.28", features = ["build"] }

# The crate ships two artefacts: the `cdylib` from `[lib]` above
# (real Swift / Kotlin runtime) plus the `uniffi-bindgen` host
# tool below — codegen only, runs during `just regen-bindings`,
# never ships in a production build.
[[bin]]
name = "uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"
