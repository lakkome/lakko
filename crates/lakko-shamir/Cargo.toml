[package]
name = "lakko-shamir"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false
description = "Phase 1.21a — Shamir's Secret Sharing over GF(256) for the social-recovery flow"

[lints]
workspace = true

[dependencies]
thiserror.workspace = true

# CSPRNG for the polynomial coefficients. `rand_core` gives the
# OsRng wrapper; the polynomial split needs ~(k-1) random bytes
# per byte of secret, every byte coming from /dev/urandom on host
# or WebCrypto on wasm.
rand_core = { version = "0.6", features = ["getrandom"] }

# Zeroize-on-drop wrapper for the recovered secret bytes. Same
# `zeroize` major version as the rest of the workspace.
zeroize = { version = "1", features = ["zeroize_derive"] }

# Base64 for the wire format — `Share { index, data }` serialises
# to a single `<index_hex>:<base64_data>` string for human-readable
# distribution (QR code, paper print, password manager).
base64 = "0.22"

# `subtle` for constant-time comparison of share indices on
# duplicate detection. The recovery side runs on a trusted device
# with secrets already in scope; side-channel resistance matters
# less here than on the OPRF / OPAQUE paths, but constant-time
# index compare costs nothing.
subtle = "2"

[target.'cfg(target_arch = "wasm32")'.dependencies]
# Pulled in transitively via `rand_core`. Needs `js` to route the
# CSPRNG through WebCrypto on `wasm32-unknown-unknown`.
getrandom = { version = "0.2", features = ["js"] }
