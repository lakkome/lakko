[package]
name = "lakko-shamir-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

# Opt out of the parent workspace — cargo-fuzz crates require nightly and
# libfuzzer-sys, which we don't want as a workspace-wide dep.
[workspace]

[dependencies]
libfuzzer-sys = "0.4"
lakko-shamir = { path = ".." }

# `Share::decode` + `combine` are the social-recovery share parser +
# reconstructor: shares are distributed to and collected from peers /
# guardians, so a malicious holder can submit crafted share strings, which
# reach the `<index>:<base64>` parser and the GF(256) Lagrange interpolation.
# Any panic / overflow / divide-by-zero here is a vulnerability.
[[bin]]
name = "share_decode_combine"
path = "fuzz_targets/share_decode_combine.rs"
test = false
doc = false
bench = false
