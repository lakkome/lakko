[package]
name = "lakko-mnemonic-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

# Opt out of the parent workspace — cargo-fuzz crates require nightly and
# libfuzzer-sys, which we don't want as a workspace-wide dep.
[workspace]

[dependencies]
libfuzzer-sys = "0.4"
lakko-mnemonic = { path = ".." }

# `Mnemonic::from_phrase` / `from_entropy` are the BIP39 recovery parsers.
# `from_phrase` parses a user-typed / device-relayed recovery phrase;
# `from_entropy` rebuilds the phrase from the entropy a passkey-vault blob
# opens to (ADR-0064), which whoever stored the blob chose. Any panic / overflow in these
# parsers is a vulnerability.
[[bin]]
name = "mnemonic_parse"
path = "fuzz_targets/mnemonic_parse.rs"
test = false
doc = false
bench = false

# The email-vault open path (ADR-0067): the sealed blob is served by the
# server in the answer to a mailed code, so its bytes are attacker-chosen.
# Opened under a fixed stretched key (no Argon2id per input); the same bytes
# also drive the recovery-address rule and its idempotence.
[[bin]]
name = "email_vault_open"
path = "fuzz_targets/email_vault_open.rs"
test = false
doc = false
bench = false
