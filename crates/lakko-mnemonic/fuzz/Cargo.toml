[package]
name = "lakko-mnemonic-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

# Opt out of the parent workspace — cargo-fuzz crates require nightly and
# libfuzzer-sys, which we don't want as a workspace-wide dep.
[workspace]

[dependencies]
libfuzzer-sys = "0.4"
lakko-mnemonic = { path = ".." }

# `Mnemonic::from_phrase` / `from_entropy` are the BIP39 recovery parsers.
# `from_phrase` parses a user-typed / device-relayed recovery phrase;
# `from_entropy` rebuilds the phrase from the entropy a passkey-vault blob
# opens to (ADR-0072), which whoever stored the blob chose. Any panic / overflow in these
# parsers is a vulnerability.
[[bin]]
name = "mnemonic_parse"
path = "fuzz_targets/mnemonic_parse.rs"
test = false
doc = false
bench = false

# The recovery-address rule (ADR-0075 section 4): an address typed by a
# person or sent to auth is normalised on both sides, and a normalised
# address must normalise to itself. (Until 2026-11-26 this target was
# `email_vault_open`; the email vault is removed.)
[[bin]]
name = "recovery_email_normalize"
path = "fuzz_targets/recovery_email_normalize.rs"
test = false
doc = false
bench = false

# The another-device recovery payload v3 (ADR-0074, "Joining after a
# rotation"): the plaintext a joining device opens carries the grant, the
# phrase entropy and up to eight predecessor seeds; the row tag is read before
# any key. Bounded, exact-length, canonical.
[[bin]]
name = "recovery_payload_decode"
path = "fuzz_targets/recovery_payload_decode.rs"
test = false
doc = false
bench = false
