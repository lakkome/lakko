[package]
name = "lakko-mls"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false
description = "MLS (RFC 9420) wrapper over OpenMLS for Lakko (groups, exporters, identity)"

[lints]
workspace = true

[dependencies]
thiserror.workspace = true
openmls = "0.8"
openmls_basic_credential = "0.5"
openmls_rust_crypto = "0.5"
openmls_traits = "0.5"
tls_codec = "0.4"
zeroize = "1"
# X25519 keypair for the long-lived HPKE-Base envelope key pinned
# to each Identity (Phase 1.16d3b). The MLS ciphersuite already
# uses X25519 internally for DHKEM, but those keys are MLS-group-
# scoped — the Identity-level X25519 is what `lakko-contacts`
# sealed envelopes target.
lakko-crypto.workspace = true
# G-13 (ADR-0015) — device-removal attestation verification in the apply
# path. `lakko-attest::verify_bound` checks the Ed25519 attestation a peer
# carries alongside a Remove commit before merging it.
lakko-attest.workspace = true
# Phase 2a3b1 — device-pairing QR payload schema lives in
# lakko-proto. The pairing module wraps encode/decode +
# account_id binding around the generated `PairingQr` type.
lakko-proto.workspace = true
prost = "0.13"

[dev-dependencies]
proptest = "1"
