[package]
name = "lakko-mls-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

# Opt out of the parent workspace — cargo-fuzz crates require nightly
# and libfuzzer-sys, which we don't want as a workspace-wide dep.
[workspace]

[dependencies]
libfuzzer-sys = "0.4"
lakko-mls = { path = ".." }

[[bin]]
name = "mls_message"
path = "fuzz_targets/mls_message.rs"
test = false
doc = false
bench = false

[[bin]]
name = "welcome_rendezvous_decode"
path = "fuzz_targets/welcome_rendezvous_decode.rs"
test = false
doc = false
bench = false

[[bin]]
name = "key_package"
path = "fuzz_targets/key_package.rs"
test = false
doc = false
bench = false

[[bin]]
name = "history_placeholder"
path = "fuzz_targets/history_placeholder.rs"
test = false
doc = false
bench = false

[[bin]]
name = "devicegroup_payload"
path = "fuzz_targets/devicegroup_payload.rs"
test = false
doc = false
bench = false

[[bin]]
name = "pairing_qr"
path = "fuzz_targets/pairing_qr.rs"
test = false
doc = false
bench = false

[[bin]]
name = "history_bundle_open"
path = "fuzz_targets/history_bundle_open.rs"
test = false
doc = false
bench = false

[[bin]]
name = "role_table_decode"
path = "fuzz_targets/role_table_decode.rs"
test = false
