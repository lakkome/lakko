[package]
name = "lakko-ds-proof-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

# Opt out of the parent workspace - cargo-fuzz crates require nightly and
# libfuzzer-sys, which we don't want as a workspace-wide dep.
[workspace]

[dependencies]
libfuzzer-sys = "0.4"
lakko-ds-proof = { path = ".." }

# `Proof::parse` is the first thing services/ds runs on the value of a request
# header any client - or anyone - can send, before any key is looked up. The
# bounded, fail-closed parser (five fields, strict decimals, fixed-length
# base64url) must stay panic-free on arbitrary input; the verify that follows
# on a parsed proof must never panic on a hostile epoch or time.
[[bin]]
name = "proof_parse"
path = "fuzz_targets/proof_parse.rs"
test = false
doc = false
bench = false
