[package]
name = "lakko-ds-proof-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

# Opt out of the parent workspace - cargo-fuzz crates require nightly and
# libfuzzer-sys, which we don't want as a workspace-wide dep.
[workspace]

[dependencies]
libfuzzer-sys = "0.4"
lakko-ds-proof = { path = ".." }

# `Proof::parse` is the first thing services/ds runs on the value of a request
# header any client - or anyone - can send, before any key is looked up. The
# bounded, fail-closed parser (five fields, strict decimals, fixed-length
# base64url) must stay panic-free on arbitrary input; the verify that follows
# on a parsed proof must never panic on a hostile epoch or time.
[[bin]]
name = "proof_parse"
path = "fuzz_targets/proof_parse.rs"
test = false
doc = false
bench = false

# `Delegation::decode` / `parse_header_value` (ADR-0058 section 2) run on the
# value of an `x-lakko-ds-delegation` header anyone can send with a mailbox
# write, before any reach key is looked up. The fixed-length parser must stay
# panic-free, a delegation that parses must re-encode to the identical bytes
# and header text, and the verify that follows must never panic on a hostile
# expiry.
[[bin]]
name = "delegation_parse"
path = "fuzz_targets/delegation_parse.rs"
test = false
doc = false
bench = false

# ADR-0057: `SignedStatement::decode` is the first thing every ownership route
# of services/ds (claim, reset, register epoch, registrars, root transfer, push
# binding) runs on a request body anyone can send, before any root or
# registrar is looked up. Bounded, exact and panic-free on arbitrary input; a
# statement that parses must re-encode to the same bytes.
[[bin]]
name = "statement_decode"
path = "fuzz_targets/statement_decode.rs"
test = false
doc = false
bench = false
