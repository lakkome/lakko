[package]
name = "lakko-ui-rules"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false
description = "Presentation rules the three clients must agree on, written once"

[lints]
workspace = true

[dependencies]
# The canonical username rule, so "is this worth a lookup" is the SAME
# predicate the blinder enforces rather than a third spelling of it.
lakko-contacts.workspace = true
# The message-link rule (`message_links`), defined once in lakko-attachments
# so the article codec (ADR-0090) uses the same rule; re-exported here.
lakko-attachments.workspace = true
# The one-emoji rule (`emoji`, UX reactions-and-emoji D10): extended
# grapheme clusters, and the Extended_Pictographic property that
# unicode-segmentation uses but does not expose. Both justified at the
# workspace declaration.
unicode-segmentation.workspace = true
icu_properties.workspace = true

[dev-dependencies]
# Only to pin that the folder bitfield constants equal the wire ones.
lakko-sync.workspace = true
# The layer-display rule is a state machine: arbitrary event sequences.
proptest = "1"
