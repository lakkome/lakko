[package]
name = "lakko-ui-rules"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false
description = "Presentation rules the three clients must agree on, written once"

[lints]
workspace = true

[dependencies]
# The canonical username rule, so "is this worth a lookup" is the SAME
# predicate the blinder enforces rather than a third spelling of it.
lakko-contacts.workspace = true
# The message-link rule (`message_links`), defined once in lakko-attachments
# so the article codec (ADR-0092) uses the same rule; re-exported here.
lakko-attachments.workspace = true
# The one-emoji rule (`emoji`, UX reactions-and-emoji D10): extended
# grapheme clusters, and the Extended_Pictographic property that
# unicode-segmentation uses but does not expose. Both justified at the
# workspace declaration.
unicode-segmentation.workspace = true
icu_properties.workspace = true
# On-device text language detection (`language_detect`, ADR-0082 note of
# 2026-11-15). Pure Rust, compiled-in trigram profiles, no I/O. The `dev`
# feature exposes the ranked score list (`whatlang::dev::raw_detect`), which
# the close-candidate set reads. Upstream calls that API internal and advises
# against relying on it; the version is pinned exactly (`=0.18.0`) in the
# workspace, so it cannot change under us without a deliberate bump, and the
# tests of `language_detect` pin what it returns for the measured cases.
whatlang = { workspace = true, features = ["dev"] }

[dev-dependencies]
# Only to pin that the folder bitfield constants equal the wire ones.
lakko-sync.workspace = true
# The layer-display rule is a state machine: arbitrary event sequences.
proptest = "1"
