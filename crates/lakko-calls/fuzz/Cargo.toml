[package]
name = "lakko-calls-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

# Opt out of the parent workspace.
[workspace]

[dependencies]
libfuzzer-sys = "0.4"
lakko-calls = { path = ".." }

# The SFrame header (RFC 9605 §4.3) is the on-wire prefix of every
# sealed media frame AND the AEAD AAD (ADR-0013). A receiver parses it
# with `SframeHeader::decode` on bytes that arrive from an untrusted
# SFU / peer BEFORE the AEAD authenticates the frame, so the parser is
# fully attacker-touchable — any panic / overflow / runaway allocation
# on arbitrary input is a DoS on the call receive path.

[[bin]]
name = "header_decode"
path = "fuzz_targets/header_decode.rs"
test = false
doc = false
bench = false

# `parse_signaling_payload` decodes the plaintext call-signaling body that
# falls out of an `Incoming::Application` frame. The bytes are E2EE-decrypted
# but sender-crafted by any group member, so the prost decode + oneof gate +
# 16-byte call_id length check + MediaFlags/EndReason mapping are all
# attacker-touchable before any field is trusted.

[[bin]]
name = "signaling_payload_decode"
path = "fuzz_targets/signaling_payload_decode.rs"
test = false
doc = false
bench = false

# The sealed media frame of ADR-0071 ends in a 3-byte trailer that tells a
# receiver where the clear codec-header prefix stops and where the SFrame
# header starts. It is read on bytes from an untrusted SFU / peer before the
# AEAD authenticates anything, so the two length bytes and the header they
# point at are attacker-chosen.

[[bin]]
name = "media_frame_open"
path = "fuzz_targets/media_frame_open.rs"
test = false
doc = false
bench = false

# The sealed `signal-relay` payload of an SFU call and the peer announcement
# inside it (ADR-0078 section 2). Relay bytes arrive from the SFU, which any
# participant can fill; the open and the announcement decode run before any
# signature is checked.

[[bin]]
name = "relay_open"
path = "fuzz_targets/relay_open.rs"
test = false
doc = false
bench = false

[[bin]]
name = "screen_share_decode"
path = "fuzz_targets/screen_share_decode.rs"
test = false
doc = false
bench = false
