[package]
name = "lakko-auth-token"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false
description = "HMAC-SHA256 session access tokens + refresh credentials, the lakko-svc-auth to verifier contract (Phase 1.5b, ADR-0065 v2)"

[lints]
workspace = true

[dependencies]
thiserror.workspace = true

# HMAC-SHA256 over the canonical token bytes. The same `hmac` + `sha2`
# crates the wider crypto stack already pulls transitively via OPAQUE
# (opaque-ke → argon2 → digest); pinning the versions here keeps the
# dep tree explicit + cargo-deny-friendly.
hmac = "0.12"
sha2 = "0.10"

# Constant-time tag comparison — `subtle` is the canonical Rust crate
# for the primitive. Already pulled transitively by `opaque-ke` →
# `voprf` → `curve25519-dalek`; the explicit dep here pins the
# 2.x major.
subtle = "2"

# Base64url-no-pad (RFC 4648 §5) encoding for the token fields.
# Same crate version every other Lakko crate uses for base64 work.
base64 = "0.22"

# The refresh key is `BLAKE3-derive-key("lakko/session-refresh/v1", secret)`
# (ADR-0065 section 3.1). `blake3` is already in the tree through
# `lakko-crypto`; pulling the one hash directly keeps this crate free of the
# wider crypto surface, as `hmac` / `sha2` above are.
blake3 = "1"

[dev-dependencies]
# Reproducibility check uses a constant secret; no separate test-only
# deps required.
