[package]
name = "lakko-auth-token-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

# Opt out of the parent workspace — cargo-fuzz crates require nightly and
# libfuzzer-sys, which we don't want as a workspace-wide dep.
[workspace]

[dependencies]
libfuzzer-sys = "0.4"
lakko-auth-token = { path = ".." }

# `TokenSecret::verify` + `verify_refresh` are the credential parsers +
# verifiers (ADR-0073 v2 access token and r1 refresh credential): a client or
# peer presents one on every bearer request and on auth's refresh route, so the
# string is fully attacker-controlled and reaches the dot-split / base64url /
# u64 + i64 parse / HMAC path before admission. Any panic / overflow /
# slice-out-of-bounds here is a vulnerability.
[[bin]]
name = "token_verify"
path = "fuzz_targets/token_verify.rs"
test = false
doc = false
bench = false
