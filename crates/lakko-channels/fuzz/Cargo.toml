[package]
name = "lakko-channels-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

# Opt out of the parent workspace — cargo-fuzz crates require
# nightly + libfuzzer-sys, which we do not want as a workspace-
# wide dep.
[workspace]

[dependencies]
libfuzzer-sys = "0.4"
lakko-channels = { path = ".." }
lakko-crypto = { path = "../../lakko-crypto" }

[[bin]]
name = "post_decode"
path = "fuzz_targets/post_decode.rs"
test = false
doc = false
bench = false

