[package]
name = "lakko-channels"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false
description = "Two-tier channel broadcast (Phase 4a — publisher path). PublisherGroup exporter seed + per-message AEAD + Ed25519 signature on every post. See ADR-0010."

[lints]
workspace = true

[dependencies]
thiserror.workspace = true
tracing.workspace = true

# Crypto primitives (HKDF, ChaCha20-Poly1305, Ed25519) + MLS exporter
# bridge. We never link OpenMLS directly from this crate; the publisher
# passes us the exporter output it derived from its PublisherGroup.
lakko-crypto.workspace = true

# The canonical username rule a directory listing's handle obeys
# (`lakko_contacts::username`) and the channel-name character rules, shared
# with the group envelope that carries followed channels
# (`lakko_contacts::channel_text`, ADR-0059). `lakko-contacts` depends only
# on `thiserror` and `lakko-crypto`, both already here.
lakko-contacts.workspace = true

# A post's plaintext is the chat envelope (ADR-0087 section 13): one codec,
# one bound set and one inline-media rule with chat messages.
lakko-attachments.workspace = true

# The fixed list of 64 reaction emoji a channel post takes (ADR-0087 section
# 13a): one definition the label resolution here and the clients' pickers
# share. `lakko-ui-rules` depends only on `lakko-contacts`, already here.
lakko-ui-rules.workspace = true

# Base64url-no-pad for the owner request-proof header (ADR-0059 section 1),
# the same version `lakko-ds-proof` already pins.
base64 = "0.22"

[dev-dependencies]
hex = "0.4"
