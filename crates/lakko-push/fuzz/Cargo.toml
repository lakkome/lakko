[package]
name = "lakko-push-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

# Opt out of the parent workspace — cargo-fuzz crates require nightly and
# libfuzzer-sys, which we don't want as a workspace-wide dep.
[workspace]

[dependencies]
libfuzzer-sys = "0.4"
lakko-push = { path = ".." }

# `PushPayload::decode_json` is the on-device push-payload parser: a push
# notification is relayed verbatim by the OS push pipeline (APNs / FCM /
# UnifiedPush) and reaches this JSON + base64 parser before any further
# processing, so the input is fully attacker-controlled. Any panic / overflow
# / slice-out-of-bounds here is a vulnerability.
[[bin]]
name = "push_decode_json"
path = "fuzz_targets/push_decode_json.rs"
test = false
doc = false
bench = false
