# cbindgen config — drives `build.rs` (which calls into
# the cbindgen library to emit `lakko_sframe_native.h`
# under `target/<profile>/include/`).

language = "C"

# Single-file header consumed by the iOS Obj-C++ shim
# (apps/shared/sframe-bridge/sframe-bridge.cc N-3) and
# the Android JNI shim (apps/android/lakko-sframe/.../
# sframe_jni.cc N-5).
header = """/*
 * SPDX-License-Identifier: AGPL-3.0-or-later
 * SPDX-FileCopyrightText: 2026 Lakko Contributors
 *
 * Auto-generated by cbindgen from
 * crates/lakko-sframe-native — DO NOT EDIT BY HAND.
 *
 * Regenerate via:
 *   cargo build -p lakko-sframe-native
 */"""

include_guard = "LAKKO_SFRAME_NATIVE_H"
no_includes = false
sys_includes = ["stddef.h", "stdint.h"]

[export]
# No top-level `prefix` — every exported Rust symbol already
# carries the `lakko_sframe_` prefix in source (functions via
# `#[no_mangle] extern "C" fn lakko_sframe_*`, opaque types
# via the explicit `[export.rename]` table below). Adding a
# cbindgen-level prefix on top would emit `lakko_sframe_lakko_
# sframe_call_key_t` etc. — see the bumpy double-prefix that
# the N-3 sub-sprint had to scrape off the first generated
# header.

[export.rename]
"CallKey" = "lakko_sframe_call_key_t"
"ParticipantKey" = "lakko_sframe_participant_key_t"
"CallKeyRing" = "lakko_sframe_call_key_ring_t"
"LakkoSframeStatus" = "lakko_sframe_status_t"

[enum]
# `rename_variants = "ScreamingSnakeCase"` plus `prefix_with_name`
# emits `LAKKO_SFRAME_STATUS_T_OK` rather than the bumpier
# `LAKKO_SFRAME_LAKKO_SFRAME_STATUS_OK`. The export.rename above
# normalises the type name; this prefix-with-name then derives
# the variant names off it.
rename_variants = "ScreamingSnakeCase"
prefix_with_name = true

[parse]
parse_deps = false
