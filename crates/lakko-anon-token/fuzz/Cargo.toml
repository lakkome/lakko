[package]
name = "lakko-anon-token-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

# Opt out of the parent workspace - cargo-fuzz crates require nightly and
# libfuzzer-sys, which we don't want as a workspace-wide dep.
[workspace]

[dependencies]
libfuzzer-sys = "0.4"
lakko-anon-token = { path = ".." }

# `verify_token` is the first thing a consuming service (discovery, the DS,
# push-gw) runs on the token bytes an anonymous request carries, before any
# state is consulted. The bounded, fail-closed decoder (fixed length, version
# gate, context byte) and the verify that follows (epoch window, key
# derivation, VOPRF evaluation, constant-time compare) must stay panic-free on
# arbitrary input, and a token that decodes must re-encode byte for byte.
[[bin]]
name = "token_verify"
path = "fuzz_targets/token_verify.rs"
test = false
doc = false
bench = false
