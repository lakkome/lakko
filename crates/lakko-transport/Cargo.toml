[package]
name = "lakko-transport"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false
description = "Transport layer — QUIC, WebSocket, pluggable obfuscation traits"

[lints]
workspace = true

[dependencies]
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true
futures.workspace = true
serde.workspace = true
serde_json.workspace = true

async-trait = "0.1"
bytes = "1"

# Phase 5 G5-5 — Ed25519 verify for the signed
# rendezvous bootstrap config. Reusing the workspace
# crypto crate keeps the audit surface aligned with
# every other Lakko crate that handles Ed25519.
lakko-crypto.workspace = true

# QUIC — used by the message-oriented mesh transport (Phase 0.3).
quinn = { version = "0.11", default-features = false, features = ["runtime-tokio", "rustls-ring"] }
rustls = { version = "0.23", default-features = false, features = ["std", "ring"] }
rustls-pki-types = "1"
rcgen = { version = "0.13", default-features = false, features = ["pem", "ring"] }

# HTTP REST client (Phase 1.8) — talks to auth / ds / storage /
# discovery / push-gw. `rustls-tls-manual-roots` lets us plug a
# custom `ServerCertVerifier` that does SPKI pinning (see pinning.rs)
# instead of going through the system CA bundle.
reqwest = { version = "0.12", default-features = false, features = [
    "rustls-tls-manual-roots",
    # G5-5-doh: webpki-roots adds the embedded Mozilla CA
    # bundle so the DoH fetcher can talk to public DNS
    # resolvers (Cloudflare / Google / Quad9 / AdGuard)
    # via the standard CA chain. Lakko's own API still
    # uses `rustls-tls-manual-roots` + SPKI pinning via
    # `pinning.rs`; the two trust roots are independent.
    "rustls-tls-webpki-roots",
    "json",
    "stream",
    "http2",
    "gzip",
] }
url = "2"
sha2 = "0.10"
# Parses leaf certificate DER to extract the SubjectPublicKeyInfo
# bytes for SPKI pin computation.
x509-parser = "0.16"

# S-5-shadowsocks-tcp: decode SS-2022 master PSK from
# base64 standard-form. The spec mandates base64 with
# padding; we surface a clean parse error if the encoded
# length doesn't decode to exactly 32 bytes.
base64 = "0.22"
# G5-1-foundation: decode REALITY short_id from hex in the
# bootstrap rendezvous config. Same hex crate the workspace
# already pulls via lakko-tuf — registry resolver aligns
# versions.
hex = "0.4"
# G5-1-foundation: constant-time HMAC-tag comparison on the
# REALITY verifier path so a timing attacker cannot narrow
# which tag bytes mismatched. Same crate lakko-crypto
# already pulls.
subtle = "2"

# G5-4: WebTransport over HTTP/3. The `web-transport-quinn`
# crate is the actively-maintained successor to the
# deprecated `webtransport-quinn` and rides directly on
# quinn 0.11 — version-aligned with the rest of this crate's
# QUIC stack and crypto-provider-agnostic (works with rustls
# `ring` like the rest of lakko-transport, unlike `wtransport`
# 0.6 which hard-codes `aws_lc_rs`). NOTE: its `default`
# feature is `aws-lc-rs`, so we MUST pin `default-features =
# false` + `ring` — otherwise it drags `aws-lc-sys` into the
# build, which fails to link on iOS (ADR-0026 Phase 3).
web-transport-quinn = { version = "0.11", default-features = false, features = ["ring"] }

# G5-6-wireup: RustCrypto/hpke implements RFC 9180 HPKE.
# rustls 0.23's ECH wire-up requires `&[&'static dyn
# rustls::crypto::hpke::Hpke]` and the `ring` crypto
# provider does NOT ship HPKE (only `aws_lc_rs` does).
# We adapt the RustCrypto `hpke` crate to rustls's trait
# via `src/ech/adapter.rs`, keeping the rest of
# lakko-transport on the `ring` crypto provider.
#
# Features (verified against hpke-0.13.0 metadata, not the
# pre-release 0.14.x feature surface): `alloc`, `std`,
# `p256`, `p384`, `p521`, `x25519`. AEADs (AES-GCM,
# ChaCha20-Poly1305) are unconditionally compiled into
# hpke 0.13 — no separate feature gate. We disable defaults
# (which would pull p256) and turn on only `std` + `x25519`,
# the suite Cloudflare publishes for ECH.
hpke = { version = "0.13", default-features = false, features = [
    "std",
    "x25519",
] }
# G5-6-wireup: `rand_core` 0.9 is the version `hpke` 0.13
# takes. The workspace already pulls 0.9 transitively via
# quinn-proto + openmls_rust_crypto; we declare it
# directly here so the adapter can construct `OsRng` and
# feed it to hpke's setup_sealer. `os_rng` is feature-gated
# in 0.9 (split out for no-std users); we need it.
rand_core = { version = "0.9", features = ["os_rng"] }

# S-5-masque-handshake: HTTP/3 client for MASQUE RFC 9298
# extended-CONNECT. The hyperium `h3` crate runs the
# control-channel handshake; `h3-quinn` glues it to
# quinn 0.11 (our existing QUIC layer). Both are pre-1.0
# (0.0.x) but version-aligned with our quinn 0.11 /
# rustls 0.23 / http 1 / bytes 1 stack.
#
# We deliberately skip `h3-datagram` and shuttle the
# RFC 9297 datagrams directly through
# `quinn::Connection::{send_datagram, read_datagram}` —
# our `masque::datagram::encode_udp_payload` already
# emits the (Context-ID || UDP-payload) wire format
# RFC 9297 §3 mandates, and h3-datagram's API surface
# only adds value when multiplexing multiple Context
# IDs on the same h3 connection (we run exactly one
# CONNECT-UDP tunnel per quinn::Connection).
http = "1"
h3 = "0.0.8"
h3-quinn = "0.0.10"

# S-5-masque-handshake: load the system CA chain so the
# MASQUE proxy's CA-signed cert validates without
# requiring the bootstrap config to ship SPKI pins.
# Future sprint may add `spki_pins_b64` to MasqueConfig
# for stricter trust; for now system roots are the
# pragmatic default since MASQUE proxies are typically
# operated by CDNs with proper CA-signed certs.
rustls-native-certs = "0.8"

# S-5-masque-handshake: futures::future::poll_fn is used
# to drive the h3 connection's `poll_close` from a
# spawned tokio task. `futures` is already a workspace
# dep (re-exported here so we can name `poll_fn` without
# pulling the broader futures-util surface).

[dev-dependencies]
tokio = { version = "1", features = ["full", "test-util"] }
# G5-7 — `sni_observer_e2e` integration test connects
# `tokio-rustls` to the censorship-lab observer to
# verify which SNI a passive on-path adversary sees.
# Pinned to the same rustls major as the production
# dep above so the test exercises the same wire-format
# stack the real transports use.
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }
