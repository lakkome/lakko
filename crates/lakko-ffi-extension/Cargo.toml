[package]
name = "lakko-ffi-extension"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false
description = "Slim decrypt-only UniFFI surface for the iOS NotificationServiceExtension (ADR-0041 Phase 2)"

[lib]
crate-type = ["staticlib", "cdylib", "rlib"]

[lints]
workspace = true

# ADR-0041 Phase 2 — the SLIM decrypt-only FFI. The dependency set is the
# load-bearing point of this crate: it pulls ONLY the three crates the iOS NSE
# background-decrypt path needs — `lakko-mls` (restore-throwaway-group /
# process-incoming-verifying-roles / Identity::from_seed),
# `lakko-attachments` (parse-body-envelope) and `lakko-contacts`
# (decode-push-routing-secret, the service-envelope filter) — plus their
# transitive `lakko-crypto` / `lakko-proto` / openmls. It deliberately does NOT
# depend on `lakko-transport` (tokio + REALITY/MASQUE/Shadowsocks),
# `lakko-calls`, `lakko-channels`, `lakko-sfu-proto`, or `lakko-call-jwt` —
# none of which the decrypt path touches, and all of which bloat the ~30 MB NSE
# budget. Keep this list minimal; adding a dep here re-inflates the framework
# the NSE links.
#
# `lakko-contacts` was measured before it was added: its own dependency set is
# just `thiserror` (already here) + `lakko-crypto` (already here transitively
# via `lakko-mls`), so a `cargo tree --target aarch64-apple-ios --edges normal`
# set difference shows it adding exactly FIVE crates — `lakko-contacts`,
# `tracing`, `tracing-core`, `tracing-attributes`, `pin-project-lite`. No
# tokio, no TLS, no async runtime, no transport. Re-run that measurement before
# adding anything else here.
[dependencies]
thiserror.workspace = true
lakko-mls.workspace = true
lakko-attachments.workspace = true
lakko-contacts.workspace = true

# `build` powers the `uniffi::setup_scaffolding!()` proc-macro; `cli` enables
# `uniffi::uniffi_bindgen_main()` in `src/bin/uniffi-bindgen.rs` so
# `just build-ios-extension` runs a workspace-pinned bindgen. Same 0.31 release
# the main `lakko-ffi-uniffi` crate uses — no ABI drift between the two
# xcframeworks a device might load side by side (the NSE links the slim one,
# the app the full one).
uniffi = { version = "0.31", features = ["build", "cli"] }

[build-dependencies]
uniffi = { version = "0.31", features = ["build"] }

# The crate ships two artefacts: the `cdylib` from `[lib]` above (real Swift
# runtime the NSE links) plus the `uniffi-bindgen` host tool below — codegen
# only, runs during binding generation, never ships in a production build.
[[bin]]
name = "uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"
