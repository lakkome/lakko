syntax = "proto3";

package lakko.wire.device_pairing.v1;

// Device-pairing QR payload (Phase 2a3b1; v2 since ADR-0056).
//
// Encodes everything a paired-up device's "Scan" screen (or the
// ADR-0049 "Is this you?" prompt, which carries the same bytes
// through `POST /device/request`) needs to drive
// `DeviceGroup::add_device_from_wire` for a fresh device's
// KeyPackage:
//
//   * `login_handle` — the 32-byte ADR-0054 S5 login handle of the
//     username the person typed on the fresh device
//     (`BLAKE3-derive-key("lakko/auth/login-handle/v1",
//     canonical_username)`). The confirming device compares it,
//     in constant time, with the handle of its own username, so a
//     payload meant for another account's name is refused before
//     any MLS commit lands. Since ADR-0056 nothing a fresh device
//     sends before it holds a session carries the account id.
//   * `key_package` — TLS-encoded `KeyPackage` produced by
//     `Identity::create_key_package` on the fresh device. The
//     scanner deserialises + validates it as part of the
//     `add_device_from_wire` call; OpenMLS rejects invalid
//     signatures / ciphersuites here.
//
// The QR contents are **not** authenticated end-to-end on the
// wire — anyone who can show this QR to the scanner is trusted
// by the user's physical action (the user pointed the camera at
// it). On the camera-less route the six-digit comparison code
// both devices derive from these bytes is what stops the relay
// substituting its own device (ADR-0049).
//
// Generated Rust code lives in
// `crates/lakko-proto/src/generated/wire_device_pairing/`.
message PairingQr {
    // Logical version of the QR payload format. 2 since ADR-0056
    // (the account id was replaced by the login handle). The
    // decoder accepts exactly 2: there is no dual path.
    uint32 version = 1;

    // Field 2 was the 16-byte `account_id` (v1). ADR-0056 retired
    // it; the number and the name are never reused.
    reserved 2;
    reserved "account_id";

    // TLS-encoded `KeyPackage` for the fresh device's
    // DeviceIdentity (ADR-0007). The same bytes
    // `Identity::create_key_package(...)` produces on the
    // fresh side, built over the per-device random
    // DeviceIdentity (not the deterministic AccountIdentity)
    // so the resulting MLS leaf has a unique signature key
    // per RFC 9420 §5.3.
    bytes key_package = 3;

    // 32-byte random rendezvous pseudonym the fresh device
    // chose for this pairing session. The DS mailbox at this
    // pseudonym is the one-shot delivery channel for the
    // Welcome message. Sequence: the fresh device generates a
    // random pseudonym, starts polling
    // GET /ds/mailbox/{pseudonym}/messages, encodes
    // (login_handle, key_package, pseudonym) into this QR; the
    // scanner device decodes the QR, runs
    // DeviceGroup::add_device_from_wire(key_package) to
    // produce a Welcome, PUTs the Welcome at
    // POST /ds/mailbox/{pseudonym}/messages; the fresh
    // device's poll picks the Welcome up and runs
    // DeviceGroup::join_from_welcome. The rendezvous pseudonym
    // is then forgotten. 32 bytes mirrors the per-relationship
    // pseudonym width used everywhere else (routing_pseudonym
    // in wire/v1.proto, contact pseudonyms in lakko-contacts).
    bytes rendezvous_pseudonym = 4;

    // The 32-byte login handle of the account the fresh device
    // asks to join (ADR-0056). The scanner compares it, in
    // constant time, with the handle of its own username before
    // driving `DeviceGroup::add_device_from_wire`.
    bytes login_handle = 5;

    // ADR-0081 amendment — set only on a DeviceGroup REJOIN knock: the
    // device's self-removal proof (137 bytes, `lakko_mls::self_removal`),
    // signed with its old leaf key, asking that its previous leaf be
    // replaced by `key_package`. Empty on a pairing QR and on a rejoin of a
    // device that no longer holds its old leaf key. The decoder refuses any
    // other non-empty length; the proof itself is verified by every peer's
    // removal gate, not here.
    // Field 16: 6..15 stay reserved for the fingerprint-attestation slot.
    bytes self_removal_proof = 16;

    // Reserved for future use — never re-purpose. Slot for the
    // optional fingerprint-attestation extension landing in
    // 2a3b's safety-number follow-up.
    reserved 6 to 15;
}
