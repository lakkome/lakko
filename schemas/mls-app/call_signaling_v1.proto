syntax = "proto3";

package lakko.mls_app.call_signaling.v1;

// Call-signaling wire format (Phase 3a3).
//
// Ride the existing conversation MLS group as application
// messages. Per the plan §5 and `docs/adr/0001-mls-only.md`
// section "Звонки", in-chat calls reuse the chat group's
// epoch — call signaling lives on the same DS journal as
// chat messages, with no new transport.
//
// `CallSignalingPayload` carries one of four signaling-event
// bodies (oneof). The outer envelope is intentionally narrow
// — no HLC, no sender_leaf, none of the cross-device-sync
// trappings the `devicegroup_v1` shape needs. Signaling
// events are ordered by the DS journal cursor + the MLS
// epoch they were sealed in; that's sufficient for the
// "offer → answer → ice → ice → … → end" call lifecycle.
//
// ## Multi-call disambiguation
//
// Every body variant carries the same `call_id` field —
// 16 random bytes the offer-side device mints. Receivers
// match incoming candidates to the active call by id; a
// stale candidate from a prior call lands in the same group
// but doesn't match any live call_id and gets dropped.

// Outer envelope. One per signaling event.
//
// ## 1×1 vs group call wire shapes
//
// **1×1 (Phase 3a).** Per-peer SDP / ICE rides MLS as
// `CallOffer` / `CallAnswer` / `IceCandidate` / `CallEnd`.
// The MLS chat group is the only signaling channel.
//
// **Group call (Phase 3c, SFU-based).** Per-participant
// SDP / ICE goes participant ↔ SFU directly through the
// LiveKit signaling channel — the SFU never sees the MLS
// group. What rides MLS is **call-control only**:
// `GroupCallStart` (announce the call_id to the chat),
// `GroupCallJoin` (participant connected to SFU),
// `GroupCallLeave` (participant disconnected). The split
// keeps the chat group's DS journal small + keeps the
// SFU blind to chat membership.
//
// `CallEnd` is reused for the group-call terminal event
// (last participant leaves, admin force-ends) — the body
// is the same.
message CallSignalingPayload {
    // Concrete body. Exactly one variant is set.
    oneof body {
        CallOffer offer = 10;
        CallAnswer answer = 11;
        IceCandidate candidate = 12;
        CallEnd end = 13;
        GroupCallStart group_start = 14;
        GroupCallJoin group_join = 15;
        GroupCallLeave group_leave = 16;
        ScreenShareSignal screen_share = 17;
    }
    reserved 18 to 31;
}

// "I am calling you" — SDP offer from the initiator.
message CallOffer {
    // 16-byte random id minted by the offer side. Receivers
    // use this to match subsequent answer / candidate /
    // end events.
    bytes call_id = 1;
    // Full SDP-offer body. Plaintext — the MLS envelope is
    // the only privacy layer (SDP carries no PII beyond the
    // codec list + ICE candidate parameters).
    string sdp = 2;
    // Wall-clock UNIX millis when the offer was minted.
    // Display only; never used for ordering (DS cursor is
    // the source of truth).
    uint64 created_at_ms = 3;
    // Bitmap of media kinds the offer requests:
    //   bit 0 = audio
    //   bit 1 = video
    // Only audio + video for Phase 3; data channels land
    // alongside the SFU integration in 3b.
    uint32 media_flags = 4;
    reserved 5 to 15;
}

// "I am picking up" — SDP answer from the callee.
message CallAnswer {
    bytes call_id = 1;
    string sdp = 2;
    reserved 3 to 15;
}

// Trickled ICE candidate. Sent zero or more times per side
// after the offer / answer pair, until the ICE pair
// finalises or the call ends.
message IceCandidate {
    bytes call_id = 1;
    // ICE candidate string in SDP `a=candidate:` form, e.g.
    // `candidate:842163049 1 udp 1677729535 192.168.0.1
    //  56789 typ srflx raddr 0.0.0.0 rport 0 generation 0
    //  ufrag GsfV network-id 4 network-cost 50`.
    string candidate = 2;
    // SDP m-section identifier (e.g. `audio`, `video`).
    string sdp_mid = 3;
    // SDP m-section index (zero-based).
    uint32 sdp_m_line_index = 4;
    reserved 5 to 15;
}

// Terminal event. Either side can send. Receipt of
// `CallEnd` aborts any in-flight ICE renegotiation.
message CallEnd {
    bytes call_id = 1;
    // Reason discriminator:
    //   0 = HUNG_UP — initiator or callee tore down
    //   1 = BUSY — callee was already on another call
    //   2 = DECLINED — callee declined explicitly
    //   3 = TIMED_OUT — no answer within the offer window
    //   4 = ERROR — unrecoverable error mid-call
    //   5 = ENDED_FOR_ALL — group / link call only: the call's starter
    //       ended it for everyone. A receiver leaves the call only when
    //       the MLS-authenticated sender is that starter.
    // An unknown value reads as 0.
    uint32 reason = 2;
    reserved 3 to 15;
}

// "I am opening a group call in this chat" — announce.
//
// First event in the group-call lifecycle. Anyone in the
// chat MLS group sees this on the DS journal and renders
// a joinable-call card in the conversation. The initiator
// is identified by their MLS leaf index — receivers can
// match it against their local member roster to display a
// name without leaking identity to the server.
//
// Subsequent `GroupCallJoin` events from each participant
// (including the initiator) populate the live roster.
message GroupCallStart {
    // 16-byte random id minted by the initiator.
    bytes call_id = 1;
    // MLS leaf index of the initiator at the time of the
    // announce. Leaf indices are stable within an epoch;
    // a commit advancing the chat group's epoch invalidates
    // stale indices (receivers fall back to "Unknown" until
    // the next `GroupCallJoin` lands).
    uint32 initiator_leaf = 2;
    // Wall-clock UNIX millis when the announce was minted.
    // Display only; never used for ordering.
    uint64 created_at_ms = 3;
    // Bitmap of media kinds the group call supports:
    //   bit 0 = audio
    //   bit 1 = video
    uint32 media_flags = 4;
    reserved 5 to 15;
}

// "I have connected to the SFU" — roster update.
//
// Sent by each participant after their per-participant
// SFU session reaches `connected`. Other clients in the
// chat update their local `GroupCallSession` roster +
// recompute the rekey state (per `GroupCallSession::
// set_joined`). The body intentionally does NOT carry
// SDP / ICE — that path goes participant ↔ SFU directly
// through the LiveKit signaling channel.
message GroupCallJoin {
    bytes call_id = 1;
    // MLS leaf index of the joining participant.
    uint32 leaf_index = 2;
    // Wall-clock UNIX millis when the join landed.
    // Display only.
    uint64 joined_at_ms = 3;
    reserved 4 to 15;
}

// "I have disconnected from the SFU" — roster update.
//
// Counterpart of `GroupCallJoin`. Receivers call
// `GroupCallSession::set_joined(leaf, false)` on their
// local ledger; the rekey state flips so the next MLS
// commit triggers a key rotation per 3c5.
//
// When the LAST participant leaves, the initiator (or
// admin) follows up with `CallEnd` to mark the call
// terminated in the chat history.
message GroupCallLeave {
    bytes call_id = 1;
    uint32 leaf_index = 2;
    // Reason discriminator. Mirrors `CallEnd.reason` for
    // wire-shape consistency; values:
    //   0 = HUNG_UP — participant left voluntarily
    //   1 = BUSY — unused for group calls; reserved
    //   2 = DECLINED — unused; reserved
    //   3 = TIMED_OUT — connection lost / SFU eviction
    //   4 = ERROR — unrecoverable error on this participant
    uint32 reason = 3;
    reserved 4 to 15;
}

// One-to-one screen share (ADR-0083 section 4). `state` is the signed
// share state of `lakko_calls::screen_share` (domain
// "lakko/call/screen-share/v1"); the receiver verifies it against the MLS
// sender's leaf. Group calls carry the same state on the sealed SFU relay,
// not here.
message ScreenShareSignal {
    bytes call_id = 1;
    bytes state = 2;
    reserved 3 to 15;
}
