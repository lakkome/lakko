syntax = "proto3";

package lakko.mls_app.devicegroup.v1;

// Cross-device application payloads (Phase 2a3e).
//
// Wire shape for the application messages that flow inside a
// user's `DeviceGroup` (Phase 2a3a) — the per-user MLS group
// whose leaves are the user's own devices. These payloads are
// **NOT** sent inside a conversation group; they live solely on
// the DeviceGroup channel and are visible only to the user's
// other devices.
//
// Concrete payload shapes covered here:
//
//   * `ReadCursor`       — "I've read up to <message_id> in
//                          <group_id> as of <read_at_ms>"
//   * `DraftUpdate`      — "Here's my in-flight composer state
//                          for <group_id>" (text + reply_to)
//   * `ThreadFlags`      — pin / mute / archive / unread-override
//                          per conversation
//   * `ConversationOrder` — explicit display ordering for the
//                          conversation list (overrides the
//                          fallback "by latest message" order)
//   * `FolderChanges`    — a live chat-folder edit (ADR-0058), and
//                          since ADR-0065 section 4 a live Save /
//                          Remove of a saved message
//   * `StateSnapshot`    — the catch-up re-send of the whole folded
//                          state to a device that joined late
//                          (ADR-0058 section 5)
//   * `ServiceEnvelope`  — an opaque `lakko-contacts` envelope
//                          (ADR-0060 section 7) the client
//                          dispatches itself
//
// Two reasons for a dedicated `devicegroup_v1.proto` instead of
// extending `mls-app/v1.proto`:
//
//   1. **Scope.** The mls-app payloads land in conversation
//      groups (visible to every contact in the group);
//      DeviceGroup payloads land only on the user's own
//      devices. Mixing them invites accidentally signaling
//      `Pinned` to all contacts because the wrong oneof branch
//      was decoded.
//   2. **Versioning.** mls-app and DeviceGroup payload formats
//      will evolve at different rates; a separate proto file
//      lets each carry its own version-history without
//      coupling.
//
// Generated Rust code lives in
// `crates/lakko-proto/src/generated/mls_app_devicegroup/`.

// Outer envelope every DeviceGroup application message decodes
// as. Mirrors `ApplicationPayload` from `mls-app/v1.proto` —
// hybrid logical clock at the top, sender leaf index, then a
// oneof body picking the concrete payload type.
message DeviceGroupPayload {
    // Hybrid logical clock timestamp, monotonic across the
    // DeviceGroup. Encodes physical time + counter for total
    // ordering on read-cursor / draft / flag updates so the
    // last write wins deterministically across devices.
    uint64 hlc = 1;

    // Sender device leaf index in the DeviceGroup. Stable
    // inside an epoch; can renumber across a Remove/Add cycle,
    // so callers MUST NOT compare across epochs.
    uint32 sender_leaf = 2;

    oneof body {
        ReadCursor read_cursor = 10;
        DraftUpdate draft = 11;
        ThreadFlags flags = 12;
        ConversationOrder order = 13;
        // ADR-0058 chat folders: a live folder edit, and the catch-up
        // re-send of this device's whole folded state. 14-17 stay claimed
        // by ADR-0050 section 2.9 (ContactUpsert / ContactRemove /
        // ChannelSubscribed / ChannelUnsubscribed, unbuilt).
        FolderChanges folder_changes = 18;
        StateSnapshot state_snapshot = 19;
        // ADR-0060 section 7: a `lakko-contacts` envelope (the
        // "who can find me" setting and the reach-key state)
        // carried verbatim. The receiver dispatches the bytes; this
        // layer never interprets them.
        ServiceEnvelope service_envelope = 20;
    }

    reserved 14 to 17;
    reserved 21 to 31;
}

// "I read up to this point in this thread." Other devices use
// the last-write-wins (by HLC) cursor to compute their own
// per-thread unread count.
message ReadCursor {
    // The conversation group's MLS group_id (32 bytes today;
    // protocol carries it as opaque variable-length so a future
    // ciphersuite change doesn't need a schema bump).
    bytes group_id = 1;

    // The MLS application-message id (the
    // `ApplicationPayload.hlc` from `mls-app/v1.proto`) the
    // sender claims to have read up to.
    bytes up_to_message_id = 2;

    // Wall-clock UNIX millis when the read happened. Display
    // only — never used for ordering (that's `DeviceGroupPayload.hlc`).
    uint64 read_at_ms = 3;

    reserved 4 to 15;
}

// In-flight composer state for a single thread. Empty `text`
// clears the draft (the receiver wipes its local copy).
message DraftUpdate {
    // The conversation group_id the draft belongs to.
    bytes group_id = 1;

    // Composer text. UTF-8, may be empty.
    string text = 2;

    // When set, the draft was started as a reply to this
    // message. Empty bytes = no reply context.
    bytes reply_to_id = 3;

    reserved 4 to 15;
}

// Per-thread UI flags. Receivers apply the last-write-wins
// snapshot of the whole struct — partial updates do not merge.
// Pre-existing flags not represented in the message are NOT
// preserved; senders include every field they want to assert.
message ThreadFlags {
    // The conversation group_id the flags apply to.
    bytes group_id = 1;

    // Pinned threads stay at the top of the conversation list
    // regardless of recency.
    bool pinned = 2;

    // Muted threads suppress push notifications + visual
    // unread indicators. The server-side push subscription
    // stays alive — clients filter post-decrypt.
    bool muted = 3;

    // Archived threads drop out of the main list but remain
    // searchable.
    bool archived = 4;

    // Manual "unread" override — user marked the thread unread
    // after having read it. Cleared automatically by the next
    // `ReadCursor` for the same group.
    bool unread_override = 5;

    reserved 6 to 15;
}

// Explicit display ordering for the conversation list. When
// present, threads listed here render in the given order at
// the top of the list. Threads NOT mentioned fall back to the
// default recency-of-last-message order below the explicit
// portion. Useful for "Favourites" / starred-row UX without
// touching `ThreadFlags.pinned`.
message ConversationOrder {
    // Conversation group_ids in display order, top-to-bottom.
    repeated bytes group_ids = 1;

    reserved 2 to 15;
}

// ---------------------------------------------------------------------------
// ADR-0058 — chat folders.
//
// Every piece of folder state is a small register carrying ITS OWN hybrid
// logical clock stamp, so two devices changing different parts of one folder
// both keep their change. The envelope's `DeviceGroupPayload.hlc` is the
// stamp of the message and is ignored by the fold for `FolderChanges` and
// `StateSnapshot`. The fold itself lives in `lakko-sync`; the decode bounds
// (ADR-0058 section 4) are enforced by `lakko-mls` and refuse the whole
// payload, never truncate it.
// ---------------------------------------------------------------------------

// A conversation a folder names: a one-to-one or a group by its MLS
// group_id, a channel by its channel id.
message ConversationRef {
    enum Kind {
        KIND_UNSPECIFIED = 0;
        ONE_TO_ONE = 1;
        GROUP = 2;
        CHANNEL = 3;
    }
    Kind kind = 1;
    // MLS group_id for ONE_TO_ONE / GROUP, channel id for CHANNEL.
    // 1..=64 bytes.
    bytes id = 2;
    reserved 3 to 7;
}

// The folder's name and rule toggles.
message FolderMeta {
    uint64 hlc = 1;
    // 16 random bytes, minted once by the creating device.
    bytes folder_id = 2;
    // 1..=24 scalar values, <= 96 bytes, the display-name character rule.
    string name = 3;
    // bit0 one-to-one, bit1 groups, bit2 channels. Other bits refused.
    uint32 include_kinds = 4;
    // bit0 muted, bit1 read, bit2 archived. Other bits refused.
    uint32 exclude_flags = 5;
    reserved 6; // icon, not in v1
    reserved 7 to 15;
}

// One conversation's membership in one folder. `NONE` is the element
// tombstone: removing a chat writes `NONE` with a fresh stamp.
message FolderMember {
    enum State {
        NONE = 0;
        INCLUDED = 1;
        EXCLUDED = 2;
    }
    uint64 hlc = 1;
    bytes folder_id = 2;
    ConversationRef conversation = 3;
    State state = 4;
    reserved 5 to 7;
}

// The folder's own ordered pin list, as one value. At most 10.
message FolderPins {
    uint64 hlc = 1;
    bytes folder_id = 2;
    repeated ConversationRef pinned = 3;
    reserved 4 to 7;
}

// A folder deletion. Hides every register of the folder stamped <= hlc.
message FolderRemoved {
    uint64 hlc = 1;
    bytes folder_id = 2;
    reserved 3 to 7;
}

// The account's folder order, as one value. At most 256 ids.
message FolderOrder {
    uint64 hlc = 1;
    repeated bytes folder_ids = 2;
    reserved 3 to 7;
}

// One saved-message register (ADR-0065 section 4): a personal bookmark
// that belongs to the account. Keyed by (conversation, message_id); a save
// and a removal are two values of the same register, last writer wins by
// `hlc`, and a removal is kept as a tombstone. Every bound below is a
// decode bound: a register that breaks one refuses the whole payload.
message SavedMessage {
    enum State {
        // Refused: a register must say what it is.
        STATE_UNSPECIFIED = 0;
        // Saved. Carries the fields below.
        PRESENT = 1;
        // Removed from saved (the tombstone). Carries none of them: a
        // REMOVED register with a save time, a snapshot or a blob id is
        // refused.
        REMOVED = 2;
    }
    uint64 hlc = 1;
    ConversationRef conversation = 2;
    // The message's Delivery Service journal id.
    uint64 message_id = 3;
    State state = 4;
    // Wall-clock UNIX millis of the save. Orders the saved list; never
    // decides which write wins.
    uint64 saved_at_ms = 5;
    // Display snapshot, taken when the message was saved, so a row can be
    // drawn before the device holds the message. UTF-8.
    // <= 255 bytes.
    string author = 6;
    // <= 512 bytes.
    string excerpt = 7;
    // <= 32 bytes; empty when the message has no attachment.
    string attachment_kind = 8;
    // The blob ids of the message's files and thumbnails, so any device of
    // the account can keep them alive. 0..=128 entries of exactly 32
    // bytes, none repeated.
    repeated bytes blob_ids = 9;
    reserved 10 to 15;
}

// A live edit: only the registers that changed, each with its stamp.
// At most 1024 registers in total.
//
// Named for the chat folders it was built for; since ADR-0065 section 4 it
// also carries saved-message registers, so a Save or a Remove travels like
// a folder edit and `StateSnapshot.folders` hands a late device the saved
// list with no further field.
message FolderChanges {
    repeated FolderMeta metas = 1;
    repeated FolderMember members = 2;
    repeated FolderPins pins = 3;
    repeated FolderRemoved removed = 4;
    // Absent = unchanged.
    FolderOrder order = 5;
    // ADR-0065 section 4: saves and removals.
    repeated SavedMessage saved = 6;
    reserved 7 to 15;
}

// The catch-up re-send (ADR-0058 section 5): the whole folded state of this
// device, every entry with its ORIGINAL stamp, split into parts.
message StateSnapshot {
    message Stamped {
        uint64 hlc = 1;
        oneof entry {
            ThreadFlags flags = 2;
            ReadCursor cursor = 3;
            DraftUpdate draft = 4;
        }
    }
    repeated Stamped entries = 1;

    message StampedOrder {
        uint64 hlc = 1;
        ConversationOrder order = 2;
    }
    // Absent = none held.
    StampedOrder conversation_order = 2;

    // Folder registers, and the saved-message registers (ADR-0065).
    FolderChanges folders = 3;
    // 0-based; must be < parts.
    uint32 part = 4;
    // 1..=64.
    uint32 parts = 5;
    reserved 6 to 15;
}

// An opaque `lakko-contacts` envelope carried between the owner's
// own devices (ADR-0060 section 7): today the Visibility setting
// and the ReachState counters. `lakko-mls` bounds its length
// (1 to `MAX_SERVICE_ENVELOPE_LEN` bytes, refusing the whole
// payload otherwise) and never reads its content; the client hands
// the bytes to the `lakko-contacts` dispatcher, which keeps only
// the kinds it accepts on this carrier.
message ServiceEnvelope {
    // The envelope bytes, domain separator included.
    bytes envelope = 1;

    reserved 2 to 7;
}
